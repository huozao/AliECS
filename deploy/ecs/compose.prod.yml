services:
  public-web:
    image: ${PUBLIC_WEB_IMAGE}
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend-api:
        condition: service_healthy

  admin-ui:
    image: ${ADMIN_UI_IMAGE}
    restart: always
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      backend-api:
        condition: service_healthy

  backend-api:
    image: ${BACKEND_API_IMAGE}
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS}
      LOCAL_LOGIN_ENABLED: ${LOCAL_LOGIN_ENABLED:-true}
      MINIAPP_SERVICE_TOKEN: ${MINIAPP_SERVICE_TOKEN:-}
      QUALITY_WEBDAV_01_URL: ${QUALITY_WEBDAV_01_URL:-https://dav.jianguoyun.com/dav/}
      QUALITY_WEBDAV_01_USER: ${QUALITY_WEBDAV_01_USER:-}
      QUALITY_WEBDAV_01_PASS: ${QUALITY_WEBDAV_01_PASS:-}
      QUALITY_REPORT_MAX_UPLOAD_MB: ${QUALITY_REPORT_MAX_UPLOAD_MB:-25}
      BACKUP_REPORT_TOKEN: ${BACKUP_REPORT_TOKEN:-}
      VERSION_DIGEST_FEISHU_APP_ID: ${VERSION_DIGEST_FEISHU_APP_ID:-}
      VERSION_DIGEST_FEISHU_APP_SECRET: ${VERSION_DIGEST_FEISHU_APP_SECRET:-}
      VERSION_DIGEST_FEISHU_RECEIVE_ID: ${VERSION_DIGEST_FEISHU_RECEIVE_ID:-}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      ADMIN_BOOTSTRAP_DISPLAY_NAME: ${ADMIN_BOOTSTRAP_DISPLAY_NAME}
      COUPLE_FEATURE_ENABLED: ${COUPLE_FEATURE_ENABLED:-false}
      COUPLE_ROUTE: ${COUPLE_ROUTE:-/couple/}
      COUPLE_ALLOWED_USERS: ${COUPLE_ALLOWED_USERS:-}
      COUPLE_ALLOWED_EMAILS: ${COUPLE_ALLOWED_EMAILS:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      SHARE_BASE_URL: ${SHARE_BASE_URL:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_UPLOAD_DIR: ${LOCAL_UPLOAD_DIR:-/app/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      WEBDOCK_PHOTO_BASE_URL: ${WEBDOCK_PHOTO_BASE_URL:-http://host.docker.internal:11800}
      WEBDOCK_PHOTO_API_TOKEN: ${WEBDOCK_PHOTO_API_TOKEN:-}
      WEBDOCK_PHOTO_TIMEOUT_SECONDS: ${WEBDOCK_PHOTO_TIMEOUT_SECONDS:-30}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      IMMICH_ENABLED: ${IMMICH_ENABLED:-false}
      IMMICH_BASE_URL: ${IMMICH_BASE_URL:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      IMMICH_TIMEOUT_SECONDS: ${IMMICH_TIMEOUT_SECONDS:-20}
      IMMICH_PROXY_MODE: ${IMMICH_PROXY_MODE:-backend}
      CHANJET_APP_KEY: ${CHANJET_APP_KEY:-}
      CHANJET_APP_SECRET: ${CHANJET_APP_SECRET:-}
      WECOM_COMPANY_A_CORP_ID: ${WECOM_COMPANY_A_CORP_ID:-}
      WECOM_COMPANY_A_APP_SECRET: ${WECOM_COMPANY_A_APP_SECRET:-}
      WECOM_COMPANY_B_CORP_ID: ${WECOM_COMPANY_B_CORP_ID:-}
      WECOM_COMPANY_B_APP_SECRET: ${WECOM_COMPANY_B_APP_SECRET:-}
      WECOM_DOC_ADMIN_USERS: ${WECOM_DOC_ADMIN_USERS:-}
      OPENCLAW_INTERNAL_TOKEN: ${OPENCLAW_INTERNAL_TOKEN:-}
      WECOM_GROUP_MEDIA_DIR: /app/wecom-group-media
      CHANJET_WEBHOOK_AES_KEY: ${CHANJET_WEBHOOK_AES_KEY:-}
      CHANJET_CERTIFICATE: ${CHANJET_CERTIFICATE:-}
      CHANJET_OPEN_TOKEN_FILE: /app/tplus-sync-requests/chanjet_open_token.txt
      CHANJET_EVENT_SPOOL_DIR: ${CHANJET_EVENT_SPOOL_DIR:-/tmp/aliecs-integration-events/chanjet}
      CHANJET_AUTO_EXCHANGE_OAUTH_CODE: ${CHANJET_AUTO_EXCHANGE_OAUTH_CODE:-false}
      TPLUS_BOM_WRITE_ENABLED: ${TPLUS_BOM_WRITE_ENABLED:-false}
      RECIPE_BOM_INPUT_DIR: ${RECIPE_BOM_INPUT_DIR:-/app/tplus-output/excel}
      RECIPE_BOM_INPUT_GLOB: ${RECIPE_BOM_INPUT_GLOB:-*物料清单合并*.xlsx;*bom*.xlsx;*物料清单*.xlsx}
      RECIPE_ACTIVE_BOM_DIR: ${RECIPE_ACTIVE_BOM_DIR:-/app/recipe-active-bom}
      RECIPE_EXPORT_DIR: ${RECIPE_EXPORT_DIR:-/tmp/aliecs-recipe-exports}
      TPLUS_BOM_SYNC_REQUEST_DIR: ${TPLUS_BOM_SYNC_REQUEST_DIR:-/app/tplus-sync-requests}
      OPS_HEALTH_HTTP_TARGETS_JSON: ${OPS_HEALTH_HTTP_TARGETS_JSON:-}
      OPS_HEALTH_BACKEND_URL: ${OPS_HEALTH_BACKEND_URL:-}
      OPS_HEALTH_PUBLIC_WEB_URL: ${OPS_HEALTH_PUBLIC_WEB_URL:-}
      ENV: prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - tplus_sync_output:/app/tplus-output:ro
      - recipe_active_bom:/app/recipe-active-bom
      - tplus_sync_requests:/app/tplus-sync-requests
      - uploads:/app/uploads
      - wecom_group_media:/app/wecom-group-media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 20s
      start_period: 300s
      retries: 10

  doc-sync-worker:
    image: ${DOC_SYNC_WORKER_IMAGE}
    restart: always
    command: ["python", "-m", "app.main", "run-loop"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PYTHONUNBUFFERED: "1"
      DOC_SYNC_INTERVAL_SECONDS: ${DOC_SYNC_INTERVAL_SECONDS:-86400}
      DOC_SYNC_POLL_SECONDS: ${DOC_SYNC_POLL_SECONDS:-30}
      WECOM_ENV_PROFILES: ${WECOM_ENV_PROFILES:-}
      WECOM_COMPANY_A_CORP_ID: ${WECOM_COMPANY_A_CORP_ID:-}
      WECOM_COMPANY_A_APP_SECRET: ${WECOM_COMPANY_A_APP_SECRET:-}
      WECOM_COMPANY_A_APPROVAL_SECRET: ${WECOM_COMPANY_A_APPROVAL_SECRET:-}
      WECOM_COMPANY_A_APP_SECRET_2: ${WECOM_COMPANY_A_APP_SECRET_2:-}
      WECOM_COMPANY_A_APP_SECRETS: ${WECOM_COMPANY_A_APP_SECRETS:-}
      WEDOC_COMPANY_A_DOCID: ${WEDOC_COMPANY_A_DOCID:-}
      WEDOC_COMPANY_A_NAME: ${WEDOC_COMPANY_A_NAME:-}
      WEDOC_COMPANY_A_SHEET_ID: ${WEDOC_COMPANY_A_SHEET_ID:-}
      WEDRIVE_COMPANY_A_SPACEIDS: ${WEDRIVE_COMPANY_A_SPACEIDS:-}
      SMARTSHEET_COMPANY_A_ID: ${SMARTSHEET_COMPANY_A_ID:-}
      SMARTSHEET_COMPANY_A_NAME: ${SMARTSHEET_COMPANY_A_NAME:-}
      SMARTSHEET_COMPANY_A_SHEET_ID: ${SMARTSHEET_COMPANY_A_SHEET_ID:-}
      WECOM_COMPANY_B_CORP_ID: ${WECOM_COMPANY_B_CORP_ID:-}
      WECOM_COMPANY_B_APP_SECRET: ${WECOM_COMPANY_B_APP_SECRET:-}
      WECOM_COMPANY_B_APPROVAL_SECRET: ${WECOM_COMPANY_B_APPROVAL_SECRET:-}
      WECOM_COMPANY_B_APP_SECRET_2: ${WECOM_COMPANY_B_APP_SECRET_2:-}
      WECOM_COMPANY_B_APP_SECRETS: ${WECOM_COMPANY_B_APP_SECRETS:-}
      WECOM_COMPANY_B_GROUPBOT_ID: ${WECOM_COMPANY_B_GROUPBOT_ID:-}
      WECOM_COMPANY_B_GROUPBOT_SECRET: ${WECOM_COMPANY_B_GROUPBOT_SECRET:-}
      WEDOC_COMPANY_B_DOCID: ${WEDOC_COMPANY_B_DOCID:-}
      WEDOC_COMPANY_B_NAME: ${WEDOC_COMPANY_B_NAME:-}
      WEDOC_COMPANY_B_SHEET_ID: ${WEDOC_COMPANY_B_SHEET_ID:-}
      WEDRIVE_COMPANY_B_SPACEIDS: ${WEDRIVE_COMPANY_B_SPACEIDS:-}
      SMARTSHEET_COMPANY_B_ID: ${SMARTSHEET_COMPANY_B_ID:-}
      SMARTSHEET_COMPANY_B_NAME: ${SMARTSHEET_COMPANY_B_NAME:-}
      SMARTSHEET_COMPANY_B_SHEET_ID: ${SMARTSHEET_COMPANY_B_SHEET_ID:-}
      FEISHU_ENV_PROFILES: ${FEISHU_ENV_PROFILES:-}
      FEISHU_COMPANY_A_APP_ID: ${FEISHU_COMPANY_A_APP_ID:-}
      FEISHU_COMPANY_A_APP_SECRET: ${FEISHU_COMPANY_A_APP_SECRET:-}
      FEISHU_COMPANY_A_APP_TOKEN: ${FEISHU_COMPANY_A_APP_TOKEN:-}
      FEISHU_COMPANY_A_TABLE_ID: ${FEISHU_COMPANY_A_TABLE_ID:-}
      FEISHU_COMPANY_A_VIEW_ID: ${FEISHU_COMPANY_A_VIEW_ID:-}
      FEISHU_COMPANY_A_WIKI_NODE_TOKEN: ${FEISHU_COMPANY_A_WIKI_NODE_TOKEN:-}
      FEISHU_COMPANY_A_WIKI_URL: ${FEISHU_COMPANY_A_WIKI_URL:-}
      FEISHU_COMPANY_A_APP_NAME: ${FEISHU_COMPANY_A_APP_NAME:-}
      FEISHU_COMPANY_A_TABLE_NAME: ${FEISHU_COMPANY_A_TABLE_NAME:-}
      FEISHU_SESSION_CONSOLE_APP_TOKEN: ${FEISHU_SESSION_CONSOLE_APP_TOKEN:-}
      FEISHU_SESSION_CONSOLE_MESSAGE_TABLE_ID: ${FEISHU_SESSION_CONSOLE_MESSAGE_TABLE_ID:-}
      FEISHU_SESSION_CONSOLE_TASK_TABLE_ID: ${FEISHU_SESSION_CONSOLE_TASK_TABLE_ID:-}
      FEISHU_SESSION_CONSOLE_SESSION_TABLE_ID: ${FEISHU_SESSION_CONSOLE_SESSION_TABLE_ID:-}
      FEISHU_SESSION_CONSOLE_CHATGPT_PROJECT_URL: ${FEISHU_SESSION_CONSOLE_CHATGPT_PROJECT_URL:-}
      FEISHU_SESSION_CONSOLE_CHATGPT_PROJECT_NAME: ${FEISHU_SESSION_CONSOLE_CHATGPT_PROJECT_NAME:-}
      FEISHU_COMPANY_A_SESSION_CONSOLE_APP_TOKEN: ${FEISHU_COMPANY_A_SESSION_CONSOLE_APP_TOKEN:-}
      FEISHU_COMPANY_A_SESSION_CONSOLE_MESSAGE_TABLE_ID: ${FEISHU_COMPANY_A_SESSION_CONSOLE_MESSAGE_TABLE_ID:-}
      FEISHU_COMPANY_A_SESSION_CONSOLE_TASK_TABLE_ID: ${FEISHU_COMPANY_A_SESSION_CONSOLE_TASK_TABLE_ID:-}
      FEISHU_COMPANY_A_SESSION_CONSOLE_SESSION_TABLE_ID: ${FEISHU_COMPANY_A_SESSION_CONSOLE_SESSION_TABLE_ID:-}
      FEISHU_COMPANY_A_SESSION_CONSOLE_CHATGPT_PROJECT_URL: ${FEISHU_COMPANY_A_SESSION_CONSOLE_CHATGPT_PROJECT_URL:-}
      FEISHU_COMPANY_A_SESSION_CONSOLE_CHATGPT_PROJECT_NAME: ${FEISHU_COMPANY_A_SESSION_CONSOLE_CHATGPT_PROJECT_NAME:-}
      FEISHU_COMPANY_B_APP_ID: ${FEISHU_COMPANY_B_APP_ID:-}
      FEISHU_COMPANY_B_APP_SECRET: ${FEISHU_COMPANY_B_APP_SECRET:-}
      FEISHU_COMPANY_B_APP_TOKEN: ${FEISHU_COMPANY_B_APP_TOKEN:-}
      FEISHU_COMPANY_B_TABLE_ID: ${FEISHU_COMPANY_B_TABLE_ID:-}
      FEISHU_COMPANY_B_VIEW_ID: ${FEISHU_COMPANY_B_VIEW_ID:-}
      FEISHU_COMPANY_B_WIKI_NODE_TOKEN: ${FEISHU_COMPANY_B_WIKI_NODE_TOKEN:-}
      FEISHU_COMPANY_B_WIKI_URL: ${FEISHU_COMPANY_B_WIKI_URL:-}
      FEISHU_COMPANY_B_APP_NAME: ${FEISHU_COMPANY_B_APP_NAME:-}
      FEISHU_COMPANY_B_TABLE_NAME: ${FEISHU_COMPANY_B_TABLE_NAME:-}
      WECOM_DOC_ADMIN_USERS: ${WECOM_DOC_ADMIN_USERS:-}
      WECOM_STRUCTURE_BACKUP_ENABLED: ${WECOM_STRUCTURE_BACKUP_ENABLED:-false}
      WECOM_STRUCTURE_BACKUP_DOCID: ${WECOM_STRUCTURE_BACKUP_DOCID:-}
      WECOM_STRUCTURE_BACKUP_PROFILE: ${WECOM_STRUCTURE_BACKUP_PROFILE:-COMPANY_A}
      WECOM_STRUCTURE_BACKUP_MAX_SHEETS: ${WECOM_STRUCTURE_BACKUP_MAX_SHEETS:-20}
      WECOM_GROUP_MEDIA_DIR: /app/wecom-group-media
    volumes:
      - wecom_group_media:/app/wecom-group-media
    depends_on:
      postgres:
        condition: service_healthy

  tplus-sync-worker:
    image: ${TPLUS_SYNC_WORKER_IMAGE}
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHANJET_BASE_URL: ${CHANJET_BASE_URL:-https://openapi.chanjet.com}
      CHANJET_APP_KEY: ${CHANJET_APP_KEY:-}
      CHANJET_APP_SECRET: ${CHANJET_APP_SECRET:-}
      CHANJET_OPEN_TOKEN: ${CHANJET_OPEN_TOKEN:-}
      CHANJET_OPEN_TOKEN_FILE: /app/sync-requests/chanjet_open_token.txt
      DEFAULT_PAGE_SIZE: ${DEFAULT_PAGE_SIZE:-500}
      REQUEST_TIMEOUT_CONNECT: ${REQUEST_TIMEOUT_CONNECT:-5}
      REQUEST_TIMEOUT_READ: ${REQUEST_TIMEOUT_READ:-30}
      OUTPUT_DIR: /app/output
      DATA_DIR: /app/data
      TPLUS_SYNC_INTERVAL_SECONDS: ${TPLUS_SYNC_INTERVAL_SECONDS:-86400}
      TPLUS_SYNC_POLL_SECONDS: ${TPLUS_SYNC_POLL_SECONDS:-30}
      TPLUS_DB_SYNC_REQUESTS_ENABLED: ${TPLUS_DB_SYNC_REQUESTS_ENABLED:-true}
      TPLUS_BOM_SYNC_REQUEST_DIR: ${TPLUS_BOM_SYNC_REQUEST_DIR:-/app/sync-requests}
    volumes:
      - tplus_sync_data:/app/data
      - tplus_sync_output:/app/output
      - tplus_sync_requests:/app/sync-requests

  tplus-write-worker:
    image: ${TPLUS_SYNC_WORKER_IMAGE}
    restart: always
    command: ["python", "-m", "tplus_datahub.jobs.bom_write_worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHANJET_BASE_URL: ${CHANJET_BASE_URL:-https://openapi.chanjet.com}
      CHANJET_APP_KEY: ${CHANJET_APP_KEY:-}
      CHANJET_APP_SECRET: ${CHANJET_APP_SECRET:-}
      CHANJET_OPEN_TOKEN: ${CHANJET_OPEN_TOKEN:-}
      CHANJET_OPEN_TOKEN_FILE: /app/sync-requests/chanjet_open_token.txt
      REQUEST_TIMEOUT_CONNECT: ${REQUEST_TIMEOUT_CONNECT:-5}
      REQUEST_TIMEOUT_READ: ${REQUEST_TIMEOUT_READ:-30}
      OUTPUT_DIR: /app/output
      TPLUS_BOM_WRITE_ENABLED: ${TPLUS_BOM_WRITE_ENABLED:-false}
      TPLUS_BOM_WRITE_POLL_SECONDS: ${TPLUS_BOM_WRITE_POLL_SECONDS:-5}
    volumes:
      - tplus_sync_output:/app/output
      - tplus_sync_requests:/app/sync-requests:ro
    depends_on:
      postgres:
        condition: service_healthy

  mcp-coding-server:
    image: ${MCP_CODING_SERVER_IMAGE}
    restart: always
    environment:
      MCP_PORT: "8090"
      PYTHONUNBUFFERED: "1"
      # Reaches the 开发机 executor through the reverse SSH tunnel. Both are
      # empty until the tunnel is provisioned; tools then degrade gracefully.
      EXECUTOR_BASE_URL: ${EXECUTOR_BASE_URL:-}
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:-}
      EXECUTOR_TIMEOUT_SECONDS: ${EXECUTOR_TIMEOUT_SECONDS:-20}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-}
      MCP_OAUTH_PASSPHRASE: ${MCP_OAUTH_PASSPHRASE:-}
      MCP_OAUTH_SIGNING_SECRET: ${MCP_OAUTH_SIGNING_SECRET:-}
      MCP_OAUTH_STORE_PATH: ${MCP_OAUTH_STORE_PATH:-/data/oauth/oauth.db}
      MCP_OAUTH_ACCESS_TTL: ${MCP_OAUTH_ACCESS_TTL:-3600}
      MCP_OAUTH_REFRESH_TTL: ${MCP_OAUTH_REFRESH_TTL:-2592000}
      MCP_OAUTH_CODE_TTL: ${MCP_OAUTH_CODE_TTL:-600}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mcp_oauth_data:/data/oauth
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=10).close()"]
      interval: 30s
      timeout: 20s
      retries: 5

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  tplus_sync_data:
  tplus_sync_output:
  recipe_active_bom:
  tplus_sync_requests:
  mcp_oauth_data:
  uploads:
  wecom_group_media:
