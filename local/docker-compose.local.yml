services:
  public-web:
    build: ../services/public-web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend-api:
        condition: service_healthy

  admin-ui:
    build: ../services/admin-ui
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      backend-api:
        condition: service_healthy

  backend-api:
    build: ../services/backend-api
    env_file:
      - path: ./.env.local
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      ENV: ${APP_ENV:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/app}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-local-dev-secret-change-in-prod}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-28800}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-admin123}
      ADMIN_BOOTSTRAP_DISPLAY_NAME: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:-系统管理员}
      COUPLE_FEATURE_ENABLED: ${COUPLE_FEATURE_ENABLED:-true}
      COUPLE_ROUTE: ${COUPLE_ROUTE:-/couple/}
      COUPLE_ALLOWED_USERS: ${COUPLE_ALLOWED_USERS:-admin}
      COUPLE_ALLOWED_EMAILS: ${COUPLE_ALLOWED_EMAILS:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  doc-sync-worker:
    build: ../services/doc-sync-worker
    env_file:
      - path: ./.env.local
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/app}
      WECOM_ENV_PROFILES: ${WECOM_ENV_PROFILES:-}
      WECOM_COMPANY_A_CORP_ID: ${WECOM_COMPANY_A_CORP_ID:-}
      WECOM_COMPANY_A_APP_SECRET: ${WECOM_COMPANY_A_APP_SECRET:-}
      WECOM_COMPANY_A_APP_SECRET_2: ${WECOM_COMPANY_A_APP_SECRET_2:-}
      WECOM_COMPANY_A_APP_SECRETS: ${WECOM_COMPANY_A_APP_SECRETS:-}
      WEDOC_COMPANY_A_DOCID: ${WEDOC_COMPANY_A_DOCID:-}
      WEDOC_COMPANY_A_NAME: ${WEDOC_COMPANY_A_NAME:-}
      WEDOC_COMPANY_A_SHEET_ID: ${WEDOC_COMPANY_A_SHEET_ID:-}
      WEDRIVE_COMPANY_A_SPACEIDS: ${WEDRIVE_COMPANY_A_SPACEIDS:-}
      SMARTSHEET_COMPANY_A_ID: ${SMARTSHEET_COMPANY_A_ID:-}
      SMARTSHEET_COMPANY_A_NAME: ${SMARTSHEET_COMPANY_A_NAME:-}
      SMARTSHEET_COMPANY_A_SHEET_ID: ${SMARTSHEET_COMPANY_A_SHEET_ID:-}
      WECOM_COMPANY_B_CORP_ID: ${WECOM_COMPANY_B_CORP_ID:-}
      WECOM_COMPANY_B_APP_SECRET: ${WECOM_COMPANY_B_APP_SECRET:-}
      WECOM_COMPANY_B_APP_SECRET_2: ${WECOM_COMPANY_B_APP_SECRET_2:-}
      WECOM_COMPANY_B_APP_SECRETS: ${WECOM_COMPANY_B_APP_SECRETS:-}
      WEDOC_COMPANY_B_DOCID: ${WEDOC_COMPANY_B_DOCID:-}
      WEDOC_COMPANY_B_NAME: ${WEDOC_COMPANY_B_NAME:-}
      WEDOC_COMPANY_B_SHEET_ID: ${WEDOC_COMPANY_B_SHEET_ID:-}
      WEDRIVE_COMPANY_B_SPACEIDS: ${WEDRIVE_COMPANY_B_SPACEIDS:-}
      SMARTSHEET_COMPANY_B_ID: ${SMARTSHEET_COMPANY_B_ID:-}
      SMARTSHEET_COMPANY_B_NAME: ${SMARTSHEET_COMPANY_B_NAME:-}
      SMARTSHEET_COMPANY_B_SHEET_ID: ${SMARTSHEET_COMPANY_B_SHEET_ID:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
