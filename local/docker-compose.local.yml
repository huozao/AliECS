services:
  public-web:
    build: ../services/public-web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend-api:
        condition: service_healthy

  admin-ui:
    build: ../services/admin-ui
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      backend-api:
        condition: service_healthy

  backend-api:
    build: ../services/backend-api
    env_file:
      - path: ./.env.local
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      ENV: ${APP_ENV:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/app}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-local-dev-secret-change-in-prod}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-28800}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-admin123}
      ADMIN_BOOTSTRAP_DISPLAY_NAME: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:-系统管理员}
      COUPLE_FEATURE_ENABLED: ${COUPLE_FEATURE_ENABLED:-true}
      COUPLE_ROUTE: ${COUPLE_ROUTE:-/couple/}
      COUPLE_ALLOWED_USERS: ${COUPLE_ALLOWED_USERS:-admin}
      COUPLE_ALLOWED_EMAILS: ${COUPLE_ALLOWED_EMAILS:-}
      SHARE_BASE_URL: ${SHARE_BASE_URL:-http://localhost:8080}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_UPLOAD_DIR: ${LOCAL_UPLOAD_DIR:-/app/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      WEBDOCK_PHOTO_BASE_URL: ${WEBDOCK_PHOTO_BASE_URL:-http://host.docker.internal:11800}
      WEBDOCK_PHOTO_API_TOKEN: ${WEBDOCK_PHOTO_API_TOKEN:-}
      WEBDOCK_PHOTO_TIMEOUT_SECONDS: ${WEBDOCK_PHOTO_TIMEOUT_SECONDS:-30}
      IMMICH_ENABLED: ${IMMICH_ENABLED:-false}
      IMMICH_BASE_URL: ${IMMICH_BASE_URL:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      IMMICH_KEY_ENCRYPTION_SECRET: ${IMMICH_KEY_ENCRYPTION_SECRET:-}
      COUPLE_IMMICH_FAMILY_ALBUM_ID: ${COUPLE_IMMICH_FAMILY_ALBUM_ID:-}
      IMMICH_TIMEOUT_SECONDS: ${IMMICH_TIMEOUT_SECONDS:-20}
      IMMICH_PROXY_MODE: ${IMMICH_PROXY_MODE:-backend}
      CHANJET_APP_KEY: ${CHANJET_APP_KEY:-}
      CHANJET_APP_SECRET: ${CHANJET_APP_SECRET:-}
      CHANJET_WEBHOOK_AES_KEY: ${CHANJET_WEBHOOK_AES_KEY:-}
      CHANJET_EVENT_SPOOL_DIR: ${CHANJET_EVENT_SPOOL_DIR:-/tmp/aliecs-integration-events/chanjet}
      CHANJET_AUTO_EXCHANGE_OAUTH_CODE: ${CHANJET_AUTO_EXCHANGE_OAUTH_CODE:-false}
      RECIPE_BOM_INPUT_DIR: ${RECIPE_BOM_INPUT_DIR:-/app/tplus-output/excel}
      RECIPE_BOM_INPUT_GLOB: ${RECIPE_BOM_INPUT_GLOB:-*物料清单合并*.xlsx;*bom*.xlsx;*物料清单*.xlsx}
      RECIPE_ACTIVE_BOM_DIR: ${RECIPE_ACTIVE_BOM_DIR:-/app/recipe-active-bom}
      RECIPE_EXPORT_DIR: ${RECIPE_EXPORT_DIR:-/tmp/aliecs-recipe-exports}
      TPLUS_BOM_SYNC_REQUEST_DIR: ${TPLUS_BOM_SYNC_REQUEST_DIR:-/app/tplus-sync-requests}
      OPS_HEALTH_HTTP_TARGETS_JSON: ${OPS_HEALTH_HTTP_TARGETS_JSON:-}
      OPENCLAW_INTERNAL_TOKEN: ${OPENCLAW_INTERNAL_TOKEN:-local-openclaw-internal-token}
      WECOM_GROUP_MEDIA_DIR: /app/wecom-group-media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../services/tplus-sync-worker/output:/app/tplus-output:ro
      - recipe_active_bom:/app/recipe-active-bom
      - tplus_sync_requests:/app/tplus-sync-requests
      - uploads:/app/uploads
      - wecom_group_media:/app/wecom-group-media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  doc-sync-worker:
    build: ../services/doc-sync-worker
    env_file:
      - path: ./.env.local
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/app}
      SYNC_SCHEDULER_MODE: ${DOC_SYNC_SCHEDULER_MODE:-legacy}
      SYNC_ALERT_CHAT_ID: ${SYNC_ALERT_CHAT_ID:-}
      SYNC_ALERT_FEISHU_PROFILE: ${SYNC_ALERT_FEISHU_PROFILE:-COMPANY_A}
      SYNC_ALERT_ESCALATION_SECONDS: ${SYNC_ALERT_ESCALATION_SECONDS:-21600}
      SYNC_ARTIFACT_GRACE_SECONDS: ${SYNC_ARTIFACT_GRACE_SECONDS:-300}
      CHANJET_OPEN_TOKEN_FILE: /app/tplus-sync-requests/chanjet_open_token.txt
      WECOM_ENV_PROFILES: ${WECOM_ENV_PROFILES:-}
      WECOM_COMPANY_A_CORP_ID: ${WECOM_COMPANY_A_CORP_ID:-}
      WECOM_COMPANY_A_APP_SECRET: ${WECOM_COMPANY_A_APP_SECRET:-}
      WECOM_COMPANY_A_APP_SECRET_2: ${WECOM_COMPANY_A_APP_SECRET_2:-}
      WECOM_COMPANY_A_APP_SECRETS: ${WECOM_COMPANY_A_APP_SECRETS:-}
      WEDOC_COMPANY_A_DOCID: ${WEDOC_COMPANY_A_DOCID:-}
      WEDOC_COMPANY_A_NAME: ${WEDOC_COMPANY_A_NAME:-}
      WEDOC_COMPANY_A_SHEET_ID: ${WEDOC_COMPANY_A_SHEET_ID:-}
      WEDRIVE_COMPANY_A_SPACEIDS: ${WEDRIVE_COMPANY_A_SPACEIDS:-}
      SMARTSHEET_COMPANY_A_ID: ${SMARTSHEET_COMPANY_A_ID:-}
      SMARTSHEET_COMPANY_A_NAME: ${SMARTSHEET_COMPANY_A_NAME:-}
      SMARTSHEET_COMPANY_A_SHEET_ID: ${SMARTSHEET_COMPANY_A_SHEET_ID:-}
      WECOM_COMPANY_B_CORP_ID: ${WECOM_COMPANY_B_CORP_ID:-}
      WECOM_COMPANY_B_APP_SECRET: ${WECOM_COMPANY_B_APP_SECRET:-}
      WECOM_COMPANY_B_APP_SECRET_2: ${WECOM_COMPANY_B_APP_SECRET_2:-}
      WECOM_COMPANY_B_APP_SECRETS: ${WECOM_COMPANY_B_APP_SECRETS:-}
      WEDOC_COMPANY_B_DOCID: ${WEDOC_COMPANY_B_DOCID:-}
      WEDOC_COMPANY_B_NAME: ${WEDOC_COMPANY_B_NAME:-}
      WEDOC_COMPANY_B_SHEET_ID: ${WEDOC_COMPANY_B_SHEET_ID:-}
      WEDRIVE_COMPANY_B_SPACEIDS: ${WEDRIVE_COMPANY_B_SPACEIDS:-}
      SMARTSHEET_COMPANY_B_ID: ${SMARTSHEET_COMPANY_B_ID:-}
      SMARTSHEET_COMPANY_B_NAME: ${SMARTSHEET_COMPANY_B_NAME:-}
      SMARTSHEET_COMPANY_B_SHEET_ID: ${SMARTSHEET_COMPANY_B_SHEET_ID:-}
      FEISHU_ENV_PROFILES: ${FEISHU_ENV_PROFILES:-}
      FEISHU_COMPANY_A_APP_ID: ${FEISHU_COMPANY_A_APP_ID:-}
      FEISHU_COMPANY_A_APP_SECRET: ${FEISHU_COMPANY_A_APP_SECRET:-}
      FEISHU_COMPANY_A_APP_TOKEN: ${FEISHU_COMPANY_A_APP_TOKEN:-}
      FEISHU_COMPANY_A_TABLE_ID: ${FEISHU_COMPANY_A_TABLE_ID:-}
      FEISHU_COMPANY_A_VIEW_ID: ${FEISHU_COMPANY_A_VIEW_ID:-}
      FEISHU_COMPANY_A_WIKI_NODE_TOKEN: ${FEISHU_COMPANY_A_WIKI_NODE_TOKEN:-}
      FEISHU_COMPANY_A_WIKI_URL: ${FEISHU_COMPANY_A_WIKI_URL:-}
      FEISHU_COMPANY_A_APP_NAME: ${FEISHU_COMPANY_A_APP_NAME:-}
      FEISHU_COMPANY_A_TABLE_NAME: ${FEISHU_COMPANY_A_TABLE_NAME:-}
      FEISHU_COMPANY_B_APP_ID: ${FEISHU_COMPANY_B_APP_ID:-}
      FEISHU_COMPANY_B_APP_SECRET: ${FEISHU_COMPANY_B_APP_SECRET:-}
      FEISHU_COMPANY_B_APP_TOKEN: ${FEISHU_COMPANY_B_APP_TOKEN:-}
      FEISHU_COMPANY_B_TABLE_ID: ${FEISHU_COMPANY_B_TABLE_ID:-}
      FEISHU_COMPANY_B_VIEW_ID: ${FEISHU_COMPANY_B_VIEW_ID:-}
      FEISHU_COMPANY_B_WIKI_NODE_TOKEN: ${FEISHU_COMPANY_B_WIKI_NODE_TOKEN:-}
      FEISHU_COMPANY_B_WIKI_URL: ${FEISHU_COMPANY_B_WIKI_URL:-}
      FEISHU_COMPANY_B_APP_NAME: ${FEISHU_COMPANY_B_APP_NAME:-}
      FEISHU_COMPANY_B_TABLE_NAME: ${FEISHU_COMPANY_B_TABLE_NAME:-}
      WECOM_GROUP_MEDIA_DIR: /app/wecom-group-media
    volumes:
      - wecom_group_media:/app/wecom-group-media
      - tplus_sync_requests:/app/tplus-sync-requests:ro
      - ../services/tplus-sync-worker/output:/app/tplus-output:ro
    depends_on:
      postgres:
        condition: service_healthy

  tplus-sync-worker:
    build: ../services/tplus-sync-worker
    profiles:
      - tplus
    env_file:
      - path: ./.env.local
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/app}
      CHANJET_BASE_URL: ${CHANJET_BASE_URL:-https://openapi.chanjet.com}
      CHANJET_APP_KEY: ${CHANJET_APP_KEY:-}
      CHANJET_APP_SECRET: ${CHANJET_APP_SECRET:-}
      CHANJET_OPEN_TOKEN: ${CHANJET_OPEN_TOKEN:-}
      DEFAULT_PAGE_SIZE: ${DEFAULT_PAGE_SIZE:-500}
      REQUEST_TIMEOUT_CONNECT: ${REQUEST_TIMEOUT_CONNECT:-5}
      REQUEST_TIMEOUT_READ: ${REQUEST_TIMEOUT_READ:-30}
      OUTPUT_DIR: /app/output
      DATA_DIR: /app/data
      SYNC_SCHEDULER_MODE: ${TPLUS_SYNC_SCHEDULER_MODE:-legacy}
      TPLUS_SYNC_INTERVAL_SECONDS: ${TPLUS_SYNC_INTERVAL_SECONDS:-86400}
      TPLUS_SYNC_POLL_SECONDS: ${TPLUS_SYNC_POLL_SECONDS:-30}
      TPLUS_DB_SYNC_REQUESTS_ENABLED: ${TPLUS_DB_SYNC_REQUESTS_ENABLED:-true}
      TPLUS_BOM_SYNC_REQUEST_DIR: ${TPLUS_BOM_SYNC_REQUEST_DIR:-/app/sync-requests}
    volumes:
      - ../services/tplus-sync-worker/data:/app/data
      - ../services/tplus-sync-worker/output:/app/output
      - tplus_sync_requests:/app/sync-requests

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  recipe_active_bom:
  tplus_sync_requests:
  uploads:
  wecom_group_media:
