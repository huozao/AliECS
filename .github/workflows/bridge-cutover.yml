name: bridge-cutover

# 一键切换 txecs 上 openclaw-bridge 的运行镜像（构建仍由 release-deploy 完成）。
# 人工只负责扣一次扳机；workflow 从所选 Git ref 自动解析内容标签和 OCI digest。
# 失败自动回滚。bridge 是微信/飞书链路咽喉，不随每次 main push 自动切换。

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "P1 才可输入 CUTOVER_TXECS"
        required: true
        type: string

concurrency:
  group: bridge-cutover
  cancel-in-progress: false

jobs:
  cutover:
    if: ${{ inputs.confirmation == 'CUTOVER_TXECS' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve bridge image from Git commit
        id: image
        run: |
          CONTENT_TAG="t-$(git rev-parse 'HEAD:deploy/openclaw-bridge' | cut -c1-12)"
          echo "source_ref=${{ vars.TCR_BASE }}/openclaw-bridge:${CONTENT_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=sha-${GITHUB_SHA:0:12}@${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Cut over openclaw-bridge on txecs
        uses: appleboy/ssh-action@v1.2.0
        env:
          BRIDGE_SOURCE_REF: ${{ steps.image.outputs.source_ref }}
          BRIDGE_VERSION: ${{ steps.image.outputs.version }}
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          command_timeout: 15m
          envs: BRIDGE_SOURCE_REF,BRIDGE_VERSION
          script: |
            set -euo pipefail
            : "${BRIDGE_SOURCE_REF:?missing TCR bridge image}"
            STATE_FILE=/srv/business-cn/state/bridge-release.env
            STATE_BACKUP=/srv/business-cn/state/bridge-release.env.bak.cutover
            COMPOSE=/home/ubuntu/infra/server/compose.bridge.yml

            # Pull and resolve the immutable digest before touching the live service.
            sudo docker pull "$BRIDGE_SOURCE_REF"
            BRIDGE_IMAGE="$(sudo docker image inspect --format '{{index .RepoDigests 0}}' "$BRIDGE_SOURCE_REF")"
            if [[ "$BRIDGE_IMAGE" != *@sha256:* ]]; then
              echo "[cutover] invalid resolved digest: $BRIDGE_IMAGE" >&2
              exit 1
            fi

            sudo test -f "$STATE_FILE" || {
              echo "[cutover] missing P0 bridge release state: $STATE_FILE" >&2
              exit 1
            }
            sudo cp -a "$STATE_FILE" "$STATE_BACKUP"
            PREV="$(sudo sed -n 's/^OPENCLAW_BRIDGE_IMAGE=//p' "$STATE_BACKUP")"
            echo "[cutover] ${PREV} -> ${BRIDGE_IMAGE} (${BRIDGE_VERSION})"

            STATE_TMP="${STATE_FILE}.tmp"
            sudo sh -c 'printf "OPENCLAW_BRIDGE_IMAGE=%s\nOPENCLAW_BRIDGE_VERSION=%s\n" "$1" "$2" > "$3"' sh "$BRIDGE_IMAGE" "$BRIDGE_VERSION" "$STATE_TMP"
            sudo chmod 600 "$STATE_TMP"
            sudo mv -f "$STATE_TMP" "$STATE_FILE"
            sudo docker rm -f openclaw-bridge >/dev/null 2>&1 || true
            sudo docker compose -f "$COMPOSE" --env-file "$STATE_FILE" up -d

            ok=0
            for i in $(seq 1 12); do
              if curl -fsS -m 5 http://127.0.0.1:18080/v1/models >/dev/null 2>&1; then
                ok=1; break
              fi
              sleep 5
            done
            if [ "$ok" = "1" ]; then
              echo "[cutover] bridge :18080 healthy on ${BRIDGE_IMAGE}"
              sudo docker ps --format '{{.Names}}|{{.Image}}|{{.Status}}' | grep openclaw-bridge
            else
              echo "[cutover] HEALTH FAILED — rolling back to ${PREV}"
              sudo cp -a "$STATE_BACKUP" "$STATE_FILE"
              sudo docker rm -f openclaw-bridge >/dev/null 2>&1 || true
              sudo docker compose -f "$COMPOSE" --env-file "$STATE_FILE" up -d
              exit 1
            fi
