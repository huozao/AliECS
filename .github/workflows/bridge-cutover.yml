name: bridge-cutover

# 一键切换 txecs 上 openclaw-bridge 的运行镜像（构建仍由 release-deploy 完成）。
# workflow 从所选 Git ref 自动解析内容标签和 OCI digest，失败自动回滚。
#
# 两个入口：
#   - workflow_call：release-deploy 在 `deploy/openclaw-bridge/**` 真的变了时自动调用。
#     bridge 是微信/飞书链路咽喉，所以仍不随每次 main push 切换——只有 bridge 自己的
#     内容树 hash 变了才切，其余合并完全不碰它。
#   - workflow_dispatch：回滚、重切、或切到非 main 的 ref 时人工扣扳机。

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "P1 才可输入 CUTOVER_TXECS"
        required: true
        type: string
  workflow_call:
    inputs:
      confirmation:
        description: "调用方必须显式传 CUTOVER_TXECS，与人工入口共用同一道闸"
        required: true
        type: string

concurrency:
  group: bridge-cutover
  cancel-in-progress: false

jobs:
  cutover:
    if: ${{ inputs.confirmation == 'CUTOVER_TXECS' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve bridge image from Git commit
        id: image
        run: |
          CONTENT_TAG="t-$(git rev-parse 'HEAD:deploy/openclaw-bridge' | cut -c1-12)"
          echo "source_ref=${{ vars.TCR_BASE }}/openclaw-bridge:${CONTENT_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=sha-${GITHUB_SHA:0:12}@${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Cut over openclaw-bridge on txecs
        uses: appleboy/ssh-action@v1.2.0
        env:
          BRIDGE_SOURCE_REF: ${{ steps.image.outputs.source_ref }}
          BRIDGE_VERSION: ${{ steps.image.outputs.version }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          command_timeout: 15m
          envs: BRIDGE_SOURCE_REF,BRIDGE_VERSION,TCR_USERNAME,TCR_PASSWORD
          script: |
            set -euo pipefail
            : "${BRIDGE_SOURCE_REF:?missing TCR bridge image}"
            : "${TCR_USERNAME:?missing TCR pull username}"
            : "${TCR_PASSWORD:?missing TCR pull password}"
            STATE_FILE=/srv/internal-stack/release.env
            STATE_BACKUP=/srv/internal-stack/release.env.bak.cutover
            COMPOSE=/srv/openclaw-bridge/docker-compose.yml
            SERVICE=txecs-openclaw-bridge.service

            # Pull and resolve the immutable digest before touching the live service.
            TCR_REGISTRY="${BRIDGE_SOURCE_REF%%/*}"
            printf '%s' "$TCR_PASSWORD" \
              | sudo docker login "$TCR_REGISTRY" --username "$TCR_USERNAME" --password-stdin
            trap 'sudo docker logout "$TCR_REGISTRY" >/dev/null 2>&1 || true' EXIT
            sudo docker pull "$BRIDGE_SOURCE_REF"
            BRIDGE_IMAGE="$(sudo docker image inspect --format '{{index .RepoDigests 0}}' "$BRIDGE_SOURCE_REF")"
            if [[ "$BRIDGE_IMAGE" != *@sha256:* ]]; then
              echo "[cutover] invalid resolved digest: $BRIDGE_IMAGE" >&2
              exit 1
            fi

            sudo test -f "$STATE_FILE" || {
              echo "[cutover] missing P0 bridge release state: $STATE_FILE" >&2
              exit 1
            }
            sudo cp -a "$STATE_FILE" "$STATE_BACKUP"
            PREV="$(sudo sed -n 's/^OPENCLAW_BRIDGE_IMAGE=//p' "$STATE_BACKUP")"
            echo "[cutover] ${PREV} -> ${BRIDGE_IMAGE} (${BRIDGE_VERSION})"

            rollback() {
              echo "[cutover] rolling back to ${PREV}"
              sudo cp -a "$STATE_BACKUP" "$STATE_FILE"
              sudo systemctl restart "$SERVICE"
            }

            STATE_TMP="${STATE_FILE}.tmp"
            sudo python3 - "$STATE_BACKUP" "$STATE_TMP" "$BRIDGE_IMAGE" "$BRIDGE_VERSION" <<'PY'
            import pathlib
            import sys

            source, target, image, version = sys.argv[1:]
            replacements = {
                "OPENCLAW_BRIDGE_IMAGE": image,
                "OPENCLAW_BRIDGE_VERSION": version,
            }
            lines = pathlib.Path(source).read_text(encoding="utf-8").splitlines()
            output = []
            seen = set()
            for line in lines:
                key = line.split("=", 1)[0] if "=" in line else ""
                if key in replacements:
                    if key not in seen:
                        output.append(f"{key}={replacements[key]}")
                        seen.add(key)
                else:
                    output.append(line)
            for key, value in replacements.items():
                if key not in seen:
                    output.append(f"{key}={value}")
            pathlib.Path(target).write_text("\n".join(output) + "\n", encoding="utf-8")
            PY
            sudo chmod 600 "$STATE_TMP"
            # Validate the exact next state while the current bridge is still live.
            # This catches missing env files and compose drift before removal.
            sudo docker compose -f "$COMPOSE" --env-file "$STATE_TMP" config >/dev/null
            sudo mv -f "$STATE_TMP" "$STATE_FILE"
            if ! sudo systemctl restart "$SERVICE"; then
              rollback
              exit 1
            fi

            ok=0
            for i in $(seq 1 12); do
              if curl -fsS -m 5 http://127.0.0.1:18080/v1/models >/dev/null 2>&1; then
                ok=1; break
              fi
              sleep 5
            done
            if [ "$ok" = "1" ]; then
              RUNNING_IMAGE="$(sudo docker inspect --format '{{.Config.Image}}' openclaw-bridge)"
              if [ "$RUNNING_IMAGE" != "$BRIDGE_IMAGE" ]; then
                echo "[cutover] runtime image mismatch: expected=${BRIDGE_IMAGE} actual=${RUNNING_IMAGE}" >&2
                rollback
                exit 1
              fi
              echo "[cutover] bridge :18080 healthy on ${BRIDGE_IMAGE}"
              sudo docker ps --format '{{.Names}}|{{.Image}}|{{.Status}}' | grep openclaw-bridge
            else
              echo "[cutover] HEALTH FAILED — rolling back to ${PREV}"
              rollback
              exit 1
            fi
