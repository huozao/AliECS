name: PR 自动版本说明

on:
  pull_request_target:
    types: [opened, reopened, edited]

jobs:
  update-pr-body:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: 自动补充版本说明
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const createdAt = new Date(pr.created_at);
            const year = createdAt.getUTCFullYear();
            const month = String(createdAt.getUTCMonth() + 1).padStart(2, '0');
            const day = String(createdAt.getUTCDate()).padStart(2, '0');
            const from = `${year}-01-01`;
            const to = `${year}-12-31`;

            const query = `repo:${context.repo.owner}/${context.repo.repo} is:pr created:${from}..${to}`;
            const search = await github.rest.search.issuesAndPullRequests({
              q: query,
              per_page: 1,
            });
            const yearlyCount = search.data.total_count;
            const serial = String(yearlyCount).padStart(3, '0');
            const version = `V${year}${month}${day}${serial}`;

            const markerStart = '<!-- auto-version:start -->';
            const markerEnd = '<!-- auto-version:end -->';
            const block = `${markerStart}\n## 自动版本信息\n- 计划发布版本：\`${version}\`\n${markerEnd}`;
            let body = pr.body || '';
            const regex = new RegExp(`${markerStart}[\\s\\S]*?${markerEnd}`,'m');
            body = regex.test(body) ? body.replace(regex, block) : `${block}\n\n${body}`;
            await github.rest.pulls.update({ owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, body });
