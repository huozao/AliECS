name: PR 自动版本说明

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

jobs:
  update-pr-body:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: 自动补充版本说明
        uses: actions/github-script@v7
        env:
          VERSION_TEXT: ${{ hashFiles('VERSION') }}
        with:
          script: |
            const fs = require('fs');
            let version = '';
            try {
              version = fs.readFileSync('VERSION', 'utf8').trim();
            } catch (e) {
              version = '';
            }
            if (!version) return;

            const pr = context.payload.pull_request;
            const markerStart = '<!-- auto-version:start -->';
            const markerEnd = '<!-- auto-version:end -->';
            const block = `${markerStart}\n## 自动版本信息\n- 计划发布版本：\`${version}\`\n${markerEnd}`;
            let body = pr.body || '';
            const regex = new RegExp(`${markerStart}[\\s\\S]*?${markerEnd}`,'m');
            if (regex.test(body)) {
              body = body.replace(regex, block);
            } else {
              body = `${block}\n\n${body}`;
            }
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body,
            });
