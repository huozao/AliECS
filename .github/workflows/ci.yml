name: 持续集成检查

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 版本记录检查
        run: python scripts/validate_version.py

      - name: Python 语法检查
        run: |
          python -m py_compile services/backend-api/app/main.py sync-pipeline/main_flow.py
          python -m compileall services/doc-sync-worker/app

      - name: Python 单元测试
        run: |
          python -m pip install -r services/doc-sync-worker/requirements.txt
          python -m unittest discover -s tests

      - name: Shell 语法检查
        run: bash -n deploy/ecs/auto-sync.sh deploy/ecs/deploy.sh deploy/ecs/migrate.sh deploy/ecs/healthcheck.sh deploy/ecs/rollback.sh deploy/ecs/post-deploy-smoke.sh

      - name: Compose 配置检查（local）
        run: docker compose -f local/docker-compose.local.yml config >/dev/null

      - name: Compose 配置检查（prod）
        run: docker compose --env-file deploy/ecs/runtime.env.example -f deploy/ecs/compose.prod.yml config >/dev/null

      - name: 构建本地镜像
        run: docker compose -f local/docker-compose.local.yml build
