name: 持续集成检查

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 导航一致性与红绿测试
        run: |
          python scripts/check_navigation.py
          python -m unittest discover -s tests -p "test_*navigation*.py"

      - name: PR 导航影响记录
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          python scripts/check_nav_impact.py --text-file "$RUNNER_TEMP/pr-body.txt"

      - name: Nav Impact 红绿测试
        run: python -m unittest discover -s tests -p test_nav_impact.py

      - name: 版本记录检查
        run: python scripts/validate_version.py

      - name: Python 语法检查
        run: |
          python -m py_compile services/backend-api/app/main.py sync-pipeline/main_flow.py
          python -m compileall services/doc-sync-worker/app

      - name: Python 单元测试
        run: |
          python -m pip install -r services/backend-api/requirements.txt
          python -m pip install -r services/doc-sync-worker/requirements.txt
          python -m pip install -r services/mcp-coding-server/requirements.txt
          python -m pip install -r services/coding-executor/requirements.txt
          python -m pip install httpx==0.28.1
          python -m pip install pytest==9.0.3
          # 用 pytest 而不是 unittest discover：discover 只收 TestCase 子类，收不到
          # 裸函数式用例（`def test_x()`）。2026-08-31 实测 discover 跑 1051 个、
          # pytest 收 1412 个，差的 355 个分布在 18 个文件里，CI 一个都没跑过——
          # 其中包括 test_backend_gold_spread_alerts.py 的全部 20 个用例。
          python -m pytest tests -q
          (cd services/tplus-sync-worker && PYTHONPATH=src:. python -m unittest discover -s tests -v)

      - name: Shell 语法检查
        run: bash -n deploy/ecs/auto-sync.sh deploy/ecs/deploy.sh deploy/ecs/migrate.sh deploy/ecs/healthcheck.sh deploy/ecs/rollback.sh deploy/ecs/post-deploy-smoke.sh deploy/ecs/collect-diagnostics.sh

      - name: Compose 配置检查（local）
        run: docker compose -f local/docker-compose.local.yml config >/dev/null

      - name: Compose 配置检查（prod）
        run: docker compose --env-file deploy/ecs/runtime.env.example -f deploy/ecs/compose.prod.yml config >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build public-web image
        uses: docker/build-push-action@v6
        with:
          context: services/public-web
          push: false
          cache-from: type=gha,scope=public-web
          cache-to: type=gha,mode=max,scope=public-web

      - name: Build admin-ui image
        uses: docker/build-push-action@v6
        with:
          context: services/admin-ui
          push: false
          cache-from: type=gha,scope=admin-ui
          cache-to: type=gha,mode=max,scope=admin-ui

      - name: Build backend-api image
        uses: docker/build-push-action@v6
        with:
          context: services/backend-api
          push: false
          cache-from: type=gha,scope=backend-api
          cache-to: type=gha,mode=max,scope=backend-api

      - name: Build doc-sync-worker image
        uses: docker/build-push-action@v6
        with:
          context: services/doc-sync-worker
          push: false
          cache-from: type=gha,scope=doc-sync-worker
          cache-to: type=gha,mode=max,scope=doc-sync-worker

  migration-dry-run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/backend-api/requirements.txt
          python -m pip install -r services/doc-sync-worker/requirements.txt
          python -m pip install -r services/tplus-sync-worker/requirements.txt
          python -m pip install httpx==0.28.1
          python -m pip install pytest==9.0.3

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply all migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "Applying $f"
            PGPASSWORD=app psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U app -d app -f "$f"
          done

      - name: Run sync job platform integration test
        env:
          DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app
          SYNC_JOB_PLATFORM_INTEGRATION: "1"
        run: python -m unittest discover -s tests -p "test_sync_job_platform_integration.py" -v

      - name: Run sync center read integration test
        env:
          DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app
          SYNC_JOB_PLATFORM_INTEGRATION: "1"
        run: python -m unittest discover -s tests -p "test_sync_read_api_integration.py" -v

      - name: Run sync alert notifier integration test
        env:
          SYNC_ALERT_INTEGRATION_DATABASE_URL: postgresql://app:app@localhost:5432/app
        run: python -m unittest discover -s tests -p "test_sync_alert_notifier_integration.py" -v

      - name: Run scheduler shadow integration test
        env:
          SYNC_SCHEDULER_INTEGRATION_DATABASE_URL: postgresql://app:app@localhost:5432/app
        run: python -m unittest discover -s tests -p "test_sync_scheduler_integration.py" -v

      - name: Run unified sync control integration test
        env:
          SYNC_CONTROL_INTEGRATION_DATABASE_URL: postgresql://app:app@localhost:5432/app
        run: python -m unittest discover -s tests -p "test_sync_control_integration.py" -v

      - name: Run document locator convergence integration test
        env:
          DOCUMENT_LOCATOR_INTEGRATION_DATABASE_URL: postgresql://app:app@localhost:5432/app
        run: python -m unittest discover -s tests -p "test_document_locator_integration.py" -v

      - name: Run backend smoke test
        env:
          DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app
          AUTH_TOKEN_SECRET: ci-test-secret-please-rotate-0123456789
          ENV: dev
          LOCAL_UPLOAD_DIR: /tmp
          ADMIN_BOOTSTRAP_USERNAME: ci-admin
          ADMIN_BOOTSTRAP_PASSWORD: ci-admin-password-0123456789
          ADMIN_BOOTSTRAP_DISPLAY_NAME: CI Admin
        run: |
          python -m unittest discover -s tests -p test_backend_smoke.py -v
