name: release-deploy

on:
  push:
    branches:
      - main
    tags:
      - "V*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Planned release version, format VYYYYMMDDNNN"
        required: false
        type: string

concurrency:
  group: release-deploy
  cancel-in-progress: false

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: vars
        run: |
          git fetch --tags --force
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.release_version }}" ]]; then
            RELEASE_VERSION="${{ inputs.release_version }}"
          else
            YEAR="$(date -u +%Y)"
            MONTH="$(date -u +%m)"
            DAY="$(date -u +%d)"
            SERIAL="$(printf '%03d' "$((GITHUB_RUN_NUMBER % 1000))")"
            RELEASE_VERSION="V${YEAR}${MONTH}${DAY}${SERIAL}"
            echo "No release_version was provided; generated ${RELEASE_VERSION}"
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^V[0-9]{11}$ ]]; then
            echo "Invalid release version. Expected VYYYYMMDDNNN, got: ${RELEASE_VERSION}" >&2
            exit 1
          fi

          PREVIOUS_VERSION="$(git tag --sort=-v:refname | sed -n '2p')"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"

          {
            echo "## Release and deployment"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Previous version | ${PREVIOUS_VERSION:-not found} |"
            echo "| Release version | ${RELEASE_VERSION} |"
            echo "| Deploy version | ${RELEASE_VERSION} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create and validate tag for manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TAG: ${{ steps.vars.outputs.release_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
            CURRENT_SHA="$(git rev-parse HEAD)"
            if [[ "$REMOTE_SHA" != "$CURRENT_SHA" ]]; then
              echo "Tag already exists but does not point at this commit. Use a new release version." >&2
              exit 1
            fi
            echo "Remote tag already exists and matches this commit: $TAG"
          else
            git tag -a "$TAG" -m "Release ${TAG}"
            git push origin "$TAG"
          fi

      - name: Login to GHCR for push
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push public-web
        run: |
          TAG="${{ steps.vars.outputs.release_version }}"
          docker build -t ghcr.io/${{ github.repository_owner }}/public-web:${TAG} services/public-web
          docker push ghcr.io/${{ github.repository_owner }}/public-web:${TAG}

      - name: Build and push admin-ui
        run: |
          TAG="${{ steps.vars.outputs.release_version }}"
          docker build -t ghcr.io/${{ github.repository_owner }}/admin-ui:${TAG} services/admin-ui
          docker push ghcr.io/${{ github.repository_owner }}/admin-ui:${TAG}

      - name: Build and push backend-api
        run: |
          TAG="${{ steps.vars.outputs.release_version }}"
          docker build -t ghcr.io/${{ github.repository_owner }}/backend-api:${TAG} services/backend-api
          docker push ghcr.io/${{ github.repository_owner }}/backend-api:${TAG}

      - name: Build and push doc-sync-worker
        run: |
          TAG="${{ steps.vars.outputs.release_version }}"
          docker build -t ghcr.io/${{ github.repository_owner }}/doc-sync-worker:${TAG} services/doc-sync-worker
          docker push ghcr.io/${{ github.repository_owner }}/doc-sync-worker:${TAG}

      - name: Deploy on ECS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail

            export GHCR_USERNAME="${GHCR_USERNAME:-}"
            export GHCR_TOKEN="${GHCR_TOKEN:-}"

            APP_ROOT="/root/AliECS"
            BACKUP_DIR="/root/AliECS-private-backup/github-actions"
            RELEASE_VERSION="${{ steps.vars.outputs.release_version }}"
            TS="$(date +%Y%m%d-%H%M%S)"

            if [[ ! -d "${APP_ROOT}/.git" ]]; then
              echo "[deploy] Git repository not found at ${APP_ROOT}. Confirm ECS project path is /root/AliECS." >&2
              exit 1
            fi

            mkdir -p "${BACKUP_DIR}"
            cd "${APP_ROOT}"

            echo "[deploy] Backing up ECS private env files"
            if [[ -f "deploy/ecs/release-meta.env" ]]; then
              cp -a "deploy/ecs/release-meta.env" "${BACKUP_DIR}/release-meta.env.${TS}"
            fi
            if [[ -f "deploy/ecs/runtime.env" ]]; then
              cp -a "deploy/ecs/runtime.env" "${BACKUP_DIR}/runtime.env.${TS}"
            fi

            echo "[deploy] Syncing ECS checkout to origin/main"
            git fetch origin main --tags
            git checkout main

            # release-meta.env used to be tracked in older checkouts. It is now
            # an ECS-private file, so restore tracked copies before fast-forward
            # pull to keep local secret edits from blocking code sync.
            for env_file in deploy/ecs/release-meta.env deploy/ecs/runtime.env; do
              if git ls-files --error-unmatch "${env_file}" >/dev/null 2>&1; then
                git restore --source=HEAD -- "${env_file}"
              fi
            done

            git pull --ff-only origin main

            echo "[deploy] Restoring ECS private env files"
            if [[ -f "${BACKUP_DIR}/release-meta.env.${TS}" ]]; then
              cp -a "${BACKUP_DIR}/release-meta.env.${TS}" "deploy/ecs/release-meta.env"
              chmod 600 "deploy/ecs/release-meta.env"
            fi
            if [[ -f "${BACKUP_DIR}/runtime.env.${TS}" ]]; then
              cp -a "${BACKUP_DIR}/runtime.env.${TS}" "deploy/ecs/runtime.env"
              chmod 600 "deploy/ecs/runtime.env"
            fi

            DEPLOY_SCRIPT="${APP_ROOT}/deploy/ecs/deploy.sh"
            if [[ ! -x "${DEPLOY_SCRIPT}" ]]; then
              echo "[deploy] Deploy script is missing or not executable: ${DEPLOY_SCRIPT}" >&2
              exit 1
            fi

            echo "[deploy] Running latest deploy script: ${DEPLOY_SCRIPT}"
            "${DEPLOY_SCRIPT}" "${RELEASE_VERSION}"

            POST_DEPLOY_SMOKE="${APP_ROOT}/deploy/ecs/post-deploy-smoke.sh"
            if [[ ! -x "${POST_DEPLOY_SMOKE}" ]]; then
              echo "[deploy] Post-deploy smoke script is missing or not executable: ${POST_DEPLOY_SMOKE}" >&2
              exit 1
            fi

            echo "[deploy] Running post-deploy smoke checks: ${POST_DEPLOY_SMOKE}"
            "${POST_DEPLOY_SMOKE}"

      - name: Collect ECS diagnostics on failure
        if: ${{ failure() }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -uo pipefail
            APP_ROOT="/root/AliECS"
            DIAG_SCRIPT="${APP_ROOT}/deploy/ecs/collect-diagnostics.sh"

            if [[ -x "${DIAG_SCRIPT}" ]]; then
              "${DIAG_SCRIPT}"
              exit 0
            fi

            echo "[diagnostics] collect-diagnostics.sh is not available yet; running fallback checks"
            cd "${APP_ROOT}" 2>/dev/null || {
              echo "[diagnostics] missing app root: ${APP_ROOT}"
              exit 0
            }
            git status -sb 2>&1 || true
            git log -1 --oneline 2>&1 || true
            docker compose --env-file /root/AliECS/deploy/ecs/runtime.env -f /root/AliECS/deploy/ecs/compose.prod.yml ps 2>&1 || true
            docker compose --env-file /root/AliECS/deploy/ecs/runtime.env -f /root/AliECS/deploy/ecs/compose.prod.yml logs --tail=80 backend-api doc-sync-worker postgres 2>&1 \
              | sed -E 's#(postgres(ql)?://)[^:@/]+:[^@/]+@#\1***:***@#g; s#([Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Tt][Oo][Kk][Ee][Nn]|[Ss][Ee][Cc][Rr][Ee][Tt]|ACCESS_KEY|APP_SECRET|CORP_ID)=([^[:space:]]+)#\1=***#g' || true
