name: release-deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "docs/**"
    tags:
      - "V*"
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Build only, or deploy one explicit v4 role"
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - mirror-only
          - sso-candidate
          - business-cn
          - business-candidate
          - edge-us

concurrency:
  group: release-deploy
  cancel-in-progress: false

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.vars.outputs.release_id }}
      bridge_changed: ${{ steps.bridge.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: vars
        run: |
          RELEASE_ID="sha-${GITHUB_SHA:0:12}"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

          {
            echo "## GitHub-native deployment identity"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| Actions run | ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT} |"
            echo "| Release alias | ${RELEASE_ID} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 比的是 bridge 构建上下文的 git tree hash，不是文件名列表——这与 build-push 的
      # 内容寻址标签和 bridge-cutover 解析镜像用的是同一个量。tree hash 没变 → 镜像标签
      # 就是同一个 → cutover 只是白重启一次咽喉服务，所以不触发。
      - name: Did the bridge build context actually change
        id: bridge
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          CURRENT="$(git rev-parse "HEAD:deploy/openclaw-bridge")"
          PREVIOUS=""
          if [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            PREVIOUS="$(git rev-parse "${BEFORE}:deploy/openclaw-bridge" 2>/dev/null || echo "")"
          fi

          if [ -z "$PREVIOUS" ]; then
            # 首推、force push、tag 推送等拿不到可比的前一个状态。bridge 是咽喉服务，
            # 拿不准时宁可不动，人工用 workflow_dispatch 补切。
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "- bridge: 无法与 \`${BEFORE:-<none>}\` 比对，跳过自动 cutover（需要时手工触发 bridge-cutover）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$CURRENT" = "$PREVIOUS" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "- bridge: 构建上下文未变（\`${CURRENT:0:12}\`），不触发 cutover" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "- bridge: \`${PREVIOUS:0:12}\` → \`${CURRENT:0:12}\`，构建完成后自动 cutover" >> "$GITHUB_STEP_SUMMARY"
          fi

  build-push:
    needs: resolve-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: public-web
            context: services/public-web
          - image: admin-ui
            context: services/admin-ui
          - image: backend-api
            context: services/backend-api
          - image: doc-sync-worker
            context: services/doc-sync-worker
          - image: tplus-sync-worker
            context: services/tplus-sync-worker
          - image: openclaw-bridge
            context: deploy/openclaw-bridge
          - image: mcp-coding-server
            context: services/mcp-coding-server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR for push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 内容寻址标签：镜像标签 = 构建上下文目录的 git tree hash。目录内容没变 → 标签已存在 →
      # 跳过构建；ECS 侧 compose 看到同一标签不会重建容器，改 1 个服务不再全量重启 7 个。
      - name: Compute content tag
        id: tree
        run: echo "tag=t-$(git rev-parse "HEAD:${{ matrix.context }}" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Check if content image already exists
        id: exists
        run: |
          if docker manifest inspect "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.tree.outputs.tag }}" >/dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Content image already exists, skipping build: ${{ matrix.image }}:${{ steps.tree.outputs.tag }}"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.image }}
        if: ${{ steps.exists.outputs.hit != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.tree.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # GitHub commit alias groups this deployment while the runtime manifest records
      # the immutable OCI digest for each service.
      - name: Alias commit to content tag
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.resolve-release.outputs.release_id }}" \
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.tree.outputs.tag }}"

      - name: Install skopeo for optional TCR sync
        if: ${{ vars.TCR_BASE != '' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

      - name: Sync the same immutable manifest to TCR
        env:
          DEPLOY_TARGET: ${{ inputs.deploy_target }}
          TCR_BASE: ${{ vars.TCR_BASE }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$TCR_BASE" || -z "$TCR_USERNAME" || -z "$TCR_PASSWORD" ]]; then
            if [[ "$DEPLOY_TARGET" == "business-cn" || "$DEPLOY_TARGET" == "business-candidate" ]]; then
              echo "[registry] business-cn targets require TCR_BASE and TCR push credentials" >&2
              exit 1
            fi
            echo "[registry] TCR is not configured; GHCR build remains authoritative"
            exit 0
          fi

          auth_dir="$(mktemp -d)"
          auth_file="$auth_dir/auth.json"
          trap 'rm -rf "$auth_dir"' EXIT
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" \
            | skopeo login --authfile "$auth_file" --username "${{ github.actor }}" --password-stdin ghcr.io
          printf '%s' "$TCR_PASSWORD" \
            | skopeo login --authfile "$auth_file" --username "$TCR_USERNAME" --password-stdin "${TCR_BASE%%/*}"

          source="docker://ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.tree.outputs.tag }}"
          target="docker://${TCR_BASE}/${{ matrix.image }}:${{ steps.tree.outputs.tag }}"
          skopeo copy --all --preserve-digests --authfile "$auth_file" "$source" "$target"

          source_digest="$(skopeo inspect --authfile "$auth_file" "$source" | jq -r .Digest)"
          target_digest="$(skopeo inspect --authfile "$auth_file" "$target" | jq -r .Digest)"
          [[ "$source_digest" == "$target_digest" ]] || {
            echo "[registry] digest mismatch: source=$source_digest target=$target_digest" >&2
            exit 1
          }
          echo "[registry] ${{ matrix.image }} synced at $source_digest"

  # 合并即上线，但只限 bridge 自己变了的那次合并；其余 main push 一概不碰咽喉服务。
  # 回滚/重切仍走 bridge-cutover 的 workflow_dispatch 手工入口。
  cutover-bridge:
    needs:
      - resolve-release
      - build-push
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.resolve-release.outputs.bridge_changed == 'true' && vars.TCR_BASE != '' }}
    uses: ./.github/workflows/bridge-cutover.yml
    with:
      confirmation: CUTOVER_TXECS
    secrets: inherit

  mirror-third-party:
    needs: build-push
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'mirror-only' || inputs.deploy_target == 'sso-candidate' || inputs.deploy_target == 'business-cn' || inputs.deploy_target == 'business-candidate') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
      - name: Mirror digest-pinned third-party images to TCR
        env:
          TCR_BASE: ${{ vars.TCR_BASE }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: bash deploy/ecs/mirror-images-to-tcr.sh

  preload-sso-candidate:
    needs:
      - mirror-third-party
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'sso-candidate' }}
    runs-on: ubuntu-latest
    steps:
      - name: Preload pinned SSO images on txecs
        uses: appleboy/ssh-action@v1.2.0
        env:
          TCR_BASE: ${{ vars.TCR_BASE }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          command_timeout: 15m
          envs: TCR_BASE,TCR_USERNAME,TCR_PASSWORD
          script: |
            set -euo pipefail
            : "${TCR_BASE:?missing TCR_BASE}"
            : "${TCR_USERNAME:?missing TCR username}"
            : "${TCR_PASSWORD:?missing TCR password}"
            registry="${TCR_BASE%%/*}"
            printf '%s' "$TCR_PASSWORD" \
              | sudo docker login "$registry" \
                  --username "$TCR_USERNAME" --password-stdin
            trap 'sudo docker logout "$registry" >/dev/null 2>&1 || true' EXIT
            for image in \
              "$TCR_BASE/third-party-authelia:4.39-runtime-20260725" \
              "$TCR_BASE/third-party-lldap:v0.6-runtime-20260725"; do
              sudo docker pull "$image"
              sudo docker image inspect "$image" >/dev/null
              echo "preloaded: $image"
            done

  deploy-business-cn:
    needs:
      - resolve-release
      - build-push
      - mirror-third-party
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'business-cn' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package the exact source commit
        run: |
          set -euo pipefail
          mkdir release
          git archive "$GITHUB_SHA" | tar -x -C release
          printf '%s\n' "$GITHUB_SHA" > release/.source-commit
          content_tag() { echo "t-$(git rev-parse "HEAD:$1" | cut -c1-12)"; }
          {
            echo "PUBLIC_WEB_TAG=$(content_tag services/public-web)"
            echo "ADMIN_UI_TAG=$(content_tag services/admin-ui)"
            echo "BACKEND_API_TAG=$(content_tag services/backend-api)"
            echo "DOC_SYNC_WORKER_TAG=$(content_tag services/doc-sync-worker)"
            echo "TPLUS_SYNC_WORKER_TAG=$(content_tag services/tplus-sync-worker)"
            echo "MCP_CODING_SERVER_TAG=$(content_tag services/mcp-coding-server)"
          } > release/.content-tags.env
          tar -C release -czf aliecs-release.tgz .
          sha256sum aliecs-release.tgz > aliecs-release.tgz.sha256

      - name: Upload source artifact to txecs
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          source: "aliecs-release.tgz,aliecs-release.tgz.sha256"
          target: "/tmp/business-cn-${{ github.sha }}"

      - name: Deploy Tencent business role
        uses: appleboy/ssh-action@v1.2.0
        env:
          TCR_BASE: ${{ vars.TCR_BASE }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          command_timeout: 40m
          envs: TCR_BASE,TCR_USERNAME,TCR_PASSWORD,DEPLOY_COMMIT_SHA,DEPLOY_RUN_ID,DEPLOY_RUN_ATTEMPT
          script: |
            set -euo pipefail
            : "${TCR_BASE:?missing TCR_BASE}"
            : "${TCR_USERNAME:?missing TCR username}"
            : "${TCR_PASSWORD:?missing TCR password}"

            INCOMING="/tmp/business-cn-${DEPLOY_COMMIT_SHA}"
            RELEASE_ROOT="/srv/business-cn/releases"
            RELEASE_DIR="${RELEASE_ROOT}/${DEPLOY_COMMIT_SHA}"
            CURRENT_LINK="/srv/business-cn/current"
            RELEASE_ID="${{ needs.resolve-release.outputs.release_id }}"

            cd "$INCOMING"
            sha256sum -c aliecs-release.tgz.sha256
            sudo install -d -m 0750 -o root -g root "$RELEASE_ROOT"
            sudo rm -rf -- "$RELEASE_DIR"
            sudo install -d -m 0750 -o root -g root "$RELEASE_DIR"
            sudo tar -xzf aliecs-release.tgz -C "$RELEASE_DIR"
            actual_commit="$(sudo cat "$RELEASE_DIR/.source-commit" | tr -d '[:space:]')"
            [[ "$actual_commit" == "$DEPLOY_COMMIT_SHA" ]]
            sudo ln -sfnT "$RELEASE_DIR" "$CURRENT_LINK"

            sudo env SOPS_AGE_KEY_FILE=/home/ubuntu/.config/sops/age/keys.txt \
              /home/ubuntu/infra/scripts/render.sh txecs

            export DEPLOY_ROLE=business-cn
            export RELEASE_META_FILE=/srv/business-cn/config/runtime.env
            export ROLE_COMPOSE_FILE="$CURRENT_LINK/deploy/ecs/compose.business-cn.yml"
            export ROLE_RUNTIME_ENV_FILE=/srv/business-cn/config/compose.env
            export ROLE_METADATA_DIR=/srv/business-cn/state/release-meta
            export ROLE_MIGRATIONS_DIR="$CURRENT_LINK/db/migrations"
            export ROLE_POSTGRES_CONTAINER_NAME=business-cn-postgres-1
            export ROLE_HEALTHCHECK_URL=http://127.0.0.1:8080/health/
            export ROLE_IMAGE_REGISTRY_BASE="$TCR_BASE"
            export REGISTRY_USERNAME="$TCR_USERNAME"
            export REGISTRY_TOKEN="$TCR_PASSWORD"
            set -a
            source <(sudo cat "$CURRENT_LINK/.content-tags.env")
            set +a
            export POSTGRES_IMAGE="$TCR_BASE/third-party-postgres:16-runtime-20260725"
            export DEPLOY_COMMIT_SHA DEPLOY_RUN_ID DEPLOY_RUN_ATTEMPT
            sudo -E bash "$CURRENT_LINK/deploy/ecs/deploy-role.sh" business-cn "$RELEASE_ID"

  prepare-business-candidate:
    needs:
      - resolve-release
      - build-push
      - mirror-third-party
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'business-candidate' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package the exact source commit
        run: |
          set -euo pipefail
          mkdir release
          git archive "$GITHUB_SHA" | tar -x -C release
          printf '%s\n' "$GITHUB_SHA" > release/.source-commit
          content_tag() { echo "t-$(git rev-parse "HEAD:$1" | cut -c1-12)"; }
          {
            echo "PUBLIC_WEB_TAG=$(content_tag services/public-web)"
            echo "ADMIN_UI_TAG=$(content_tag services/admin-ui)"
            echo "BACKEND_API_TAG=$(content_tag services/backend-api)"
            echo "DOC_SYNC_WORKER_TAG=$(content_tag services/doc-sync-worker)"
            echo "TPLUS_SYNC_WORKER_TAG=$(content_tag services/tplus-sync-worker)"
            echo "MCP_CODING_SERVER_TAG=$(content_tag services/mcp-coding-server)"
          } > release/.content-tags.env
          tar -C release -czf aliecs-release.tgz .
          sha256sum aliecs-release.tgz > aliecs-release.tgz.sha256

      - name: Upload source artifact to AliECS candidate area
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "aliecs-release.tgz,aliecs-release.tgz.sha256"
          target: "/tmp/business-candidate-${{ github.sha }}"

      - name: Prepare isolated AliECS business candidate
        uses: appleboy/ssh-action@v1.2.0
        env:
          TCR_BASE: ${{ vars.TCR_BASE }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          command_timeout: 40m
          envs: TCR_BASE,TCR_USERNAME,TCR_PASSWORD,DEPLOY_COMMIT_SHA,DEPLOY_RUN_ID,DEPLOY_RUN_ATTEMPT
          script: |
            set -euo pipefail
            : "${TCR_BASE:?missing TCR_BASE}"
            : "${TCR_USERNAME:?missing TCR username}"
            : "${TCR_PASSWORD:?missing TCR password}"

            INCOMING="/tmp/business-candidate-${DEPLOY_COMMIT_SHA}"
            RELEASE_ROOT="/srv/business-cn/releases"
            RELEASE_DIR="${RELEASE_ROOT}/${DEPLOY_COMMIT_SHA}"
            CURRENT_LINK="/srv/business-cn/current"
            RELEASE_ID="${{ needs.resolve-release.outputs.release_id }}"

            cd "$INCOMING"
            sha256sum -c aliecs-release.tgz.sha256
            install -d -m 0750 "$RELEASE_ROOT"
            rm -rf -- "$RELEASE_DIR"
            install -d -m 0750 "$RELEASE_DIR"
            tar -xzf aliecs-release.tgz -C "$RELEASE_DIR"
            [[ "$(tr -d '[:space:]' < "$RELEASE_DIR/.source-commit")" == "$DEPLOY_COMMIT_SHA" ]]
            ln -sfnT "$RELEASE_DIR" "$CURRENT_LINK"

            SOPS_AGE_KEY_FILE=/root/.config/sops/age/keys.txt \
              /root/infra/scripts/render.sh aliecs-business-candidate
            bash /root/infra/roles/server/business-candidate/apply.sh \
              /root/infra/config/servers/aliecs-business-candidate.env

            export DEPLOY_ROLE=business-cn
            export DEPLOY_PREPARE_ONLY=true
            export DEPLOY_START_SERVICES=postgres
            export RELEASE_META_FILE=/srv/business-cn/config/runtime.env
            export ROLE_COMPOSE_FILE="$CURRENT_LINK/deploy/ecs/compose.business-cn.yml"
            export ROLE_RUNTIME_ENV_FILE=/srv/business-cn/config/compose.env
            export ROLE_METADATA_DIR=/srv/business-cn/state/release-meta
            export ROLE_MIGRATIONS_DIR="$CURRENT_LINK/db/migrations"
            export ROLE_POSTGRES_CONTAINER_NAME=business-cn-postgres-1
            export ROLE_HEALTHCHECK_URL=http://127.0.0.1:8080/health/
            export ROLE_IMAGE_REGISTRY_BASE="$TCR_BASE"
            export REGISTRY_USERNAME="$TCR_USERNAME"
            export REGISTRY_TOKEN="$TCR_PASSWORD"
            set -a
            source "$CURRENT_LINK/.content-tags.env"
            set +a
            export POSTGRES_IMAGE="$TCR_BASE/third-party-postgres:16-runtime-20260725"
            export DEPLOY_COMMIT_SHA DEPLOY_RUN_ID DEPLOY_RUN_ATTEMPT
            bash "$CURRENT_LINK/deploy/ecs/deploy-role.sh" business-cn "$RELEASE_ID"
            /usr/local/sbin/business-candidate-preflight

  deploy-edge-us:
    needs:
      - resolve-release
      - build-push
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'edge-us' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package the exact source commit
        run: |
          set -euo pipefail
          mkdir release
          git archive "$GITHUB_SHA" | tar -x -C release
          printf '%s\n' "$GITHUB_SHA" > release/.source-commit
          content_tag() { echo "t-$(git rev-parse "HEAD:$1" | cut -c1-12)"; }
          echo "MCP_CODING_SERVER_TAG=$(content_tag services/mcp-coding-server)" > release/.content-tags.env
          tar -C release -czf aliecs-release.tgz .
          sha256sum aliecs-release.tgz > aliecs-release.tgz.sha256

      - name: Upload source artifact to AliECS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "aliecs-release.tgz,aliecs-release.tgz.sha256"
          target: "/tmp/edge-us-${{ github.sha }}"

      - name: Deploy AliECS edge role
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          command_timeout: 20m
          envs: GHCR_USERNAME,GHCR_TOKEN,DEPLOY_COMMIT_SHA
          script: |
            set -euo pipefail
            INCOMING="/tmp/edge-us-${DEPLOY_COMMIT_SHA}"
            RELEASE_DIR="/root/AliECS-edge-releases/${DEPLOY_COMMIT_SHA}"
            CURRENT_LINK="/root/AliECS-edge-current"
            RELEASE_ID="${{ needs.resolve-release.outputs.release_id }}"

            cd "$INCOMING"
            sha256sum -c aliecs-release.tgz.sha256
            rm -rf -- "$RELEASE_DIR"
            install -d -m 0750 "$RELEASE_DIR"
            tar -xzf aliecs-release.tgz -C "$RELEASE_DIR"
            [[ "$(tr -d '[:space:]' < "$RELEASE_DIR/.source-commit")" == "$DEPLOY_COMMIT_SHA" ]]
            ln -sfnT "$RELEASE_DIR" "$CURRENT_LINK"

            set -a
            source "$CURRENT_LINK/.content-tags.env"
            set +a
            export DEPLOY_ROLE=edge-us
            export RELEASE_META_FILE=/root/AliECS/deploy/ecs/release-meta.env
            export ROLE_COMPOSE_FILE="$CURRENT_LINK/deploy/ecs/compose.edge-us.yml"
            export ROLE_RUNTIME_ENV_FILE=/root/AliECS-edge-runtime.env
            export ROLE_METADATA_DIR=/root/AliECS-edge-release-meta
            export ROLE_IMAGE_REGISTRY_BASE=ghcr.io/${{ github.repository_owner }}
            export REGISTRY_USERNAME="$GHCR_USERNAME"
            export REGISTRY_TOKEN="$GHCR_TOKEN"
            bash "$CURRENT_LINK/deploy/ecs/deploy-role.sh" edge-us "$RELEASE_ID"
