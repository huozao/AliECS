name: 发布并部署

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-deploy
  cancel-in-progress: false

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 识别并校验版本信息
        id: vars
        run: |
          git fetch --tags --force

          RELEASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "$RELEASE_VERSION" ]]; then
            echo "VERSION 文件为空，无法发布。" >&2
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "VERSION 文件中的版本必须是 v 开头的 tag。" >&2
            exit 1
          fi

          PREVIOUS_VERSION="$(git tag --sort=-v:refname | head -n 1)"
          CURRENT_SHA="$(git rev-parse HEAD)"

          bump_patch () {
            local v="$1"
            local major minor patch rest
            major="${v#v}"; major="${major%%.*}"
            rest="${v#v${major}.}"
            minor="${rest%%.*}"
            patch="${rest#${minor}.}"
            patch="$((patch + 1))"
            echo "v${major}.${minor}.${patch}"
          }

          if [[ -n "$PREVIOUS_VERSION" ]]; then
            max_version="$(printf "%s
%s
" "$PREVIOUS_VERSION" "$RELEASE_VERSION" | sort -V | tail -n 1)"
            if [[ "$max_version" == "$PREVIOUS_VERSION" ]]; then
              RELEASE_VERSION="$(bump_patch "$PREVIOUS_VERSION")"
              echo "检测到 VERSION 不高于已有最新 tag，自动提升为：$RELEASE_VERSION"
            fi
          fi

          while git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; do
            REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$RELEASE_VERSION" | awk '{print $1}')"
            if [[ "$REMOTE_SHA" == "$CURRENT_SHA" ]]; then
              break
            fi
            RELEASE_VERSION="$(bump_patch "$RELEASE_VERSION")"
            echo "版本号冲突，自动顺延为：$RELEASE_VERSION"
          done

          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"

          echo "上一个版本：${PREVIOUS_VERSION:-未找到}"
          echo "计划发布版本：${RELEASE_VERSION}"
          echo "当前部署版本：${RELEASE_VERSION}"

          {
            echo "## 发布并部署版本信息"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 上一个版本 | ${PREVIOUS_VERSION:-未找到} |"
            echo "| 计划发布版本 | ${RELEASE_VERSION} |"
            echo "| 当前部署版本 | ${RELEASE_VERSION} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 自动处理版本 tag
        env:
          TAG: ${{ steps.vars.outputs.release_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "远程已存在版本 tag：$TAG，继续部署。"
          else
            git tag -a "$TAG" -m "发布 ${TAG}"
            git push origin "$TAG"
          fi

      - name: 登录 GHCR（用于推送）
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: 构建并推送 public-web
        run: |
          TAG="${{ steps.vars.outputs.release_version }}"
          docker build -t ghcr.io/${{ github.repository_owner }}/public-web:${TAG} services/public-web
          docker push ghcr.io/${{ github.repository_owner }}/public-web:${TAG}

      - name: 构建并推送 admin-ui
        run: |
          TAG="${{ steps.vars.outputs.release_version }}"
          docker build -t ghcr.io/${{ github.repository_owner }}/admin-ui:${TAG} services/admin-ui
          docker push ghcr.io/${{ github.repository_owner }}/admin-ui:${TAG}

      - name: 构建并推送 backend-api
        run: |
          TAG="${{ steps.vars.outputs.release_version }}"
          docker build -t ghcr.io/${{ github.repository_owner }}/backend-api:${TAG} services/backend-api
          docker push ghcr.io/${{ github.repository_owner }}/backend-api:${TAG}

      - name: 通过 SSH 触发 ECS 部署脚本
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            export GHCR_USERNAME="${GHCR_USERNAME:-}"
            export GHCR_TOKEN="${GHCR_TOKEN:-}"
            /opt/app/deploy/ecs/deploy.sh ${{ steps.vars.outputs.release_version }}
