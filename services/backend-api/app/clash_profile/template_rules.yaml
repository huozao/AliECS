  # 禁用 QUIC / UDP 443，强制回落 TCP
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  # 本机 / 局域网直连
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve

  # --- Windows 系统更新 / 分发（原在 devbox 的 profile 扩展里，2026-09-02 并入）------
  #
  # 订阅规则表里没有任何 windowsupdate 条目，DOMAIN-KEYWORD,microsoft 也匹配不到
  # "3.au.download.windowsupdate.com"，于是全部吃兜底走代理。2026-08-18 实测当天
  # svchost.exe 因此烧掉 734.9MB 机场流量（走节点 734.9MB / 直连 0.00MB）。
  #
  # 走代理还有次生代价：mihomo 用代理侧 DNS 解析，把下载调度到境外。实测本地 DNS
  # 解析同一批域名返回的全是国内电信 CDN，走代理时拿到的是 Fastly 和澳洲节点。
  #
  # PROCESS-NAME 这条覆盖裸 IP 的分发节点：Delivery Optimization 从 Connected Cache
  # 拉包时 mihomo 侧只有 IP、没有域名，上面三条 DOMAIN-SUFFIX 物理上匹配不到，
  # GEOIP,CN 也不命中（那批 103.x 在 geoip 库里不算 CN）。2026-08-18/19/20 三天
  # 为同一个 757MB 包烧掉约 1.5GB。范围确实大（svchost 承载几十个系统服务），
  # 但实测本机 svchost 走代理的量只有 WU 下载和 login.live.com（1.7MB），无功能损失。
  - DOMAIN-SUFFIX,windowsupdate.com,全球直连
  - DOMAIN-SUFFIX,update.microsoft.com,全球直连
  - DOMAIN-SUFFIX,delivery.mp.microsoft.com,全球直连
  - PROCESS-NAME,svchost.exe,全球直连

