
mixed-port: 7897
allow-lan: false
mode: rule
log-level: warning
ipv6: false
tcp-concurrent: true
unified-delay: true
find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

dns:
  enable: true
  ipv6: false
  respect-rules: true
  prefer-h3: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  use-system-hosts: true

  # 用来解析下面这些 DoH 域名本身，避免启动阶段出现依赖问题
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"

  # 国内 DNS：负责直连域名，速度更稳
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # 境外 DNS：通过代理查询，减少污染
  fallback:
    - https://1.1.1.1/dns-query#节点选择
    - https://dns.google/dns-query#节点选择

  # 对特定国外站点强制使用境外 DNS
  nameserver-policy:
    "+.youtube.com":
      - https://1.1.1.1/dns-query#节点选择
      - https://dns.google/dns-query#节点选择
    "+.googlevideo.com":
      - https://1.1.1.1/dns-query#节点选择
      - https://dns.google/dns-query#节点选择
    "+.ytimg.com":
      - https://1.1.1.1/dns-query#节点选择
      - https://dns.google/dns-query#节点选择
    "+.google.com":
      - https://1.1.1.1/dns-query#节点选择
      - https://dns.google/dns-query#节点选择
    "+.gstatic.com":
      - https://1.1.1.1/dns-query#节点选择
      - https://dns.google/dns-query#节点选择
    "+.googleapis.com":
      - https://1.1.1.1/dns-query#节点选择
      - https://dns.google/dns-query#节点选择
    "+.withgoogle.com":
      - https://1.1.1.1/dns-query#节点选择
      - https://dns.google/dns-query#节点选择
    # ⚠️ 以下 AI 类域名的 DNS 走 #AI服务，不是 #节点选择（2026-08-15 改）。
    # 原因：规则把连接送去 AI服务（自建节点），DNS 却从机场出口查，两边出口不一致时
    # GeoDNS 会返回与实际出口不匹配的边缘 IP。要让全链路同出口，DNS 必须同组。
    "+.openai.com":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    "+.chatgpt.com":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    "+.oaistatic.com":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    "+.oaiusercontent.com":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    "+.auth.openai.com":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    "+.anthropic.com":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    "+.claude.ai":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    "+.claudeusercontent.com":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    "+.challenges.cloudflare.com":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    "+.oaistatsig.com":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    "+.claude.com":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    "+.grok.com":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    "+.x.ai":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    "+.githubcopilot.com":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    "+.cursor.com":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    "+.cursor.sh":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    "+.perplexity.ai":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    # ⚠️ 下面三条与已有的 "+.google.com" / "+.googleapis.com" 重叠。mihomo 按
    # domain trie 最长匹配，更具体的这三条优先，与 YAML 里的先后无关；写在一起
    # 只是为了能和规则表逐条对照。
    "+.gemini.google.com":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    "+.aistudio.google.com":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    "+.generativelanguage.googleapis.com":
      - https://1.1.1.1/dns-query#AI服务
      - https://dns.google/dns-query#AI服务
    # cloudflare.com 整体不再压进 AI服务（规则侧同步收窄），DNS 走常规境外解析。
    "+.cloudflare.com":
      - https://1.1.1.1/dns-query#节点选择
      - https://dns.google/dns-query#节点选择
    "+.github.com":
      - https://1.1.1.1/dns-query#GitHub
      - https://dns.google/dns-query#GitHub
    "+.githubusercontent.com":
      - https://1.1.1.1/dns-query#GitHub
      - https://dns.google/dns-query#GitHub
    "+.githubassets.com":
      - https://1.1.1.1/dns-query#GitHub
      - https://dns.google/dns-query#GitHub
    "+.github.dev":
      - https://1.1.1.1/dns-query#GitHub
      - https://dns.google/dns-query#GitHub
    "+.raw.githubusercontent.com":
      - https://1.1.1.1/dns-query#GitHub
      - https://dns.google/dns-query#GitHub
    # 规则把 GitHub 送去 GitHub 组、把 dukascopy 送去 Dukascopy 组，DNS 必须同组，
    # 否则连接从一个出口走、解析从另一个出口查，GeoDNS 会给出不匹配的边缘 IP。
    "+.ghcr.io":
      - https://1.1.1.1/dns-query#GitHub
      - https://dns.google/dns-query#GitHub
    "+.dukascopy.com":
      - https://1.1.1.1/dns-query#Dukascopy
      - https://dns.google/dns-query#Dukascopy
    "+.jetbrains.com":
      - https://1.1.1.1/dns-query#节点选择
      - https://dns.google/dns-query#节点选择
    "+.jetbrains.space":
      - https://1.1.1.1/dns-query#节点选择
      - https://dns.google/dns-query#节点选择
    "+.intellij.net":
      - https://1.1.1.1/dns-query#节点选择
      - https://dns.google/dns-query#节点选择
    "+.gcr.io":
      - https://1.1.1.1/dns-query#节点选择
      - https://dns.google/dns-query#节点选择
    "+.pkg.dev":
      - https://1.1.1.1/dns-query#节点选择
      - https://dns.google/dns-query#节点选择

  # 哪些域名/结果直接优先采用 fallback
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
    domain:
      - "+.google.com"
      - "+.youtube.com"
      - "+.googlevideo.com"
      - "+.ytimg.com"
      - "+.gstatic.com"
      - "+.googleapis.com"
      - "+.withgoogle.com"
      - "+.openai.com"
      - "+.chatgpt.com"
      - "+.oaistatic.com"
      - "+.oaiusercontent.com"
      - "+.auth.openai.com"
      - "+.anthropic.com"
      - "+.claude.ai"
      - "+.claudeusercontent.com"
      - "+.cloudflare.com"
      - "+.challenges.cloudflare.com"
      - "+.oaistatsig.com"
      - "+.claude.com"
      - "+.grok.com"
      - "+.x.ai"
      - "+.githubcopilot.com"
      - "+.cursor.com"
      - "+.cursor.sh"
      - "+.perplexity.ai"
      - "+.gemini.google.com"
      - "+.aistudio.google.com"
      - "+.generativelanguage.googleapis.com"
      - "+.github.com"
      - "+.githubusercontent.com"
      - "+.githubassets.com"
      - "+.github.dev"
      - "+.raw.githubusercontent.com"
      - "+.ghcr.io"
      - "+.dukascopy.com"
      - "+.jetbrains.com"
      - "+.jetbrains.space"
      - "+.intellij.net"
      - "+.gcr.io"
      - "+.pkg.dev"

  # 解析代理服务器域名时优先用国内 DNS，避免死循环
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - "any:53"
    - "tcp://any:53"

