<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AliECS · 新建 T+ BOM</title>
  <style>
    :root{--bg:#f5f6f2;--panel:#fff;--text:#20251f;--muted:#687066;--line:#dfe5dc;--primary:#275b45;--danger:#a13e35;--good:#39734e;--warn:#9a6a18;--shadow:0 12px 32px rgba(35,63,48,.08)}
    *{box-sizing:border-box}.hidden{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui}.wrap{max-width:1180px;margin:auto;padding:20px 16px 60px}.topbar,.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}.topbar,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.topbar{justify-content:space-between}h1,h2{margin:0}h1{font-size:28px}h2{font-size:18px;margin-bottom:14px}.muted{color:var(--muted)}.small{font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.wide{grid-column:span 2}label{font-size:13px;color:var(--muted)}input,select{border:1px solid var(--line);border-radius:10px;padding:10px 11px;font:inherit;background:#fff;min-width:0}.btn,button{border:0;border-radius:999px;padding:9px 14px;background:#e6ece6;color:var(--text);font-weight:650;text-decoration:none;cursor:pointer}.primary{background:var(--primary);color:#fff}.danger{background:#f4dedb;color:var(--danger)}button:disabled{opacity:.55;cursor:not-allowed}.msg{display:none;border-left:4px solid var(--danger);padding:10px 12px;background:#fff;border-radius:8px;margin-bottom:14px;white-space:pre-wrap}.msg.good{border-color:var(--good)}.msg.warn{border-color:var(--warn)}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{background:#eef2ed}.table-wrap{overflow:auto}.chosen{padding:11px;border:1px solid var(--line);border-radius:12px;background:#f8faf7}.search-results{max-height:270px;overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:10px}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8ece7;font-size:13px}.modal{position:fixed;inset:0;background:rgba(18,30,22,.28);display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.modal-panel{width:min(420px,100%);background:#fff;border-radius:16px;padding:18px;border:1px solid var(--line)}
    @media(max-width:760px){.grid{grid-template-columns:1fr}.field.wide{grid-column:auto}h1{font-size:23px}th,td{min-width:100px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <div><h1>新建 T+ BOM</h1><div class="muted small">MVP：仅支持选择 T+ 中已经存在的父件和子件</div></div>
      <nav class="row"><a class="btn" href="/">首页</a><button id="loginBtn">登录</button><button id="logoutBtn" class="hidden">退出登录</button></nav>
    </header>
    <div id="msg" class="msg"></div>

    <section class="panel">
      <h2>1. 搜索 T+ 存货</h2>
      <div class="row"><input id="searchInput" autocomplete="off" placeholder="输入存货编码、名称或规格" style="flex:1;min-width:240px"/><button id="searchBtn" class="primary">搜索</button><span id="sourceHint" class="muted small"></span></div>
      <div id="searchResults" class="search-results hidden"></div>
    </section>

    <section class="panel">
      <h2>2. 父件与 BOM 参数</h2>
      <div id="parentBox" class="chosen muted">尚未选择父件。请在搜索结果中点击“设为父件”。</div>
      <div class="grid" style="margin-top:14px">
        <div class="field"><label for="versionInput">版本号 *</label><input id="versionInput" value="V1" maxlength="100"/></div>
        <div class="field"><label for="produceQtyInput">生产数量 *</label><input id="produceQtyInput" type="number" min="0.000001" step="any" value="1"/></div>
        <div class="field"><label for="yieldRateInput">成品率（0～1）*</label><input id="yieldRateInput" type="number" min="0.000001" max="1" step="any" value="1"/></div>
        <div class="field"><label for="warehouseInput">预入仓库编码</label><input id="warehouseInput" maxlength="100"/></div>
        <div class="field"><label for="routingInput">工艺路线编码</label><input id="routingInput" maxlength="100"/></div>
        <div class="field"><label for="plantInput">生产车间编码</label><input id="plantInput" maxlength="100"/></div>
        <div class="field"><label><span>默认 BOM</span></label><label class="row" style="color:var(--text)"><input id="defaultBomInput" type="checkbox"/> 创建后设为默认 BOM</label></div>
      </div>
    </section>

    <section class="panel">
      <h2>3. 子件明细</h2>
      <div class="table-wrap"><table><thead><tr><th>编码</th><th>名称 / 规格</th><th>单位</th><th>需用数量 *</th><th>预出仓库</th><th>子 BOM 版本</th><th></th></tr></thead><tbody id="childrenBody"><tr><td colspan="7" class="muted">尚未添加子件。</td></tr></tbody></table></div>
    </section>

    <section class="panel">
      <h2>4. 校验与提交</h2>
      <div class="row"><button id="saveBtn">保存草稿</button><button id="validateBtn">服务端校验</button><button id="submitBtn" class="primary">确认写入 T+</button><span id="draftHint" class="muted small"></span></div>
      <div id="submissionBox" class="chosen hidden" style="margin-top:14px"></div>
    </section>
  </main>

  <div id="authModal" class="modal"><div class="modal-panel"><div class="row" style="justify-content:space-between"><h2>登录</h2><button id="closeAuthBtn">关闭</button></div><input id="usernameInput" autocomplete="username" placeholder="用户名" style="width:100%;margin-top:8px"/><input id="passwordInput" type="password" autocomplete="current-password" placeholder="密码" style="width:100%;margin-top:8px"/><div class="row" style="justify-content:flex-end;margin-top:12px"><button id="submitLoginBtn" class="primary">提交</button></div></div></div>

  <script>
    const API_BASE=location.port==='8080'?'http://localhost:8000':'/api';
    const AUTH_KEYS=['aliecs_auth_token','portal_token','admin_token'];
    const $=(id)=>document.getElementById(id);
    const state={parent:null,children:[],draftId:null,submissionId:null};
    const token=()=>AUTH_KEYS.map((k)=>localStorage.getItem(k)||'').find(Boolean)||'';
    const setToken=(v)=>AUTH_KEYS.forEach((k)=>localStorage.setItem(k,v));
    const clearToken=()=>AUTH_KEYS.forEach((k)=>localStorage.removeItem(k));
    const esc=(v)=>String(v??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function message(text,type='error'){const box=$('msg');box.textContent=text;box.className=`msg ${type==='good'?'good':type==='warn'?'warn':''}`;box.style.display=text?'block':'none';}
    function syncAuth(){$('loginBtn').classList.toggle('hidden',!!token());$('logoutBtn').classList.toggle('hidden',!token());}
    async function api(path,opt={}){const headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});if(token())headers.Authorization=`Bearer ${token()}`;const response=await fetch(`${API_BASE}${path}`,{...opt,headers});const text=await response.text();let data={};if(text){try{data=JSON.parse(text)}catch{data={raw:text}}}if(!response.ok){if(response.status===401){clearToken();syncAuth();}throw new Error(data.detail||`HTTP ${response.status}`)}return data;}
    function renderParent(){const p=state.parent;$('parentBox').innerHTML=p?`<b>${esc(p.code)} · ${esc(p.name)}</b><div class="muted small">${esc(p.specification||'无规格')} · ${esc(p.unit_name)}</div>`:'尚未选择父件。请在搜索结果中点击“设为父件”。';$('parentBox').classList.toggle('muted',!p);}
    function renderChildren(){const body=$('childrenBody');if(!state.children.length){body.innerHTML='<tr><td colspan="7" class="muted">尚未添加子件。</td></tr>';return}body.innerHTML=state.children.map((c,i)=>`<tr><td>${esc(c.code)}</td><td>${esc(c.name)}<div class="muted small">${esc(c.specification||'')}</div></td><td>${esc(c.unit_name)}</td><td><input data-child="${i}" data-field="required_quantity" type="number" min="0.000001" step="any" value="${esc(c.required_quantity)}" style="width:110px"/></td><td><input data-child="${i}" data-field="warehouse_code" value="${esc(c.warehouse_code)}" style="width:100px"/></td><td><input data-child="${i}" data-field="child_bom_version" value="${esc(c.child_bom_version)}" style="width:100px"/></td><td><button class="danger" data-remove="${i}">删除</button></td></tr>`).join('');body.querySelectorAll('[data-field]').forEach((el)=>el.oninput=()=>{state.children[Number(el.dataset.child)][el.dataset.field]=el.value;markDirty()});body.querySelectorAll('[data-remove]').forEach((el)=>el.onclick=()=>{state.children.splice(Number(el.dataset.remove),1);markDirty();renderChildren()});}
    function markDirty(){if(state.draftId){$('draftHint').textContent=`草稿 #${state.draftId} 有未保存修改`;}}
    async function search(){message('');if(!token()){message('请先登录。');return}const q=$('searchInput').value.trim();if(!q){message('请输入搜索关键词。');return}$('searchBtn').disabled=true;try{const data=await api(`/v1/tplus/inventories?q=${encodeURIComponent(q)}&limit=80`);$('sourceHint').textContent=`${data.source_file||''} · ${data.items.length} 条`;$('searchResults').classList.remove('hidden');$('searchResults').innerHTML=(data.items||[]).map((p)=>`<div class="row" style="padding:9px 10px;border-bottom:1px solid var(--line)"><div style="flex:1;min-width:220px"><b>${esc(p.code)} · ${esc(p.name)}</b><div class="muted small">${esc(p.specification||'无规格')} · ${esc(p.unit_name)}</div></div><button data-parent="${esc(p.code)}">设为父件</button><button data-child-code="${esc(p.code)}">添加子件</button></div>`).join('')||'<div class="muted" style="padding:12px">没有匹配存货。</div>';const byCode=new Map(data.items.map((p)=>[p.code,p]));$('searchResults').querySelectorAll('[data-parent]').forEach((el)=>el.onclick=()=>{const p=byCode.get(el.dataset.parent);if(state.children.some((c)=>c.code===p.code)){message('该存货已经是子件，不能同时设为父件。');return}state.parent={...p};markDirty();renderParent()});$('searchResults').querySelectorAll('[data-child-code]').forEach((el)=>el.onclick=()=>{const p=byCode.get(el.dataset.childCode);if(state.parent&&state.parent.code===p.code){message('父件不能作为自己的子件。');return}if(state.children.some((c)=>c.code===p.code)){message('该子件已经添加。');return}state.children.push({...p,required_quantity:'1',warehouse_code:'',child_bom_version:''});markDirty();renderChildren()});}catch(e){message(e.message)}finally{$('searchBtn').disabled=false;}}
    function payload(){return{parent:state.parent,children:state.children,options:{version:$('versionInput').value.trim(),produce_quantity:$('produceQtyInput').value,yield_rate:$('yieldRateInput').value,is_default_bom:$('defaultBomInput').checked,warehouse_code:$('warehouseInput').value.trim(),routing_code:$('routingInput').value.trim(),manufacture_plant_code:$('plantInput').value.trim()}};}
    function localCheck(){if(!state.parent)throw new Error('请选择父件。');if(!state.children.length)throw new Error('至少添加一个子件。');}
    async function save(){message('');localCheck();const body=JSON.stringify(payload());const data=state.draftId?await api(`/v1/tplus/bom-drafts/${state.draftId}`,{method:'PATCH',body}):await api('/v1/tplus/bom-drafts',{method:'POST',body});state.draftId=data.id;$('draftHint').textContent=`草稿 #${state.draftId} 已保存`;message('草稿已保存。','good');return data;}
    async function validateDraft(){await save();const data=await api(`/v1/tplus/bom-drafts/${state.draftId}/validate`,{method:'POST'});if(!data.valid)throw new Error(data.errors.join('\n'));message(`校验通过：父件 ${state.parent.code}，子件 ${state.children.length} 个。`,'good');return data;}
    async function submit(){$('submitBtn').disabled=true;try{await validateDraft();if(!confirm(`即将把父件 ${state.parent.code}、版本 ${$('versionInput').value.trim()} 写入畅捷通 T+。\n\n确认继续吗？`))return;const data=await api(`/v1/tplus/bom-drafts/${state.draftId}/submit`,{method:'POST',body:JSON.stringify({confirmed:true}),headers:{'Idempotency-Key':`bom-builder-${state.draftId}`}});state.submissionId=data.id;$('submissionBox').classList.remove('hidden');message('已进入写入队列，请等待 T+ 返回并完成写后验证。','warn');await pollSubmission();}finally{$('submitBtn').disabled=false;}}
    async function pollSubmission(){if(!state.submissionId)return;const data=await api(`/v1/tplus/bom-submissions/${state.submissionId}`);const terminal=['success','failed','needs_review'].includes(data.status);const labels={pending:'等待处理',processing:'正在写入 T+',success:'创建并验证成功',failed:'创建失败',needs_review:'需要人工复核'};$('submissionBox').innerHTML=`<span class="status">${esc(labels[data.status]||data.status)}</span> <b>提交 #${data.id}</b><div class="muted small" style="margin-top:7px">T+ BOM ID：${esc(data.result_bom_id||'-')} · 尝试次数：${esc(data.attempts)}</div>${data.error&&data.error.message?`<div style="color:var(--danger);margin-top:7px">${esc(data.error.message)}</div>`:''}`;if(!terminal)setTimeout(()=>pollSubmission().catch((e)=>message(e.message)),2000);else message(data.status==='success'?'T+ BOM 创建成功，并已完成写后查询验证。':'提交已停止自动处理，请根据状态人工复核。',data.status==='success'?'good':'warn');}
    async function login(){const username=$('usernameInput').value.trim(),password=$('passwordInput').value;if(!username||!password){message('请输入用户名和密码。');return}const data=await api('/v1/auth/login',{method:'POST',body:JSON.stringify({username,password})});setToken(data.token);syncAuth();$('authModal').classList.remove('show');message('登录成功。','good');}
    document.addEventListener('DOMContentLoaded',()=>{renderParent();renderChildren();syncAuth();$('loginBtn').onclick=()=>$('authModal').classList.add('show');$('logoutBtn').onclick=()=>{clearToken();syncAuth();message('已退出登录。')};$('closeAuthBtn').onclick=()=>$('authModal').classList.remove('show');$('submitLoginBtn').onclick=()=>login().catch((e)=>message(e.message));$('passwordInput').onkeydown=(e)=>{if(e.key==='Enter')login().catch((x)=>message(x.message))};$('searchBtn').onclick=search;$('searchInput').onkeydown=(e)=>{if(e.key==='Enter')search()};$('saveBtn').onclick=()=>save().catch((e)=>message(e.message));$('validateBtn').onclick=()=>validateDraft().catch((e)=>message(e.message));$('submitBtn').onclick=()=>submit().catch((e)=>message(e.message));document.querySelectorAll('#versionInput,#produceQtyInput,#yieldRateInput,#warehouseInput,#routingInput,#plantInput,#defaultBomInput').forEach((el)=>el.oninput=markDirty);});
  </script>
</body>
</html>
