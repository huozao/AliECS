<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="refresh" content="3;url=https://adventure.hydwang.xyz" />
  <title>地图足迹已迁移</title>
  <style>
    :root{--bg:#f8f4ec;--card:#fffdfa;--text:#2f2721;--muted:#7c6b5d;--line:#ecdfd2;--primary:#8c5f6a;--shadow:0 10px 28px rgba(93,71,52,.08)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    main{width:min(520px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:24px}
    h1{margin:0 0 10px;font-size:24px}
    p{margin:0 0 18px;line-height:1.7;color:var(--muted)}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:9px 14px;background:#e9dfd0;color:var(--text);text-decoration:none;font-weight:700}
    .btn.primary{background:var(--primary);color:#fff}
  </style>
</head>
<body>
<main>
  <h1>地图足迹已迁移至 AdventureLog</h1>
  <p>旧地图页面保留用于兼容书签，将自动跳转到新的旅行足迹与相册入口。</p>
  <div class="row">
    <a class="btn primary" href="https://adventure.hydwang.xyz">前往 AdventureLog</a>
    <a class="btn" href="/couple/">返回 Couple Memory</a>
  </div>
</main>
<script>
setTimeout(()=>location.href='https://adventure.hydwang.xyz',1500);
</script>
</body>
</html>
