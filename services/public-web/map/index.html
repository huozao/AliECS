<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>地图足迹</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f8f4ec;color:#2f2721}.wrap{max-width:1120px;margin:0 auto;padding:16px}.btn{display:inline-block;margin:0 8px 8px 0;background:#e8dfcf;padding:8px 12px;border-radius:999px;color:#222;text-decoration:none;font-weight:700}.muted{color:#7b6d5f}#map{height:620px;border-radius:16px;border:1px solid #e5d7c6;overflow:hidden}.top{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
  </style>
</head>
<body>
<main class="wrap">
  <div id="userBadge" style="margin:0 0 8px;color:#7b6d5f;font-size:13px"></div>
  <div class="top"><h1>地图足迹</h1><div><a class="btn" href="/couple/">Dashboard</a><a class="btn" href="/memories/">回忆列表</a></div></div>
  <p id="hint" class="muted"></p>
  <div id="map"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/common/user-badge.js"></script>
<script>
const API_BASE=window.AliECSAuth.API_BASE;
const esc=(v)=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;");
const map=L.map('map').setView([30.27,120.15],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
function headers(){const tk=window.AliECSAuth.getToken();return tk?{Authorization:`Bearer ${tk}`}:{};
}
async function load(){
  const r=await fetch(`${API_BASE}/v1/map/memories`,{headers:headers()});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.detail||`HTTP ${r.status}`);
  const bounds=[];
  (d.items||[]).forEach(m=>{const p=[m.latitude,m.longitude];bounds.push(p);L.marker(p).addTo(map).bindPopup(`<b>${esc(m.title)}</b><br>${esc(m.memory_date||'')}<br>${esc(m.place_name||'')}<br><a href="/memories/detail.html?id=${m.id}">查看详情</a>`);});
  if(bounds.length) map.fitBounds(bounds,{padding:[24,24],maxZoom:12}); else hint.textContent='暂无带坐标的回忆点。';
}
(async()=>{try{await window.AliECSAuth.renderUserBadge();await load();}catch(e){hint.textContent='加载失败，请先登录且确认有 Couple 权限：'+e.message;}})();
</script>
</body>
</html>
