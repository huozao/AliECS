<!doctype html>
<html lang='zh-CN'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>地图足迹</title><link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'/><style>body{margin:0;font-family:system-ui;background:#f8f4ec}.wrap{max-width:1100px;margin:0 auto;padding:16px}#map{height:560px;border-radius:16px;border:1px solid #e5d7c6}.btn{display:inline-block;margin-bottom:8px;background:#e8dfcf;padding:8px 12px;border-radius:999px;color:#222;text-decoration:none}.muted{color:#7b6d5f}</style></head>
<body><div class='wrap'><a class='btn' href='/couple/'>返回 Dashboard</a><h1>地图足迹</h1><p id='hint' class='muted'></p><div id='map'></div></div><script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script><script>const API_BASE=location.port==='8080'?'http://localhost:8000':'/api';const map=L.map('map').setView([30.27,120.15],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);async function load(){const tk=localStorage.getItem('portal_token')||'';const h={'Content-Type':'application/json'};if(tk)h.Authorization=`Bearer ${tk}`;const r=await fetch(`${API_BASE}/v1/map/memories`,{headers:h});if(!r.ok) throw new Error();const d=await r.json();(d.items||[]).forEach(m=>L.marker([m.latitude,m.longitude]).addTo(map).bindPopup(`<b>${m.title}</b><br/>${m.memory_date||''}<br/>${m.place_name||''}`));if(!(d.items||[]).length){hint.textContent='暂无带坐标的回忆点。';}}(async()=>{try{await load();}catch{hint.textContent='加载失败，请先登录且确认有 Couple 权限。';}})();</script></body></html>
