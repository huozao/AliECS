<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Map</title><link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'/><style>body{margin:0;font-family:system-ui;background:#f8f4ec}.wrap{max-width:1100px;margin:0 auto;padding:16px}#map{height:560px;border-radius:16px;border:1px solid #e5d7c6}.btn{display:inline-block;margin-bottom:8px;background:#e8dfcf;padding:8px 12px;border-radius:999px;color:#222;text-decoration:none}</style></head><body><div class='wrap'><a class='btn' href='/couple/'>返回 Dashboard</a><h1>地图足迹</h1><div id='map'></div></div><script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script><script>const API_BASE=location.port==='8080'?'http://localhost:8000':'/api';const map=L.map('map').setView([30.27,120.15],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);const mock=[{title:'初秋散步',memory_date:'2025-09-12',place_name:'杭州西湖',latitude:30.25,longitude:120.14},{title:'第一次旅行',memory_date:'2025-11-22',place_name:'宁波象山',latitude:29.47,longitude:121.87}];async function load(){const tk=localStorage.getItem('portal_token')||'';try{const h={'Content-Type':'application/json'};if(tk)h.Authorization=`Bearer ${tk}`;const r=await fetch(`${API_BASE}/v1/map/memories`,{headers:h});if(!r.ok)throw new Error();const d=await r.json();render(d.items||[]);}catch{render(mock);}}function render(items){items.forEach(m=>L.marker([m.latitude,m.longitude]).addTo(map).bindPopup(`<b>${m.title}</b><br/>${m.memory_date||''}<br/>${m.place_name||''}`));}load();</script></body></html>
