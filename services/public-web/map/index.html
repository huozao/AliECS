<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>回忆地图</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root{--bg:#f8f4ec;--card:#fffdfa;--text:#2f2721;--muted:#7c6b5d;--line:#ecdfd2;--primary:#8c5f6a;--shadow:0 10px 28px rgba(93,71,52,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn,button{border:0;border-radius:999px;padding:8px 12px;background:#e9dfd0;color:var(--text);font-weight:700;text-decoration:none;cursor:pointer}.primary{background:var(--primary);color:#fff}.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:14px}.muted,.small{color:var(--muted)}.small{font-size:13px}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;align-items:end;margin:12px 0}label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}select{width:100%;border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:white}#map{height:min(70vh,680px);min-height:420px;border:1px solid var(--line);border-radius:16px;overflow:hidden}.map-popup{min-width:220px;max-width:280px}.map-popup img{width:100%;height:120px;object-fit:cover;border-radius:10px;background:#eee}.map-popup h3{font-size:16px;margin:8px 0 4px}.map-popup p{margin:4px 0;line-height:1.45}.map-popup .source{display:inline-block;padding:2px 7px;border-radius:999px;background:#f1e6da;color:var(--muted);font-size:11px}@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters button{grid-column:1/-1}#map{min-height:360px}}
  </style>
</head>
<body>
<main class="wrap">
  <div id="userBadge" class="small" style="margin-bottom:8px"></div>
  <header class="row">
    <div>
      <h1 style="margin:0 0 6px">回忆地图</h1>
      <div id="hint" class="muted">把带坐标的回忆收回 App 内查看。坐标优先使用回忆，其次复用照片 EXIF/GPS。</div>
    </div>
    <nav class="row">
      <a class="btn" href="/couple/">Dashboard</a>
      <a class="btn" href="/memories/">回忆</a>
    </nav>
  </header>
  <section class="card">
    <form id="filterForm" class="filters">
      <div><label>年份</label><select id="yearFilter"><option value="">全部年份</option></select></div>
      <div><label>标签</label><select id="tagFilter"><option value="">全部标签</option></select></div>
      <div><label>地点</label><select id="placeFilter"><option value="">全部地点</option></select></div>
      <div><label>坐标来源</label><select id="sourceFilter"><option value="">全部来源</option><option value="memory">回忆坐标</option><option value="immich_asset">Immich GPS</option><option value="local_exif">本地照片 EXIF</option></select></div>
      <button class="primary" type="submit">筛选</button>
    </form>
    <div id="map"></div>
  </section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/common/user-badge.js"></script>
<script>
const API_BASE=window.AliECSAuth.API_BASE;
const $=(id)=>document.getElementById(id);
const esc=(v)=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;");
const headers=()=>{const tk=window.AliECSAuth.getToken();return tk?{Authorization:`Bearer ${tk}`}:{};};
async function api(path){const r=await fetch(`${API_BASE}${path}`,{headers:headers()});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||`HTTP ${r.status}`);return d;}
let allItems=[],map,layer;
const PLACEHOLDER='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240"><rect width="100%" height="100%" fill="#eee7df"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#907f70" font-size="20">暂无封面</text></svg>');
function initMap(){if(map)return;map=L.map('map').setView([30.27,120.15],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);layer=L.layerGroup().addTo(map);}
function populateFilters(){const years=[...new Set(allItems.map(x=>(x.memory_date||'').slice(0,4)).filter(Boolean))].sort().reverse();$('yearFilter').innerHTML='<option value="">全部年份</option>'+years.map(y=>`<option value="${esc(y)}">${esc(y)}</option>`).join('');const places=[...new Set(allItems.map(x=>x.place_name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh'));$('placeFilter').innerHTML='<option value="">全部地点</option>'+places.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');}
async function loadTags(){const d=await api('/v1/tags');$('tagFilter').innerHTML='<option value="">全部标签</option>'+(d.items||[]).map(x=>`<option value="${esc(x.tag)}">${esc(x.tag)} (${x.count})</option>`).join('');}
function sourceLabel(source){return ({memory:'回忆坐标',immich_asset:'Immich GPS',local_exif:'本地照片 EXIF'})[source]||'坐标';}
function render(){initMap();layer.clearLayers();const year=$('yearFilter').value;const tag=$('tagFilter').value;const place=$('placeFilter').value;const source=$('sourceFilter').value;const items=allItems.filter(x=>(!year||(x.memory_date||'').startsWith(year))&&(!tag||(x.tags||[]).includes(tag))&&(!place||x.place_name===place)&&(!source||x.coordinate_source===source));if(!items.length){$('hint').textContent='暂无符合条件的坐标回忆。';map.setView([30.27,120.15],5);return;}$('hint').textContent=`${items.length} 个回忆点 · 坐标可来自回忆、Immich GPS 或本地 EXIF`;
  const bounds=[];items.forEach(m=>{const p=[Number(m.latitude),Number(m.longitude)];if(!Number.isFinite(p[0])||!Number.isFinite(p[1]))return;bounds.push(p);const imageUrl=m.cover_photo_url||m.preview_url||'';const authImage=imageUrl.startsWith('/api/v1/immich/');const image=authImage?`<img src="${PLACEHOLDER}" data-map-thumb="${esc(imageUrl)}" alt="${esc(m.title)}" loading="lazy">`:(imageUrl?`<img src="${esc(imageUrl)}" alt="${esc(m.title)}" loading="lazy">`:`<img src="${PLACEHOLDER}" alt="暂无封面">`);const excerpt=(m.content||'').trim();const tags=(m.tags||[]).slice(0,4).map(t=>`<span class="source">${esc(t)}</span>`).join(' ');const popup=`<article class="map-popup">${image}<h3>${esc(m.title||'未命名回忆')}</h3><p class="small">${esc(m.memory_date||'未知日期')} · ${esc(m.place_name||'未知地点')}</p>${excerpt?`<p>${esc(excerpt.slice(0,120))}${excerpt.length>120?'…':''}</p>`:''}<p><span class="source">${sourceLabel(m.coordinate_source)}</span> ${m.photo_count?`<span class="source">${m.photo_count} 张照片</span>`:''} ${tags}</p><p><a class="btn primary" href="/memories/detail.html?id=${m.id}">查看详情</a></p></article>`;const marker=L.marker(p).addTo(layer).bindPopup(popup);marker.on('popupopen',hydrateMapImages);});if(bounds.length)map.fitBounds(bounds,{padding:[24,24],maxZoom:12});}
async function hydrateMapImages(){const imgs=[...document.querySelectorAll('img[data-map-thumb]')];await Promise.all(imgs.map(async img=>{try{const path=img.dataset.mapThumb;const r=await fetch(path.startsWith('/api/')?path:`${API_BASE}${path}`,{headers:headers()});if(!r.ok)throw new Error('thumbnail');const blob=await r.blob();img.src=URL.createObjectURL(blob);img.removeAttribute('data-map-thumb');}catch(_){img.alt='封面加载失败';}}));}
async function boot(){try{await window.AliECSAuth.renderUserBadge();const data=await api('/v1/map/memories');allItems=data.items||[];populateFilters();await loadTags();render();}catch(e){$('hint').textContent='加载失败：'+e.message;}}
$('filterForm').onsubmit=(e)=>{e.preventDefault();render();};
boot();
</script>
</body>
</html>
