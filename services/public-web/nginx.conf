server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # HTML 每次协商缓存（ETag 304），根治"部署了但浏览器还在跑旧页面"；
  # 其余静态资源允许短缓存。
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /s/ {
    try_files /s/index.html =404;
  }

  location = /tplus-sync/ {
    return 301 /sync/?group=tplus;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }
}
