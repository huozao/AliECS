<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AliECS · 统一同步中心</title>
  <link rel="stylesheet" href="/common/admin.css"/>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div>
        <h1>统一同步中心</h1>
        <p class="subtitle">企微 A、企微 B、飞书与 T+ ERP 的统一控制、运行和告警中心。</p>
      </div>
      <nav class="actions" aria-label="页面操作">
        <a class="btn" href="/health/">← 返回 API Health</a>
        <button id="loginBtn" class="btn" type="button">登录（SSO）</button>
        <button id="logoutBtn" class="btn hidden" type="button">退出登录</button>
        <button id="refreshBtn" class="btn primary hidden" type="button">刷新</button>
      </nav>
    </header>

    <div id="gateHint" class="band">此页面仅管理员可见。请点右上角「登录（SSO）」。</div>

    <main id="adminContent" class="hidden">
      <section class="band" aria-labelledby="summaryTitle">
        <div class="row" style="justify-content:space-between">
          <div>
            <h2 id="summaryTitle" style="margin:0">同步概况</h2>
            <p class="muted">新鲜度按每个作业自身 SLA 计算；未配置 SLA 的作业单列为「未监控」。</p>
          </div>
          <div class="row" aria-label="同步操作">
            <button id="runAllBtn" class="btn primary" type="button">全部立即同步</button>
          </div>
        </div>
        <div id="syncSummary" aria-live="polite"><div class="muted">加载中…</div></div>
      </section>

      <section class="band" aria-labelledby="configTitle">
        <h2 id="configTitle">同步设置</h2>
        <div class="grid">
          <article id="docConfigCard" class="panel">
            <h3>企微 / 飞书</h3>
            <div class="row"><label><input id="docConfigEnabled" type="checkbox"/> 定时同步</label><label>周期（小时） <input id="docConfigHours" type="number" min="1" max="168" step="0.5"/></label><label>执行时刻 <input id="docConfigAnchor" type="time"/></label><label><input id="docConfigPaused" type="checkbox"/> 暂停配置表拉取</label><button id="docConfigSaveBtn" class="btn" type="button">保存</button></div>
            <div id="docConfigStatus" class="muted"></div>
          </article>
          <article id="tplusConfigCard" class="panel">
            <h3>T+ ERP</h3>
            <div class="row"><label><input id="tplusConfigEnabled" type="checkbox"/> 定时同步</label><label>周期（小时） <input id="tplusConfigHours" type="number" min="1" max="168" step="0.5"/></label><label>执行时刻 <input id="tplusConfigAnchor" type="time"/></label><button id="tplusConfigSaveBtn" class="btn" type="button">保存</button></div>
            <div id="tplusConfigStatus" class="muted"></div>
          </article>
        </div>
      </section>

      <section class="band" aria-labelledby="assetsTitle">
        <div class="row" style="justify-content:space-between"><div><h2 id="assetsTitle" style="margin:0">同步资产</h2><p class="muted">一行一个文档——同步本来就是整簿进行的；不可自动同步的分享链接会明确标注。表级明细只在该文档有失败或未解决告警时自动展开。</p></div></div>
        <div id="assetTabs" class="row" style="margin:10px 0"></div>
        <div class="row" style="margin-bottom:12px">
          <label>状态 <select id="assetStatusFilter"><option value="">全部</option><option value="running">运行中</option><option value="success">成功</option><option value="partial">部分成功</option><option value="failed">失败</option><option value="skipped">已跳过</option><option value="never">无记录</option></select></label>
          <label>新鲜度 <select id="assetFreshnessFilter"><option value="">全部</option><option value="fresh">新鲜</option><option value="warning">即将过期</option><option value="stale">已过期</option><option value="never">从未成功</option><option value="unmonitored">未监控</option></select></label>
          <label>搜索 <input id="assetSearchFilter" type="search" placeholder="文档名或作业键"/></label>
        </div>
        <div id="assetList" class="muted" aria-live="polite">加载中…</div>
      </section>

      <section class="band" aria-labelledby="alertsTitle">
        <h2 id="alertsTitle">未解决告警</h2>
        <div id="alertList" class="list muted" aria-live="polite">加载中…</div>
      </section>

      <section class="band" aria-labelledby="timelineTitle">
        <h2 id="timelineTitle">全局运行时间线</h2>
        <div class="row" style="margin-bottom:12px">
          <label>分类
            <select id="timelineGroupFilter" aria-label="按分类筛选">
              <option value="">全部</option>
              <option value="tplus">T+ ERP</option>
              <option value="wecom_company_a">企微 A</option>
              <option value="wecom_company_b">企微 B</option>
              <option value="feishu">飞书</option>
            </select>
          </label>
          <label>提供方
            <select id="providerFilter" aria-label="按提供方筛选">
              <option value="">全部</option>
              <option value="wecom">企微</option>
              <option value="feishu">飞书</option>
              <option value="chanjet">畅捷通</option>
            </select>
          </label>
          <label>状态
            <select id="statusFilter" aria-label="按运行状态筛选">
              <option value="">全部</option>
              <option value="running">运行中</option>
              <option value="success">成功</option>
              <option value="partial">部分成功</option>
              <option value="failed">失败</option>
            </select>
          </label>
          <label>作业
            <select id="jobFilter" aria-label="按作业筛选"><option value="">全部</option></select>
          </label>
        </div>
        <div id="timelineList" class="muted" aria-live="polite">加载中…</div>
        <div id="timelinePager" class="row" style="justify-content:center;margin-top:12px">
          <button id="timelinePrevBtn" class="btn" type="button" disabled>上一页</button>
          <span id="timelinePageInfo" class="muted">第 1/1 页</span>
          <button id="timelineNextBtn" class="btn" type="button" disabled>下一页</button>
        </div>
      </section>
    </main>
  </div>

  <div id="runDrawer" class="modal" role="dialog" aria-modal="true" aria-labelledby="runDrawerTitle">
    <div class="modal-panel">
      <div class="row" style="justify-content:space-between">
        <h2 id="runDrawerTitle" style="margin:0">运行详情</h2>
        <button id="runDrawerCloseBtn" class="btn" type="button">关闭</button>
      </div>
      <div id="runDetailBody" style="margin-top:12px" aria-live="polite"></div>
    </div>
  </div>

  <script src="/common/toast.js"></script>
  <script src="/common/admin-auth.js"></script>
  <script>
    const {api, fetchMe, esc, fmtTime, chip, clearAuthToken, ssoLogin} = AliECSAdmin;
    const $=(id)=>document.getElementById(id);
    const state={overview:null,assets:[],problemJobs:[],visibleAssets:[],activeAssetGroup:'tplus',alerts:[],runs:[],limit:20,offset:0,total:0,timelineRequestId:0,timelineLoading:false,controlBusy:false};
    const copyIdempotencyKeys=new Map();
    const initialParams=new URLSearchParams(location.search);
    const initialJob=initialParams.get('job')||'';
    const initialGroup=initialParams.get('group')||'';
    if(['tplus','wecom_company_a','wecom_company_b','feishu','system'].includes(initialGroup))state.activeAssetGroup=initialGroup;
    let detailPollTimer=null,openRunId=null,detailGeneration=0,sessionGeneration=0,loadGeneration=0;

    const freshnessLabels={fresh:'新鲜',warning:'即将过期',stale:'已过期',never:'从未成功',unmonitored:'未监控'};
    const triggerLabels={manual:'手动',schedule:'定时',event:'订阅变更',scheduled:'定时',webhook:'订阅变更',unknown:'未知'};
    const groupLabels={tplus:'T+ ERP',wecom_company_a:'企微 A',wecom_company_b:'企微 B',feishu:'飞书',system:'系统任务'};
    const groupLabel=(value)=>groupLabels[value]||value||'-';

    // skipped｜内容未变整簿跳过：企微 modify_time 没动时不重拉。它和「没跑」是两件事，
    // 标签必须自带解释，否则用户看到「已跳过」还是会以为同步没工作。
    const runStatusMeta={
      success:{css:'ok',label:'成功'},
      failed:{css:'failed',label:'失败'},
      partial:{css:'warning',label:'部分成功'},
      running:{css:'degraded',label:'运行中'},
      skipped:{css:'',label:'已跳过·内容未变'},
      never:{css:'',label:'无记录'},
    };
    function statusChip(value){
      const meta=runStatusMeta[String(value||'')];
      if(!meta)return chip(esc(value||'unknown'));
      return `<span class="chip ${esc(meta.css)}">${esc(meta.label)}</span>`;
    }
    function showError(message){AliECSToast.show(message,'error');}
    function freshnessChip(value){
      const key=String(value||'unmonitored');
      const label=freshnessLabels[key]||key;
      const css=key==='fresh'?'ok':key==='stale'?'failed':key;
      return `<span class="chip ${esc(css)}">${esc(label)}</span>`;
    }
    function scheduleLabel(value){return value&&Object.keys(value).length?'已配置':'未配置';}
    function durationLabel(value){
      if(value==null)return '-';
      const seconds=Math.max(0,Number(value)||0);
      return seconds>=60?`${Math.floor(seconds/60)} 分 ${Math.round(seconds%60)} 秒`:`${Math.round(seconds)} 秒`;
    }
    // 概况区只回答三个问题：一共多少作业、有没有出问题、新鲜度这列能不能信。
    // 旧版把 10 个计数平铺成等大卡片，生产上其中 8 个恒为 0，占了约 600px 却没有信息。
    const problemStatuses=[['failed','失败','failed'],['partial','部分成功','warning'],['running','运行中','degraded']];
    function overviewProblemChips(summary){
      const chips=problemStatuses
        .filter(([key])=>Number(summary[key]||0)>0)
        .map(([key,label,css])=>`<button class="chip ${esc(css)} clickable" type="button" onclick="focusAssetStatus('${key}')">${esc(label)} ${esc(summary[key])}</button>`);
      if(Number(summary.open_alerts||0)>0)
        chips.push(`<button class="chip failed clickable" type="button" onclick="focusAlerts()">未解决告警 ${esc(summary.open_alerts)}</button>`);
      return chips.length?chips.join(''):'<span class="chip ok">无异常</span>';
    }
    function overviewFreshnessLine(summary){
      const jobs=Number(summary.jobs||0),unmonitored=Number(summary.unmonitored||0),monitored=jobs-unmonitored;
      const chips=['stale','warning','fresh','never']
        .filter((key)=>Number(summary[key]||0)>0)
        .map((key)=>`<span class="chip ${esc(key==='fresh'?'ok':key==='stale'||key==='never'?'failed':'warning')}">${esc(freshnessLabels[key])} ${esc(summary[key])}</span>`)
        .join('');
      // 没配 SLA 的作业算不出新鲜度。生产上 91/92 都没配，不写清楚这一行会被当成健康度读。
      const coverage=!unmonitored
        ? `${jobs} 个作业全部已配 SLA`
        : `未监控 ${unmonitored}/${jobs}${monitored?`，仅 ${monitored} 个作业配了 SLA`:'，没有任何作业配 SLA，本行不代表健康度'}`;
      return `<span class="muted">${esc(coverage)}</span>${chips}`;
    }
    function overviewComposition(items){
      const counts=new Map();
      for(const item of items){
        const key=groupLabels[item.source_group]?item.source_group:'system';
        counts.set(key,(counts.get(key)||0)+1);
      }
      return [...counts.entries()].sort((a,b)=>b[1]-a[1]).map(([key,count])=>`${groupLabel(key)} ${count}`).join(' · ');
    }
    function focusAssetStatus(status){
      const target=((state.overview&&state.overview.items)||[]).find((item)=>(item.last_run||{}).status===status);
      if(target&&groupLabels[target.source_group])state.activeAssetGroup=target.source_group;
      $('assetStatusFilter').value=status;
      $('assetFreshnessFilter').value='';
      $('assetSearchFilter').value='';
      renderAssets();
      scrollToSection('assetsTitle');
    }
    function focusAlerts(){scrollToSection('alertsTitle');}
    function scrollToSection(id){
      const node=$(id);
      if(node&&typeof node.scrollIntoView==='function')node.scrollIntoView({behavior:'smooth',block:'start'});
    }

    function renderOverview(){
      const data=state.overview||{},summary=data.summary||{},items=data.items||[];
      $('syncSummary').innerHTML=`
        <div class="row" style="gap:16px;align-items:baseline">
          <div><span style="font-size:26px;font-weight:800">${esc(summary.jobs||0)}</span> <span class="muted">个作业</span></div>
          <span class="muted">${esc(overviewComposition(items))}</span>
        </div>
        <div class="row" style="margin-top:10px"><span class="muted" style="min-width:56px">异常</span>${overviewProblemChips(summary)}</div>
        <div class="row" style="margin-top:8px"><span class="muted" style="min-width:56px">新鲜度</span>${overviewFreshnessLine(summary)}</div>`;

      const selected=initialJob||$('jobFilter').value;
      $('jobFilter').innerHTML=`<option value="">全部</option>${items.map((item)=>`<option value="${esc(item.job_key)}">${esc(item.display_name)}（${esc(item.job_key)}）</option>`).join('')}`;
      if(items.some((item)=>item.job_key===selected))$('jobFilter').value=selected;
      // 作业已并入同步资产：概况一到就重画资产行，两个接口是并行加载的。
      if(state.assets.length)renderAssets();
    }

    // 作业挂在表级来源上，资产按文档展示。聚合键用后端给的文档级 source id，
    // 不用文档名——文档一改名就会错配到别的行。
    const freshnessRank={fresh:0,unmonitored:1,warning:2,stale:3,never:4};
    function assetJobKey(item){
      if(item&&item.source_id!=null)return `doc:${item.source_id}`;
      if(item&&item.job_key)return `job:${item.job_key}`;
      return '';
    }
    // 孤儿作业的判据是「没有任何资产认领它」，不是某个写死的 job_key 名单：
    // 名单会随新增系统任务悄悄失效，作业就从所有分组里一起消失。
    function groupJobsByAsset(assetKeys){
      const byAsset=new Map(),system=[];
      for(const job of (state.overview&&state.overview.items)||[]){
        const docKey=job.doc_source_id!=null?`doc:${job.doc_source_id}`:'';
        const jobKey=job.job_key?`job:${job.job_key}`:'';
        const key=docKey&&assetKeys.has(docKey)?docKey:(jobKey&&assetKeys.has(jobKey)?jobKey:'');
        if(!key){system.push(job);continue;}
        if(!byAsset.has(key))byAsset.set(key,[]);
        byAsset.get(key).push(job);
      }
      return {byAsset,system};
    }
    function rollupJobs(jobs){
      const roll={jobs,count:jobs.length,freshness:'',status:'',lastStartedAt:null,alerts:0,unreadable:0,problems:[]};
      for(const job of jobs){
        const last=job.last_run||{},fresh=(job.freshness&&job.freshness.state)||'unmonitored';
        roll.alerts+=Number(job.open_alert_count||0);
        roll.unreadable+=Number(last.unreadable_record_count||0);
        if(!roll.freshness||freshnessRank[fresh]>freshnessRank[roll.freshness])roll.freshness=fresh;
        if(last.started_at&&(!roll.lastStartedAt||String(last.started_at)>String(roll.lastStartedAt)))roll.lastStartedAt=last.started_at;
        // 状态取最坏的一档：一张表失败就是这个文档有问题，别被其余成功的表盖过去。
        // skipped 排在 success 之下、never 之上：跳过比没记录有信息，但比真拉过一轮弱。
        const rank={failed:5,partial:4,running:3,success:2,skipped:1,never:0};
        const current=last.status||'never';
        if(!roll.status||rank[current]>rank[roll.status])roll.status=current;
        if(current==='failed'||current==='partial'||Number(job.open_alert_count||0)>0)roll.problems.push(job);
      }
      return roll;
    }
    function problemRows(roll,colspan){
      if(!roll.problems.length)return '';
      const rows=roll.problems.map((job)=>{
        const last=job.last_run||{};
        const label=job.sheet_name||job.display_name||job.job_key;
        const error=last.error_message?`<div class="muted">${esc(last.error_label)}：${esc(last.error_message)}</div>`:'';
        const alerts=Number(job.open_alert_count||0)?`<span class="chip failed">未解决告警 ${esc(job.open_alert_count)}</span>`:'';
        const index=state.problemJobs.push(job)-1;
        const retry=job.manual_triggerable
          ?`<button class="btn" type="button" ${state.controlBusy||!job.enabled?'disabled':''} onclick="runProblemJob(${index},this)">重试这张表</button>`
          :'<span class="muted">系统调度，不支持手动触发</span>';
        return `<tr><td><strong>${esc(label)}</strong><div class="muted">${esc(job.job_key)}</div></td><td>${last.status?statusChip(last.status):'<span class="muted">无记录</span>'} ${alerts}<div class="muted">${esc(fmtTime(last.started_at))}</div>${error}</td><td>${retry}</td></tr>`;
      }).join('');
      return `<tr><td colspan="${colspan}"><div class="attention critical" style="margin:0"><strong>需要处理的表（${roll.problems.length}）</strong></div><table style="margin-top:8px"><thead><tr><th>子表</th><th>最近运行</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></td></tr>`;
    }

    function renderAssets(){
      const assetKeys=new Set();
      for(const group of state.assets||[])for(const item of group.items||[]){
        const key=assetJobKey(item);
        if(key)assetKeys.add(key);
      }
      const {byAsset,system}=groupJobsByAsset(assetKeys);
      const groups=[...(state.assets||[])];
      // 不挂在任何文档下的作业（定位档案镜像、T+ 父件核对）自成一组，否则合并后就没地方放了。
      if(system.length)groups.push({
        key:'system',
        title:'系统任务',
        // can_sync 判据必须来自后端的 manual_triggerable，不能拿 enabled 自己推：
        // enabled 只说作业开着，说明不了它能不能手动排队。kind='mirror' 的
        // wecom.locator_mirror 和 kind='reconcile' 的 tplus.parent_match 都是 enabled=true，
        // 旧写法照样给它们渲染「立即同步」，点下去必然报「同步作业不存在或不可手动触发」。
        items:system.map((job)=>({name:job.display_name,job_key:job.job_key,sheets:null,jobs:1,
          updated_at:(job.last_run||{}).started_at||null,can_sync:!!job.manual_triggerable,can_download:false,
          can_copy:false,system_managed:true,source_id:null,
          reason:job.manual_triggerable?'系统任务，不对应企微/飞书文档':'系统调度，不支持手动触发'})),
      });
      $('assetTabs').innerHTML=groups.map((group)=>`<button class="btn ${group.key===state.activeAssetGroup?'primary':''}" type="button" onclick="selectAssetGroup('${esc(group.key)}')">${esc(group.title)}（${(group.items||[]).length}）</button>`).join('');
      const group=groups.find((item)=>item.key===state.activeAssetGroup)||groups[0];
      if(!group){$('assetList').innerHTML='<span class="muted">暂无同步资产。</span>';return;}

      const statusFilter=$('assetStatusFilter').value,freshnessFilter=$('assetFreshnessFilter').value;
      const search=$('assetSearchFilter').value.trim().toLowerCase();
      state.problemJobs=[];
      const visible=[];
      for(const item of group.items||[]){
        const jobs=item.system_managed&&item.source_id==null&&item.job_key
          ?system.filter((job)=>job.job_key===item.job_key)
          :(byAsset.get(assetJobKey(item))||[]);
        const roll=rollupJobs(jobs);
        const text=`${item.name||''} ${jobs.map((job)=>job.job_key).join(' ')}`.toLowerCase();
        if(statusFilter&&(roll.status||'never')!==statusFilter)continue;
        if(freshnessFilter&&(roll.freshness||'unmonitored')!==freshnessFilter)continue;
        if(search&&!text.includes(search))continue;
        visible.push({item,roll});
      }
      state.visibleAssets=visible.map((entry)=>entry.item);
      const rows=visible.map(({item,roll},index)=>{
        const reason=item.can_sync?'':`<div class="muted">${esc(item.reason||'来源无有效 API 标识')}</div>`;
        const systemChip=item.system_managed?'<span class="chip warning">系统管理资产</span>':'';
        const actions=[];
        if(item.can_download)actions.push(`<button class="btn primary" type="button" onclick="downloadVisibleAsset(${index})">下载</button>`);
        if(item.can_sync)actions.push(`<button class="btn" type="button" ${state.controlBusy?'disabled':''} onclick="runVisibleAsset(${index},this)">立即同步</button>`);
        if(item.can_copy)actions.push(`<button class="btn" type="button" ${state.controlBusy?'disabled':''} onclick="copyVisibleAsset(${index},this)">创建副本</button>`);
        if(!item.can_sync&&item.source_id!=null&&!item.system_managed&&String(item.reason||'').includes('docid'))actions.push(`<button class="btn" type="button" ${state.controlBusy?'disabled':''} onclick="repairVisibleAsset(${index},this)">补录 docid</button>`);
        if(!actions.length)actions.push('<span class="chip failed">暂无可用操作</span>');
        const alerts=roll.alerts?`<span class="chip failed">${esc(roll.alerts)}</span>`:'<span class="muted">0</span>';
        // 企微对个别记录返回 60111/-1 时那几条永远读不出来（成员字段指向解析不到的 userid）。
        // 这是数据源的稳定缺陷、不是同步失败，所以常驻标注，不走告警。
        const unreadable=roll.unreadable
          ?`<span class="chip warning" title="企微对这些记录返回 60111，成员字段指向解析不到的 userid">${esc(roll.unreadable)} 条不可读</span>`
          :'';
        const statusCell=roll.jobs.length
          ?`${roll.status&&roll.status!=='never'?statusChip(roll.status):'<span class="muted">无记录</span>'} ${unreadable}<div class="muted">${esc(fmtTime(roll.lastStartedAt))}</div>`
          :'<span class="muted">-</span>';
        return `<tr><td><strong>${esc(item.name)}</strong> ${systemChip}${reason}</td><td>${item.system_managed?'<span class="muted">—</span>':esc(item.sheets??'-')}</td><td>${esc(roll.count||item.jobs||0)}</td><td>${roll.jobs.length?freshnessChip(roll.freshness):'<span class="muted">-</span>'}</td><td>${statusCell}</td><td>${esc(fmtTime(item.updated_at))}</td><td>${alerts}</td><td><div class="row">${actions.join('')}</div></td></tr>${problemRows(roll,8)}`;
      }).join('');
      $('assetList').innerHTML=`<table><thead><tr><th>资产</th><th>表数</th><th>作业数</th><th>新鲜度</th><th>最近运行</th><th>最近取数</th><th>告警</th><th>操作</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="muted">当前筛选无同步资产。</td></tr>'}</tbody></table>`;
    }
    function selectAssetGroup(key){state.activeAssetGroup=key;renderAssets();}

    function renderConfig(kind,data){
      const prefix=kind==='doc'?'doc':'tplus';
      $(`${prefix}ConfigEnabled`).checked=!!data.enabled;
      $(`${prefix}ConfigHours`).value=data.interval_hours??24;
      $(`${prefix}ConfigAnchor`).value=data.anchor_time||'';
      if(kind==='doc')$('docConfigPaused').checked=!!data.pull_paused;
      $(`${prefix}ConfigStatus`).textContent=data.updated_at?`更新：${fmtTime(data.updated_at)}`:'';
    }

    function renderAlerts(){
      if(!state.alerts.length){$('alertList').innerHTML='<div class="muted">暂无未解决告警。</div>';return;}
      $('alertList').innerHTML=state.alerts.map((item)=>`<article class="attention critical"><strong>${esc(item.display_name)}</strong> · ${esc(item.alert_kind)}<div class="muted">${esc(item.job_key)} · ${esc(item.provider)} · 首次发现 ${esc(fmtTime(item.first_seen_at))} · 通知 ${esc(item.notify_count||0)} 次</div></article>`).join('');
    }

    function renderTimeline(){
      const rows=state.runs.map((item)=>{
        const error=item.error_message?`<div class="muted">${esc(item.error_label)}：${esc(item.error_message)}</div>`:'';
        const runId=Number(item.id);
        const detailButton=Number.isSafeInteger(runId)&&runId>0
          ?`<button class="btn" type="button" onclick="openRunDetail(${runId})">查看详情</button>`
          :'<span class="muted">-</span>';
        return `<tr><td><strong>${esc(item.display_name)}</strong><div class="muted">${esc(item.job_key)}</div></td><td>${esc(groupLabel(item.source_group))}</td><td>${esc(item.provider)}</td><td>${esc(triggerLabels[item.trigger]||item.trigger||'-')}</td><td>${statusChip(item.status)}${error}</td><td>${esc(fmtTime(item.started_at))}</td><td>${esc(durationLabel(item.duration_seconds))}</td><td>${esc(item.row_count??'-')}</td><td>${esc(item.changed_count??'-')}</td><td>${detailButton}</td></tr>`;
      }).join('');
      $('timelineList').innerHTML=`<table><thead><tr><th>作业</th><th>分类</th><th>提供方</th><th>触发</th><th>状态</th><th>开始时间</th><th>耗时</th><th>行数</th><th>变更</th><th>操作</th></tr></thead><tbody>${rows||'<tr><td colspan="10" class="muted">当前筛选无运行记录。</td></tr>'}</tbody></table>`;
      renderTimelinePager(state.offset,state.timelineLoading);
    }
    function renderTimelinePager(offset=state.offset,loading=state.timelineLoading){
      const pages=Math.max(1,Math.ceil(state.total/state.limit));
      const page=Math.floor(offset/state.limit)+1;
      $('timelinePageInfo').textContent=`第 ${page}/${pages} 页 · 共 ${state.total} 条${loading?' · 加载中…':''}`;
      $('timelinePrevBtn').disabled=loading||offset<=0;
      $('timelineNextBtn').disabled=loading||offset+state.limit>=state.total;
    }

    function renderSteps(steps){
      if(!steps||!steps.length)return '<div class="muted">该运行暂无步骤记录。</div>';
      return `<div class="list">${steps.map((step)=>{
        let result='<span class="muted">-</span>';
        if(step.status==='running')result='<span class="muted">进行中</span>';
        else if(step.status==='failed'&&step.message)result=`<span class="failed">${esc(step.message)}</span>`;
        else if(step.status==='success')result=`<span class="muted">处理 ${esc(step.items??0)} 项</span>`;
        return `<article class="attention ${step.status==='failed'?'critical':''}"><div class="row" style="justify-content:space-between"><strong>${esc(step.seq)}. ${esc(step.name)}</strong>${statusChip(step.status)}</div><div class="muted">${esc(fmtTime(step.started_at))} · ${esc(stepDurationLabel(step))}</div><div style="margin-top:6px">${result}</div></article>`;
      }).join('')}</div>`;
    }
    function stepDurationLabel(step){
      if(step.status==='running')return '进行中';
      const started=Date.parse(step.started_at||''),finished=Date.parse(step.finished_at||'');
      if(!Number.isFinite(started)||!Number.isFinite(finished))return '-';
      return durationLabel(Math.max(0,(finished-started)/1000));
    }
    function renderDiffItemRows(title,items){
      const list=Array.isArray(items)?items:[];
      const rows=list.map((item)=>`<tr><td>${esc(item&&item.parent_code)}</td><td>${esc(item&&item.parent_name)}</td><td>${esc(item&&item.version)}</td><td>${esc(item&&item.child_code)}</td><td>${esc(item&&item.child_name)}</td><td>${esc(item&&item.unit)}</td><td>${esc(item&&item.quantity)}</td><td>${esc(item&&item.disabled)}</td></tr>`).join('');
      return `<h4>${esc(title)}（${list.length}）</h4><table><thead><tr><th>父件编码</th><th>父件名称</th><th>版本</th><th>子件编码</th><th>子件名称</th><th>单位</th><th>数量</th><th>停用</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="muted">无</td></tr>'}</tbody></table>`;
    }
    function renderChangedRows(items){
      const list=Array.isArray(items)?items:[];
      const rows=list.map((item)=>{
        const key=item&&item.key||{},before=item&&item.before||{},after=item&&item.after||{};
        const fields=Array.isArray(item&&item.changed_fields)?item.changed_fields.join(', '):'';
        return `<tr><td>${esc(key.parent_code)}</td><td>${esc(key.version)}</td><td>${esc(key.child_code)}</td><td>${esc(fields)}</td><td>${esc(before.quantity)}</td><td>${esc(after.quantity)}</td><td>${esc(before.child_name)}</td><td>${esc(after.child_name)}</td></tr>`;
      }).join('');
      return `<h4>字段变化（${list.length}）</h4><table><thead><tr><th>父件编码</th><th>版本</th><th>子件编码</th><th>变化字段</th><th>原数量</th><th>新数量</th><th>原子件名</th><th>新子件名</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="muted">无</td></tr>'}</tbody></table>`;
    }
    function renderReconciliation(data){
      if(data&&data.reconciliation_error)return '<div class="attention critical">差异明细读取失败</div>';
      const reconciliation=data&&data.reconciliation;
      if(!reconciliation)return '<div class="muted">暂无可用差异明细。</div>';
      const diff=reconciliation.diff_json&&typeof reconciliation.diff_json==='object'?reconciliation.diff_json:{};
      return `<div class="panel"><strong>${esc(reconciliation.summary||'差异校验')}</strong><div class="muted">状态 ${esc(reconciliation.status||'-')} · 严重度 ${esc(reconciliation.severity||'-')}</div></div>${renderDiffItemRows('新增子件',diff.added)}${renderDiffItemRows('删除子件',diff.removed)}${renderChangedRows(diff.changed)}`;
    }
    function renderRunDetail(data){
      const run=data&&data.run?data.run:{};
      const error=run.error_message?`<div class="attention critical"><strong>${esc(run.error_label||'未知错误')}</strong><br/>${esc(run.error_message)}</div>`:'';
      const reconciliation=data&&data.reconciliation_id!=null
        ?`<h3>变化明细</h3>${renderReconciliation(data)}`:'';
      $('runDetailBody').innerHTML=`
        <div class="panel"><strong>${esc(run.display_name||'-')}</strong><div class="muted">${esc(run.job_key||'-')} · ${esc(run.provider||'-')} · ${esc(triggerLabels[run.trigger]||run.trigger||'-')}</div><div class="row" style="margin-top:8px">${statusChip(run.status)}<span class="muted">开始 ${esc(fmtTime(run.started_at))} · 耗时 ${esc(durationLabel(run.duration_seconds))} · 行数 ${esc(run.row_count??'-')} · 变更 ${esc(run.changed_count??'-')}</span></div></div>
        ${error}<h3>运行步骤</h3>${renderSteps(data&&data.steps?data.steps:[])}${reconciliation}`;
    }
    function stopDetailPolling(){
      if(detailPollTimer!==null){clearTimeout(detailPollTimer);detailPollTimer=null;}
    }
    function detailIsCurrent(generation,runId){
      return generation===detailGeneration&&openRunId===runId&&$('runDrawer').classList.contains('show');
    }
    async function loadReconciliation(data,generation,runId){
      if(!data||data.reconciliation_id==null)return data;
      try{
        const reconciliation=await api(`/v1/ops/reconciliation/${data.reconciliation_id}`);
        if(!detailIsCurrent(generation,runId))return null;
        return {...data,reconciliation};
      }catch(error){
        if(!detailIsCurrent(generation,runId))return null;
        return {...data,reconciliation_error:true};
      }
    }
    function scheduleDetailPolling(generation,runId){
      stopDetailPolling();
      if(!detailIsCurrent(generation,runId))return;
      detailPollTimer=setTimeout(()=>{
        detailPollTimer=null;
        refreshOpenRun(generation,runId);
      },3000);
    }
    async function openRunDetail(value){
      const runId=String(value),generation=++detailGeneration;
      openRunId=runId;
      stopDetailPolling();
      $('runDrawer').classList.add('show');
      $('runDetailBody').innerHTML='<div class="muted">加载运行详情…</div>';
      try{
        let data=await api(`/v1/sync/runs/${runId}`);
        if(!detailIsCurrent(generation,runId))return;
        data=await loadReconciliation(data,generation,runId);
        if(!data||!detailIsCurrent(generation,runId))return;
        renderRunDetail(data);
        if(data.run&&data.run.status==='running')scheduleDetailPolling(generation,runId);
      }catch(error){
        if(!detailIsCurrent(generation,runId))return;
        $('runDetailBody').innerHTML=`<div class="attention critical"><strong>详情加载失败</strong><br/>${esc(error.message)}</div>`;
        showError(`运行详情加载失败：${error.message}`);
      }
    }
    async function refreshOpenRun(generation,runId){
      if(!detailIsCurrent(generation,runId))return;
      let data;
      try{
        data=await api(`/v1/sync/runs/${runId}`);
      }catch(error){
        if(!detailIsCurrent(generation,runId))return;
        showError(`运行详情刷新失败：${error.message}`);
        scheduleDetailPolling(generation,runId);
        return;
      }
      if(!detailIsCurrent(generation,runId))return;
      data=await loadReconciliation(data,generation,runId);
      if(!data||!detailIsCurrent(generation,runId))return;
      renderRunDetail(data);
      if(data.run&&data.run.status==='running'){
        scheduleDetailPolling(generation,runId);
        return;
      }
      stopDetailPolling();
      await loadAll().catch((error)=>showError(`同步中心刷新失败：${error.message}`));
    }
    function closeRunDetail(){
      detailGeneration+=1;
      openRunId=null;
      stopDetailPolling();
      $('runDrawer').classList.remove('show');
      $('runDetailBody').innerHTML='';
    }

    function beginLoad(){return {session:sessionGeneration,load:++loadGeneration};}
    function currentLoad(){return {session:sessionGeneration,load:loadGeneration};}
    function loadIsCurrent(generation){return generation.session===sessionGeneration&&generation.load===loadGeneration;}
    async function loadOverview(generation=beginLoad()){
      try{
        const data=await api('/v1/sync/overview');
        if(!loadIsCurrent(generation))return;
        state.overview=data;renderOverview();
      }catch(error){if(loadIsCurrent(generation))throw error;}
    }
    async function loadAlerts(generation=beginLoad()){
      try{
        const data=await api('/v1/sync/alerts?state=open&limit=50&offset=0');
        if(!loadIsCurrent(generation))return;
        state.alerts=data.items||[];renderAlerts();
      }catch(error){if(loadIsCurrent(generation))throw error;}
    }
    async function loadControl(generation=beginLoad()){
      try{
        const [assets,docConfig,tplusConfig]=await Promise.all([
          api('/v1/sync/assets'),api('/v1/sync/config/doc'),api('/v1/sync/config/tplus')
        ]);
        if(!loadIsCurrent(generation))return;
        state.assets=assets.groups||[];renderAssets();renderConfig('doc',docConfig);renderConfig('tplus',tplusConfig);
      }catch(error){if(loadIsCurrent(generation))throw error;}
    }
    async function loadTimeline(requestOffset=state.offset,generation=currentLoad()){
      const requestId=++state.timelineRequestId;
      const params=new URLSearchParams({limit:String(state.limit),offset:String(requestOffset)});
      if($('timelineGroupFilter').value)params.set('group',$('timelineGroupFilter').value);
      if($('providerFilter').value)params.set('provider',$('providerFilter').value);
      if($('statusFilter').value)params.set('status',$('statusFilter').value);
      if($('jobFilter').value)params.set('job_key',$('jobFilter').value);
      state.timelineLoading=true;
      renderTimelinePager(requestOffset,true);
      try{
        const d=await api(`/v1/sync/runs?${params}`);
        if(requestId!==state.timelineRequestId||!loadIsCurrent(generation))return;
        state.offset=requestOffset;
        state.runs=d.items||[];
        state.total=d.total||0;
        renderTimeline();
      }catch(error){
        if(requestId!==state.timelineRequestId||!loadIsCurrent(generation))return;
        throw error;
      }finally{
        if(requestId===state.timelineRequestId&&loadIsCurrent(generation)){
          state.timelineLoading=false;
          renderTimelinePager(state.offset,false);
        }
      }
    }
    async function loadAll(){
      const generation=beginLoad();
      await Promise.all([loadOverview(generation),loadAlerts(generation),loadControl(generation),loadTimeline(state.offset,generation)]);
    }
    async function withControlBusy(button,work){
      if(state.controlBusy)return;
      const session=sessionGeneration;
      state.controlBusy=true;if(button)button.disabled=true;$('runAllBtn').disabled=true;
      try{await work(session);}finally{if(session===sessionGeneration){state.controlBusy=false;if(button)button.disabled=false;$('runAllBtn').disabled=false;renderOverview();renderAssets();}}
    }
    async function runAll(button=$('runAllBtn')){
      await withControlBusy(button,async(session)=>{const data=await api('/v1/sync/run-all',{method:'POST'});if(session!==sessionGeneration)return;AliECSToast.show(data.message||'同步请求已排队。','success');await loadAll();});
    }
    async function runAsset(sourceId,button){
      await withControlBusy(button,async(session)=>{const data=await api(`/v1/sync/assets/${sourceId}/run`,{method:'POST'});if(session!==sessionGeneration)return;AliECSToast.show(data.queued?'同步请求已排队。':'已有请求正在执行。','success');await loadAll();});
    }
    function newCopyActionKey(){
      if(globalThis.crypto&&typeof crypto.randomUUID==='function')return crypto.randomUUID();
      return `copy-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }
    async function copyAsset(sourceId,button){
      const key=copyIdempotencyKeys.get(sourceId)||newCopyActionKey();
      copyIdempotencyKeys.set(sourceId,key);
      await withControlBusy(button,async(session)=>{
        await api(`/v1/sync/assets/${sourceId}/copy`,{method:'POST',body:JSON.stringify({idempotency_key:key})});
        if(session!==sessionGeneration)return;
        copyIdempotencyKeys.delete(sourceId);
        AliECSToast.show('副本已创建并登记，首次同步已排队。','success');
        try{await loadAll();}catch(error){AliECSToast.show(`副本已创建，但列表刷新失败：${error.message}`,'warning');}
      });
    }
    async function repairAsset(sourceId,apiDocId,button){
      await withControlBusy(button,async(session)=>{
        await api(`/v1/sync/assets/${sourceId}/docid`,{method:'PUT',body:JSON.stringify({api_doc_id:apiDocId})});
        if(session!==sessionGeneration)return;
        AliECSToast.show('docid 已验证并登记，同步已排队。','success');
        await loadAll();
      });
    }
    async function runJob(jobKey,button){
      await withControlBusy(button,async(session)=>{const data=await api(`/v1/sync/jobs/${encodeURIComponent(jobKey)}/run`,{method:'POST'});if(session!==sessionGeneration)return;AliECSToast.show(data.queued?'同步请求已排队。':'已有请求正在执行。','success');await loadAll();});
    }
    function runProblemJob(index,button){const item=state.problemJobs[index];if(item)runJob(item.job_key,button).catch((error)=>AliECSToast.show(`重试失败：${error.message}`,'error'));}
    function runVisibleAsset(index,button){const item=state.visibleAssets[index];if(!item)return;if(item.source_id!=null)runAsset(Number(item.source_id),button).catch((error)=>AliECSToast.show(`资产同步失败：${error.message}`,'error'));else runJob(item.job_key,button).catch((error)=>AliECSToast.show(`资产同步失败：${error.message}`,'error'));}
    function downloadVisibleAsset(index){const item=state.visibleAssets[index];if(!item||!item.can_download||!item.download_url)return;AliECSAdmin.downloadExport(item.download_url,item.file_name||item.name).catch((error)=>AliECSToast.show(`下载失败：${error.message}`,'error'));}
    function copyVisibleAsset(index,button){const item=state.visibleAssets[index];if(!item||!item.can_copy||item.source_id==null)return;copyAsset(Number(item.source_id),button).catch((error)=>AliECSToast.show(`创建副本失败：${error.message}`,'error'));}
    function repairVisibleAsset(index,button){const item=state.visibleAssets[index];if(!item||item.source_id==null)return;const value=window.prompt('请粘贴企微 API 可用的 dc 开头 docid（不是 s3_ 分享 ID）：','');if(!value)return;repairAsset(Number(item.source_id),value.trim(),button).catch((error)=>AliECSToast.show(`补录 docid 失败：${error.message}`,'error'));}
    async function saveConfig(kind,button){
      const prefix=kind==='doc'?'doc':'tplus',interval_hours=Number($(`${prefix}ConfigHours`).value),anchor_time=$(`${prefix}ConfigAnchor`).value||'';
      if(!(interval_hours>=1&&interval_hours<=168)){AliECSToast.show('周期必须为 1 至 168 小时。','error');return;}
      const body={enabled:$(`${prefix}ConfigEnabled`).checked,interval_hours,anchor_time};
      if(kind==='doc')body.pull_paused=$('docConfigPaused').checked;
      await withControlBusy(button,async(session)=>{const data=await api(`/v1/sync/config/${kind}`,{method:'PUT',body:JSON.stringify(body)});if(session!==sessionGeneration)return;renderConfig(kind,data);AliECSToast.show('同步设置已保存。','success');});
    }
    function reloadTimelineFromStart(){loadTimeline(0).catch((error)=>AliECSToast.show(`时间线加载失败：${error.message}`,'error'));}

    $('timelineGroupFilter').onchange=reloadTimelineFromStart;
    $('providerFilter').onchange=reloadTimelineFromStart;
    $('statusFilter').onchange=reloadTimelineFromStart;
    $('jobFilter').onchange=reloadTimelineFromStart;
    for(const id of ['assetStatusFilter','assetFreshnessFilter'])$(id).onchange=renderAssets;
    $('assetSearchFilter').oninput=renderAssets;
    $('runAllBtn').onclick=()=>runAll().catch((error)=>AliECSToast.show(`全部同步失败：${error.message}`,'error'));
    $('docConfigSaveBtn').onclick=()=>saveConfig('doc',$('docConfigSaveBtn')).catch((error)=>AliECSToast.show(`保存失败：${error.message}`,'error'));
    $('tplusConfigSaveBtn').onclick=()=>saveConfig('tplus',$('tplusConfigSaveBtn')).catch((error)=>AliECSToast.show(`保存失败：${error.message}`,'error'));
    $('timelinePrevBtn').onclick=()=>{
      if(state.timelineLoading)return;
      const offset=Math.max(0,state.offset-state.limit);
      if(offset===state.offset)return;
      loadTimeline(offset).catch((error)=>AliECSToast.show(`时间线加载失败：${error.message}`,'error'));
    };
    $('timelineNextBtn').onclick=()=>{
      if(state.timelineLoading||state.offset+state.limit>=state.total)return;
      loadTimeline(state.offset+state.limit).catch((error)=>AliECSToast.show(`时间线加载失败：${error.message}`,'error'));
    };
    $('runDrawerCloseBtn').onclick=closeRunDetail;
    $('runDrawer').onclick=(event)=>{if(event.target===$('runDrawer'))closeRunDetail();};
    refreshBtn.onclick=()=>loadAll().catch((error)=>AliECSToast.show(`同步中心加载失败：${error.message}`,'error'));
    loginBtn.onclick=ssoLogin;
    function clearAdminData(){
      state.overview=null;state.assets=[];state.problemJobs=[];state.visibleAssets=[];state.alerts=[];state.runs=[];state.offset=0;state.total=0;state.timelineLoading=false;state.controlBusy=false;
      copyIdempotencyKeys.clear();
      for(const id of ['syncSummary','assetTabs','assetList','alertList','timelineList','runDetailBody'])$(id).innerHTML='';
      $('timelinePageInfo').textContent='';$('jobFilter').innerHTML='<option value="">全部</option>';
      $('timelinePrevBtn').disabled=true;$('timelineNextBtn').disabled=true;
    }
    logoutBtn.onclick=()=>{
      sessionGeneration+=1;loadGeneration+=1;state.timelineRequestId+=1;
      closeRunDetail();clearAdminData();clearAuthToken();AliECSAdmin.applyGate(null);AliECSToast.show('已退出登录。','success');
    };
    window.addEventListener('beforeunload',stopDetailPolling);
    (async()=>{
      const generation=sessionGeneration,me=await fetchMe();
      if(generation!==sessionGeneration)return;
      AliECSAdmin.applyGate(me,()=>{loadAll().catch((error)=>AliECSToast.show(`同步中心加载失败：${error.message}`,'error'));});
    })();
  </script>
</body>
</html>
