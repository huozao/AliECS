<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>回忆详情</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root{--bg:#f8f4ec;--card:#fffdfa;--text:#2f2721;--muted:#7c6b5d;--line:#ecdfd2;--primary:#8c5f6a;--danger:#a6423a;--shadow:0 10px 28px rgba(93,71,52,.08)}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);margin:0}.wrap{max-width:1050px;margin:0 auto;padding:20px 16px 52px}.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:16px;margin:12px 0}.btn,button{display:inline-flex;align-items:center;justify-content:center;border:0;background:#e8dfcf;border-radius:999px;padding:8px 12px;text-decoration:none;color:#222;cursor:pointer;font-weight:700}.primary{background:var(--primary);color:white}.danger{background:#f1d4d1;color:var(--danger)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}.muted,.small{color:var(--muted)}.small{font-size:13px}.grid{display:grid;gap:12px}.two{grid-template-columns:1.15fr .85fr}.photo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.photo{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff;position:relative}.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.media-actions{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:9px 10px}.media-actions button{padding:5px 8px;font-size:12px}.hero-cover{width:100%;max-height:300px;object-fit:cover;border-radius:14px;margin:0 0 14px;background:#f0e6dc}.editor-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.dirty{color:var(--primary);font-weight:700}.pill{display:inline-block;border-radius:999px;background:#f0e6dc;padding:3px 8px;margin:2px;font-size:12px;color:#6f5d50}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:white}label{display:block;margin:7px 0 5px;font-size:13px;color:var(--muted)}#detailMap{height:260px;border:1px solid var(--line);border-radius:14px}dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);width:min(1000px,calc(100vw - 28px));padding:0;box-shadow:0 24px 80px rgba(54,35,22,.28)}dialog::backdrop{background:rgba(43,30,21,.42)}.dialog-body{padding:18px}.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;max-height:58vh;overflow:auto}.picker-item{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer}.picker-item.selected{outline:3px solid var(--primary)}.picker-item img{width:100%;aspect-ratio:1;object-fit:cover;background:#eee}.picker-item>div{padding:8px;font-size:12px}.picker-item input{width:auto;margin-right:4px}.hidden{display:none!important}@media(max-width:860px){.two{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="wrap">
  <div id="userBadge" class="small" style="margin-bottom:8px"></div>
  <div class="row"><a class="btn" href="/memories/">返回回忆列表</a><a class="btn" href="/couple/">Dashboard</a></div>
  <p id="hint" class="muted"></p>
  <section class="grid two">
    <article class="card">
      <img id="coverImage" class="hero-cover hidden" alt="回忆封面" />
      <div class="row"><h1 id="title">回忆详情</h1><span id="archivedBadge" class="pill hidden">已归档</span></div>
      <div id="meta" class="small"></div>
      <p id="content" style="line-height:1.8"></p>
      <div id="tags"></div>
      <div class="row" style="justify-content:flex-start;margin-top:12px">
        <button id="editBtn" type="button">编辑回忆</button>
        <button id="archiveBtn" type="button">归档</button>
        <button id="deleteBtn" class="danger" type="button">删除</button>
      </div>
    </article>
    <aside class="card">
      <h2>地点</h2>
      <div id="detailMap"></div>
      <p id="mapHint" class="small"></p>
    </aside>
  </section>

  <section id="editCard" class="card hidden">
    <div class="row"><h2>编辑回忆</h2><span id="editHint" class="small"></span></div>
    <form id="editForm" class="grid two">
      <div><label>标题</label><input id="eTitle" required /></div>
      <div><label>日期</label><input id="eDate" type="date" /></div>
      <div><label>地点</label><input id="ePlace" /></div>
      <div><label>标签</label><input id="eTags" placeholder="旅行,日落" /></div>
      <div><label>纬度</label><input id="eLat" type="number" step="0.000001" /></div>
      <div><label>经度</label><input id="eLng" type="number" step="0.000001" /></div>
      <div><label>可见性</label><select id="eVisibility"><option value="private">private</option><option value="shareable">shareable</option></select></div>
      <div style="grid-column:1/-1"><label>内容</label><textarea id="eContent" rows="5"></textarea></div>
      <div class="row" style="grid-column:1/-1;justify-content:flex-start"><button id="saveEditBtn" class="primary" type="submit">保存更改</button><button id="cancelEditBtn" type="button">取消</button></div>
    </form>
  </section>

  <section class="card">
    <div class="row"><h2>照片画廊</h2><div class="row"><button id="addPhotoBtn" class="primary" type="button">从 Immich 添加</button><form id="photoForm" class="row"><input id="photoInput" type="file" accept="image/*" /><button type="submit">上传照片</button></form></div></div>
    <div id="photos" class="photo-grid"></div>
  </section>

  <section id="immichCard" class="card hidden">
    <div class="row"><h2>Immich 照片</h2><span id="immichHint" class="small"></span></div>
    <p class="small">已绑定到这条回忆的照片会显示在这里。使用上面的“从 Immich 添加”可以批量选择个人库或家庭相册。</p>
    <details><summary>高级绑定（兼容旧数据）</summary><form id="immichSearchForm" class="grid two" style="margin-top:12px">
      <div><label>关键词</label><input id="immichQuery" placeholder="地点、文件名或描述" /></div>
      <div><label>起始拍摄日期</label><input id="immichTakenAfter" type="date" /></div>
      <div><label>结束拍摄日期</label><input id="immichTakenBefore" type="date" /></div>
      <div style="align-self:end"><button class="primary" type="submit">搜索 Immich</button></div>
    </form>
    <div id="immichSearchResults" class="photo-grid" style="margin-top:12px"></div>
    <form id="immichForm" class="grid two" style="margin-top:12px">
      <div><label>Immich Asset ID</label><input id="immichAssetId" placeholder="asset id" /></div>
      <div><label>文件名</label><input id="immichFilename" placeholder="未配置 API key 时必填" /></div>
      <div style="grid-column:1/-1" class="row"><button type="submit">绑定照片引用</button></div>
    </form></details>
    <div id="immichAssets" class="photo-grid" style="margin-top:12px"></div>
  </section>

  <dialog id="mediaPickerDialog">
    <div class="dialog-body">
      <div class="row"><div><h2 style="margin:0">添加 Immich 照片</h2><p class="small">默认浏览全部照片，也可以切换到任意 Immich 相册；选择后会加入家庭相册并绑定到当前回忆。</p></div><button id="closePickerBtn" type="button">关闭</button></div>
      <form id="pickerSearchForm" class="grid two" style="margin:10px 0">
        <div><label>照片来源</label><select id="pickerSource"><option value="all">全部照片（默认）</option><option value="personal">个人库（全部）</option><option value="family">家庭相册</option></select></div>
        <div><label>关键词</label><input id="pickerQuery" placeholder="地点、文件名或描述" /></div>
        <div><label>起始日期</label><input id="pickerAfter" type="date" /></div><div><label>结束日期</label><input id="pickerBefore" type="date" /></div>
        <div class="row" style="grid-column:1/-1;justify-content:flex-start"><button class="primary" type="submit">加载照片</button><span id="pickerHint" class="small"></span></div>
      </form>
      <div id="pickerGrid" class="picker-grid"></div>
      <div class="row" style="margin-top:12px"><div><button id="pickerPrevBtn" type="button">上一页</button><button id="pickerNextBtn" type="button">下一页</button><span id="pickerPageHint" class="small" style="margin-left:8px"></span></div><button id="bindPickerBtn" class="primary" type="button">绑定已选（0）</button></div>
    </div>
  </dialog>

  <section class="card">
    <h2>分享链接</h2>
    <div class="row" style="justify-content:flex-start">
      <label style="margin:0">有效天数 <input id="shareDays" type="number" min="1" max="365" placeholder="留空不过期" style="width:140px"></label>
      <button id="shareBtn" class="primary" type="button">生成分享链接</button>
      <button id="revokeShareBtn" class="danger hidden" type="button">撤销当前链接</button>
    </div>
    <p id="shareBox" class="small"></p>
  </section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/common/user-badge.js"></script>
<script>
const API_BASE=window.AliECSAuth.API_BASE;
const id=new URLSearchParams(location.search).get('id');
let memory=null, photos=[], immichAssets=[], immichStatus={enabled:false}, immichSearchResults=[], shareToken=null, detailMap=null;
let pickerAssets=[], pickerPage=1, pickerNextPage=null, pickerAlbums=[], pickerSelected=new Set(), pickerObjectUrls=[];
const $=(id)=>document.getElementById(id);
const esc=(v)=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;");
const headers=()=>{const tk=window.AliECSAuth.getToken();return tk?{Authorization:`Bearer ${tk}`}:{};
};
async function api(path,options={}){const opts={...options,headers:{...(options.headers||{}),...headers()}};if(opts.body&&!(opts.body instanceof FormData))opts.headers['Content-Type']='application/json';const r=await fetch(`${API_BASE}${path}`,opts);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||`HTTP ${r.status}`);return d;}
function numOrNull(id){const v=$(id).value;return v===''?null:Number(v);}
async function load(){if(!id)throw new Error('missing id');memory=await api(`/v1/memories/${id}`);const [p,ia,status]=await Promise.all([api(`/v1/photos?memory_id=${id}&page=1&page_size=100`),api(`/v1/memories/${id}/immich-assets`).catch(()=>({items:[]})),api('/v1/immich/status').catch(()=>({enabled:false}))]);photos=p.items||[];immichAssets=ia.items||[];immichStatus=status||{enabled:false};render();}
function render(){
  document.title=memory.title;$('title').textContent=memory.title;$('meta').textContent=`${memory.memory_date||'未知日期'} · ${memory.place_name||'未知地点'} · ${memory.photo_count||0} 张照片`;$('content').textContent=memory.content||'';$('tags').innerHTML=(memory.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('')||'<span class="small">无标签</span>';$('archivedBadge').classList.toggle('hidden',!memory.archived);$('archiveBtn').textContent=memory.archived?'取消归档':'归档';
  const cover=$('coverImage'); cover.classList.toggle('hidden',!memory.cover_photo_url); if(memory.cover_photo_url){ if(memory.cover_photo_url.includes('/immich/')){cover.src='data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';cover.dataset.authThumb=memory.cover_photo_url;}else{cover.src=memory.cover_photo_url;delete cover.dataset.authThumb;} }else{delete cover.dataset.authThumb;cover.removeAttribute('src');}
  $('photos').innerHTML=photos.map(p=>`<div class="photo"><a href="${esc(p.display_url||p.thumbnail_url||'#')}" target="_blank" rel="noreferrer"><img src="${esc(p.thumbnail_url||p.display_url||'')}" alt="${esc(p.original_filename||'photo')}" loading="lazy"></a><div class="media-actions"><span class="small">${esc(p.original_filename||'照片')}</span><span><button type="button" data-cover-local="${esc(p.thumbnail_url||p.display_url||'')}">${memory.cover_photo_url===(p.thumbnail_url||p.display_url)?'当前封面':'设为封面'}</button> <button class="danger" type="button" data-photo-del="${p.id}">删除</button></span></div></div>`).join('')||'<div class="muted">暂无照片。</div>';
  if(!immichStatus.enabled){$('immichCard').classList.add('hidden');}else{$('immichCard').classList.remove('hidden');$('immichHint').textContent=immichStatus.ok?'Immich 已连接。':(immichStatus.detail||'Immich 已启用但暂不可用。');}
  $('immichAssets').innerHTML=immichAssets.map(a=>`<div class="photo">${a.thumbnail_url?`<img data-auth-thumb="${esc(a.thumbnail_url)}" alt="${esc(a.original_filename||'Immich')}" loading="lazy">`:''}<div class="media-actions"><span class="small">${esc(a.original_filename||a.immich_asset_id||a.immich_album_id||'Immich')}<br>${esc(a.taken_at||'未记录时间')}</span><span><button type="button" data-cover-immich="${esc(a.thumbnail_url||'')}">${memory.cover_photo_url===a.thumbnail_url?'当前封面':'设为封面'}</button> <button class="danger" type="button" data-immich-del="${a.id}">移除</button></span></div></div>`).join('')||'<div class="muted">暂无 Immich 绑定。</div>';
  renderImmichSearchResults();renderMap();hydrateImmichImages();
}
function renderImmichSearchResults(){
  $('immichSearchResults').innerHTML=immichSearchResults.map(a=>`<div class="photo">${a.thumbnail_url?`<img data-auth-thumb="${esc(a.thumbnail_url)}" alt="${esc(a.original_filename||a.asset_id)}" loading="lazy">`:''}<div style="padding:12px"><strong>${esc(a.original_filename||a.asset_id)}</strong><div class="small">${esc(a.taken_at||'未记录时间')}<br>${esc(a.asset_id)}</div><button type="button" data-immich-bind="${esc(a.asset_id)}" data-immich-name="${esc(a.original_filename||'')}">绑定到这条回忆</button></div></div>`).join('');
  hydrateImmichImages();
}
async function hydrateImmichImages(){const tk=window.AliECSAuth.getToken();if(!tk)return;await Promise.all([...document.querySelectorAll('img[data-auth-thumb]')].map(async(img)=>{try{const r=await fetch(img.dataset.authThumb,{headers:{Authorization:`Bearer ${tk}`}});if(!r.ok)throw new Error();img.src=URL.createObjectURL(await r.blob());}catch{img.alt+='（预览失败）';}}));}
function renderMap(){const located=memory.latitude!=null&&memory.longitude!=null?{latitude:memory.latitude,longitude:memory.longitude,source:'memory'}:immichAssets.find(a=>a.latitude!=null&&a.longitude!=null)?{...immichAssets.find(a=>a.latitude!=null&&a.longitude!=null),source:'immich_asset'}:null;if(!located){$('mapHint').textContent='这条回忆及其照片都没有坐标。';return;}$('mapHint').textContent=located.source==='immich_asset'?'坐标来自已绑定 Immich 照片。':'坐标来自回忆本身。';if(!detailMap){detailMap=L.map('detailMap').setView([located.latitude,located.longitude],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(detailMap);}detailMap.setView([located.latitude,located.longitude],13);if(detailMap._coupleMarker)detailMap.removeLayer(detailMap._coupleMarker);detailMap._coupleMarker=L.marker([located.latitude,located.longitude]).addTo(detailMap).bindPopup(esc(memory.place_name||memory.title));}
function fillEdit(){ $('eTitle').value=memory.title||'';$('eDate').value=memory.memory_date||'';$('ePlace').value=memory.place_name||'';$('eTags').value=(memory.tags||[]).join(',');$('eLat').value=memory.latitude??'';$('eLng').value=memory.longitude??'';$('eVisibility').value=memory.visibility||'private';$('eContent').value=memory.content||'';$('editCard').classList.remove('hidden');$('editBtn').textContent='收起编辑';$('editHint').textContent='';}
function memoryPayload(extra={}){return {title:$('eTitle').value.trim(),memory_date:$('eDate').value||null,place_name:$('ePlace').value.trim()||null,tags:$('eTags').value.split(',').map(x=>x.trim()).filter(Boolean),latitude:numOrNull('eLat'),longitude:numOrNull('eLng'),visibility:$('eVisibility').value,content:$('eContent').value.trim()||null,cover_photo_url:memory.cover_photo_url||null,...extra};}
async function saveMemoryPatch(extra={}){await api(`/v1/memories/${id}`,{method:'PUT',body:JSON.stringify(memoryPayload(extra))});await load();}
async function saveEdit(ev){ev.preventDefault();const lat=numOrNull('eLat'),lng=numOrNull('eLng');if((lat===null)!=(lng===null)){ $('editHint').textContent='纬度和经度需要同时填写。';return; }if(!$('eTitle').value.trim()){$('editHint').textContent='标题不能为空。';return;}$('editHint').textContent='保存中...';$('saveEditBtn').disabled=true;try{await saveMemoryPatch();$('editHint').textContent='已保存。';$('editCard').classList.add('hidden');$('editBtn').textContent='编辑回忆';}catch(err){$('editHint').textContent=err.message;}finally{$('saveEditBtn').disabled=false;}}
async function setCover(url){if(!url)return;$('hint').textContent='正在更新封面...';try{await api(`/v1/memories/${id}`,{method:'PUT',body:JSON.stringify({couple_space_id:memory.couple_space_id,title:memory.title,content:memory.content,memory_date:memory.memory_date,place_name:memory.place_name,latitude:memory.latitude,longitude:memory.longitude,cover_photo_url:url,visibility:memory.visibility,tags:memory.tags||[]})});await load();$('hint').textContent='封面已更新。';}catch(err){$('hint').textContent=err.message;}}
function revokePickerUrls(){pickerObjectUrls.forEach(URL.revokeObjectURL);pickerObjectUrls=[];}
function renderPicker(){revokePickerUrls();const empty='<div class="muted">暂无照片，请调整来源或筛选条件。</div>',placeholder='data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';$('pickerGrid').innerHTML=pickerAssets.map(a=>`<label class="picker-item ${pickerSelected.has(a.asset_id)?'selected':''}"><img src="${placeholder}" data-picker-thumb="${esc(a.thumbnail_url||'')}" alt="${esc(a.original_filename||a.asset_id)}" loading="lazy"><div><input type="checkbox" data-picker-asset="${esc(a.asset_id)}" ${pickerSelected.has(a.asset_id)?'checked':''}>${esc(a.original_filename||a.asset_id)}<br><span class="small">${esc(a.taken_at||'未记录时间')}</span></div></label>`).join('')||empty;document.querySelectorAll('[data-picker-asset]').forEach(el=>el.onchange=()=>{el.checked?pickerSelected.add(el.dataset.pickerAsset):pickerSelected.delete(el.dataset.pickerAsset);el.closest('.picker-item').classList.toggle('selected',el.checked);$('bindPickerBtn').textContent=`绑定已选（${pickerSelected.size}）`;});hydratePickerImages();$('pickerPrevBtn').disabled=pickerPage<=1;$('pickerNextBtn').disabled=!pickerNextPage;$('pickerPageHint').textContent=`第 ${pickerPage} 页`;$('bindPickerBtn').textContent=`绑定已选（${pickerSelected.size}）`;}
async function hydratePickerImages(){const tk=window.AliECSAuth.getToken();if(!tk)return;await Promise.all([...document.querySelectorAll('img[data-picker-thumb]')].map(async img=>{try{const r=await fetch(img.dataset.pickerThumb,{headers:{Authorization:`Bearer ${tk}`}});if(!r.ok)throw new Error();const u=URL.createObjectURL(await r.blob());pickerObjectUrls.push(u);img.src=u;}catch{img.alt+='（预览失败）';}}));}
function pickerAlbumId(album){return String(album?.id||album?.albumId||'').trim();}
function pickerAlbumName(album){return album?.albumName||album?.name||album?.title||`相册 ${pickerAlbumId(album)}`;}
function pickerAlbumCount(album){const n=album?.assetCount??album?.asset_count;return Number.isFinite(Number(n))?Number(n):null;}
function renderPickerAlbumOptions(){const select=$('pickerSource');if(!select)return;const current=select.value||'all',familyId=String(immichStatus.family_album_id||'').trim();const base=[['all','全部照片（默认）'],['personal','个人库（全部）'],['family',familyId?'家庭相册':'家庭相册（未配置）']];const custom=pickerAlbums.map(album=>{const aid=pickerAlbumId(album);if(!aid||aid===familyId)return null;const count=pickerAlbumCount(album);return [`album:${aid}`,`${pickerAlbumName(album)}${count==null?'':`（${count} 张）`}`];}).filter(Boolean);select.innerHTML=[...base,...custom].map(([value,label])=>`<option value="${esc(value)}">${esc(label)}</option>`).join('');if([...select.options].some(option=>option.value===current))select.value=current;else select.value='all';}
async function loadPicker(page=1){if(!immichStatus.ok){$('pickerHint').textContent='Immich 当前不可用，请先连接个人 API key。';return;}$('pickerHint').textContent='加载中...';if(!pickerAlbums.length){const a=await api('/v1/immich/albums');pickerAlbums=a.items||[];const family=a.family_album_id||immichStatus.family_album_id||'';if(family)immichStatus.family_album_id=family;}renderPickerAlbumOptions();const p=new URLSearchParams({page:String(page)});const source=$('pickerSource').value;const selectedAlbumId=source==='family'?(immichStatus.family_album_id||''):source.startsWith('album:')?source.slice(6):'';if(source==='family'&&!selectedAlbumId){$('pickerHint').textContent='尚未配置家庭相册。';return;}if(selectedAlbumId)p.set('album_id',selectedAlbumId);if($('pickerQuery').value.trim())p.set('query',$('pickerQuery').value.trim());if($('pickerAfter').value)p.set('taken_after',$('pickerAfter').value);if($('pickerBefore').value)p.set('taken_before',$('pickerBefore').value);const d=await api(`/v1/immich/assets?${p}`);pickerAssets=d.items||[];pickerPage=d.page||page;pickerNextPage=d.next_page||null;renderPicker();const label=$('pickerSource').selectedOptions[0]?.textContent||'全部照片';$('pickerHint').textContent=`${label}：本页 ${pickerAssets.length} 张`}
async function bindPicker(){const ids=[...pickerSelected];if(!ids.length){$('pickerHint').textContent='请先选择照片。';return;}if(!immichStatus.family_album_id){$('pickerHint').textContent='尚未配置 Couple 家庭相册，暂时无法加入。';return;}$('bindPickerBtn').disabled=true;$('pickerHint').textContent='正在加入家庭相册并绑定...';try{await api('/v1/immich/albums/assets',{method:'POST',body:JSON.stringify({asset_ids:ids})});await api(`/v1/memories/${id}/immich-assets`,{method:'POST',body:JSON.stringify({asset_ids:ids})});pickerSelected.clear();await load();$('mediaPickerDialog').close();}catch(err){$('pickerHint').textContent=err.message;}finally{$('bindPickerBtn').disabled=false;}}
async function uploadPhoto(ev){ev.preventDefault();const f=$('photoInput').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);await api(`/v1/photos/upload?memory_id=${id}`,{method:'POST',body:fd});$('photoInput').value='';await load();}
async function bindImmich(ev){ev.preventDefault();const assetId=$('immichAssetId').value.trim(),filename=$('immichFilename').value.trim();if(!assetId){$('immichHint').textContent='请填写 Immich Asset ID。';return;}$('immichHint').textContent='绑定中...';await api(`/v1/memories/${id}/immich-assets`,{method:'POST',body:JSON.stringify({immich_asset_id:assetId,original_filename:filename||null})});$('immichAssetId').value='';$('immichFilename').value='';$('immichHint').textContent='已绑定。';await load();}
async function searchImmich(ev){ev.preventDefault();$('immichHint').textContent='搜索中...';const p=new URLSearchParams();if($('immichQuery').value.trim())p.set('query',$('immichQuery').value.trim());if($('immichTakenAfter').value)p.set('taken_after',$('immichTakenAfter').value);if($('immichTakenBefore').value)p.set('taken_before',$('immichTakenBefore').value);const d=await api(`/v1/immich/assets?${p.toString()}`);immichSearchResults=d.items||[];$('immichHint').textContent=immichSearchResults.length?`找到 ${immichSearchResults.length} 张。`:'没有找到可绑定照片。';renderImmichSearchResults();}
async function bindImmichAsset(assetId,filename){$('immichHint').textContent='绑定中...';await api(`/v1/memories/${id}/immich-assets`,{method:'POST',body:JSON.stringify({asset_ids:[assetId],original_filename:filename||null})});$('immichHint').textContent='已绑定。';await load();}
async function share(){const days=$('shareDays').value?Number($('shareDays').value):null;const body=days?{expires_in_days:days}:{};const d=await api(`/v1/memories/${id}/share`,{method:'POST',body:JSON.stringify(body)});shareToken=d.token;$('revokeShareBtn').classList.remove('hidden');$('shareBox').innerHTML=`<a href="${esc(d.url)}" target="_blank" rel="noreferrer">${esc(d.url)}</a>${d.expires_at?` · 过期：${esc(d.expires_at)}`:''}`;try{await navigator.clipboard.writeText(d.url);}catch{}}
async function boot(){try{await window.AliECSAuth.renderUserBadge();await load();}catch(e){$('hint').textContent='加载失败：'+e.message;}}
$('editBtn').onclick=()=>{if($('editCard').classList.contains('hidden'))fillEdit();else{$('editCard').classList.add('hidden');$('editBtn').textContent='编辑回忆';}};$('cancelEditBtn').onclick=()=>{$('editCard').classList.add('hidden');$('editBtn').textContent='编辑回忆';$('editHint').textContent='';};$('editForm').onsubmit=(e)=>saveEdit(e);document.querySelectorAll('#editForm input,#editForm textarea,#editForm select').forEach(el=>el.addEventListener('input',()=>$('editHint').textContent='有未保存更改'));$('photoForm').onsubmit=(e)=>uploadPhoto(e).catch(err=>$('hint').textContent=err.message);$('immichForm').onsubmit=(e)=>bindImmich(e).catch(err=>$('immichHint').textContent=err.message);$('immichSearchForm').onsubmit=(e)=>searchImmich(e).catch(err=>$('immichHint').textContent=err.message);$('addPhotoBtn').onclick=()=>{if(!immichStatus.ok){$('hint').textContent='请先连接 Immich 后再选片。';return;}$('mediaPickerDialog').showModal();loadPicker(1).catch(err=>$('pickerHint').textContent=err.message);};$('closePickerBtn').onclick=()=>$('mediaPickerDialog').close();$('pickerSearchForm').onsubmit=(e)=>{e.preventDefault();loadPicker(1).catch(err=>$('pickerHint').textContent=err.message);};$('pickerPrevBtn').onclick=()=>loadPicker(Math.max(1,pickerPage-1)).catch(err=>$('pickerHint').textContent=err.message);$('pickerNextBtn').onclick=()=>loadPicker(pickerNextPage||pickerPage+1).catch(err=>$('pickerHint').textContent=err.message);$('bindPickerBtn').onclick=()=>bindPicker();document.addEventListener('click',async(e)=>{const bid=e.target?.dataset?.immichDel;if(bid&&confirm('移除这个 Immich 绑定？')){await api(`/v1/memories/${id}/immich-assets/${bid}`,{method:'DELETE'});await load();}const pid=e.target?.dataset?.photoDel;if(pid&&confirm('删除这张本地照片？此操作不可恢复。')){await api(`/v1/photos/${pid}`,{method:'DELETE'});await load();}const localCover=e.target?.dataset?.coverLocal;if(localCover)await setCover(localCover);const immichCover=e.target?.dataset?.coverImmich;if(immichCover)await setCover(immichCover);const assetId=e.target?.dataset?.immichBind;if(assetId){await bindImmichAsset(assetId,e.target.dataset.immichName||'');}});$('archiveBtn').onclick=async()=>{await api(`/v1/memories/${id}/${memory.archived?'unarchive':'archive'}`,{method:'POST'});await load();};$('deleteBtn').onclick=async()=>{if(confirm('确认删除这条回忆？')){await api(`/v1/memories/${id}`,{method:'DELETE'});location.href='/memories/';}};$('shareBtn').onclick=()=>share().catch(err=>$('shareBox').textContent=err.message);$('revokeShareBtn').onclick=async()=>{if(shareToken){await api(`/v1/share/${shareToken}`,{method:'DELETE'});$('shareBox').textContent='链接已撤销。';$('revokeShareBtn').classList.add('hidden');}};
boot();
</script>
</body>
