<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Memory Detail</title><style>body{font-family:system-ui;background:#f8f4ec;margin:0}.wrap{max-width:980px;margin:0 auto;padding:20px}.card{background:#fff;border:1px solid #eadfcf;border-radius:16px;padding:16px;margin-bottom:12px}.btn{border:0;background:#e8dfcf;border-radius:999px;padding:8px 12px;text-decoration:none;color:#222}</style></head><body><div class='wrap'><div id='userBadge' style='margin:0 0 8px;color:#7b6d5f;font-size:13px'></div><a class='btn' href='/memories/'>返回回忆列表</a><article class='card'><h1 id='title'>回忆详情</h1><div id='meta'></div><p id='content'></p><div id='tags'></div></article></div><script>const API_BASE=location.port==='8080'?'http://localhost:8000':'/api';const id=(location.pathname.match(/(\d+)\.html$/)||['',1])[1];const mock={id:1,title:'初秋散步',memory_date:'2025-09-12',place_name:'杭州西湖',content:'晚风很轻，我们沿着湖边走了很久。',tags:['散步','西湖']};
async function loadUserBadge(){const tk=localStorage.getItem('portal_token')||localStorage.getItem('aliecs_auth_token')||localStorage.getItem('admin_token')||'';if(!tk)return;try{const r=await fetch(`${API_BASE}/v1/auth/me`,{headers:{Authorization:`Bearer ${tk}`}});if(!r.ok)return;const u=await r.json();const b=document.getElementById('userBadge');if(b)b.textContent=`当前登录：${u.display_name?`${u.display_name}（${u.sub}）`:u.sub}`;}catch{}}
async function load(){const tk=localStorage.getItem('portal_token')||'';try{const h={'Content-Type':'application/json'};if(tk)h.Authorization=`Bearer ${tk}`;const r=await fetch(`${API_BASE}/v1/memories/${id}`,{headers:h});if(!r.ok)throw new Error();render(await r.json());}catch{render(mock);}}function render(x){title.textContent=x.title;meta.textContent=`${x.memory_date||''} · ${x.place_name||''}`;content.textContent=x.content||'';tags.textContent='标签：'+((x.tags||[]).join('，')||'无');}loadUserBadge();load();</script></body></html>
