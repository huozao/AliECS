<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>回忆列表</title>
  <style>
    body{font-family:system-ui;background:#f8f4ec;margin:0}.wrap{max-width:1100px;margin:0 auto;padding:20px}
    .card{background:#fff;border:1px solid #eadfcf;border-radius:16px;padding:14px;margin-bottom:12px}
    .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
    .btn{border:0;background:#e8dfcf;border-radius:999px;padding:8px 12px;text-decoration:none;color:#222;cursor:pointer}
    .muted{color:#7b6d5f}
  </style>
</head>
<body>
<div class="wrap">
  <div class="row"><h1>回忆列表</h1><a class="btn" href="/couple/">返回 Dashboard</a></div>
  <p id="hint" class="muted"></p>
  <div id="list"></div>
  <div class="row"><button id="prev" class="btn">上一页</button><span id="pageInfo"></span><button id="next" class="btn">下一页</button></div>
</div>
<script>
const API_BASE = location.port==='8080'?'http://localhost:8000':'/api';
let page=1,totalPages=1;
async function load(){
  const tk=localStorage.getItem('portal_token')||'';
  const h={'Content-Type':'application/json'}; if(tk) h.Authorization=`Bearer ${tk}`;
  const r=await fetch(`${API_BASE}/v1/memories?page=${page}&page_size=6`,{headers:h});
  if(!r.ok){ throw new Error(`HTTP ${r.status}`); }
  render(await r.json());
}
function render(d){
  totalPages=d.total_pages||1;
  pageInfo.textContent=`第 ${d.page} / ${totalPages} 页，共 ${d.total} 条`;
  list.innerHTML=(d.items||[]).map(x=>`<article class='card'><div class='row'><h3 style='margin:0'>${x.title}</h3><a class='btn' href='/memories/detail.html?id=${x.id}'>详情</a></div><div>${x.memory_date||'未知日期'} · ${x.place_name||'未知地点'}</div><p>${(x.content||'').slice(0,80)}</p></article>`).join('') || '<div class="card">暂无回忆数据</div>';
}
prev.onclick=()=>{ if(page>1){page--; boot();} };
next.onclick=()=>{ if(page<totalPages){page++; boot();} };
async function boot(){
  try{ hint.textContent=''; await load(); }
  catch(e){ hint.textContent='加载失败，请先登录且确认有 Couple 权限。'; list.innerHTML=''; }
}
boot();
</script>
</body>
</html>
