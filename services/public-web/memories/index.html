<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Memories</title><style>body{font-family:system-ui;background:#f8f4ec;margin:0}.wrap{max-width:1100px;margin:0 auto;padding:20px}.card{background:#fff;border:1px solid #eadfcf;border-radius:16px;padding:14px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;background:#e8dfcf;border-radius:999px;padding:8px 12px;text-decoration:none;color:#222}</style></head><body><div class='wrap'><div class='row'><h1>回忆列表</h1><div><a class='btn' href='/couple/'>返回 Dashboard</a></div></div><div id='list'></div><div class='row'><button id='prev' class='btn'>上一页</button><span id='pageInfo'></span><button id='next' class='btn'>下一页</button></div></div><script>const API_BASE=location.port==='8080'?'http://localhost:8000':'/api';let page=1,totalPages=1;const mock={items:[{id:3,title:'跨年夜',memory_date:'2025-12-31',place_name:'上海外滩',content:'人群很吵，但拥抱的时候很安静。'},{id:2,title:'第一次旅行',memory_date:'2025-11-22',place_name:'宁波象山',content:'看日落时你说，想把今天记一辈子。'},{id:1,title:'初秋散步',memory_date:'2025-09-12',place_name:'杭州西湖',content:'晚风很轻，我们沿着湖边走了很久。'}],page:1,total_pages:1,total:3};async function load(){const tk=localStorage.getItem('portal_token')||'';try{const h={'Content-Type':'application/json'};if(tk)h.Authorization=`Bearer ${tk}`;const r=await fetch(`${API_BASE}/v1/memories?page=${page}&page_size=6`,{headers:h});if(!r.ok)throw new Error('fallback');const d=await r.json();render(d);}catch{render(mock);}}function render(d){totalPages=d.total_pages||1;document.getElementById('pageInfo').textContent=`第 ${page} / ${totalPages} 页`;document.getElementById('list').innerHTML=(d.items||[]).map(x=>`<article class='card'><div class='row'><h3 style='margin:0'>${x.title}</h3><a class='btn' href='/memories/${x.id}.html'>详情</a></div><div>${x.memory_date||'未知日期'} · ${x.place_name||'未知地点'}</div><p>${(x.content||'').slice(0,70)}</p></article>`).join('');}document.getElementById('prev').onclick=()=>{if(page>1){page--;load();}};document.getElementById('next').onclick=()=>{if(page<totalPages){page++;load();}};load();</script></body></html>
