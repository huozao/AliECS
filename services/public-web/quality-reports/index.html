<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>AliECS · 质检报告</title>
  <style>
    :root{--bg:#f6f7f5;--panel:#fff;--text:#20251f;--muted:#758075;--line:#e3e8e1;--primary:#16794d;--primary-soft:#e7f5ed;--bad:#a8423b;--warn:#97631e;--shadow:0 10px 28px rgba(39,59,44,.07)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#edf5ef 0,#f7f7f4 34%,#f6f7f5 100%);color:var(--text);font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.hidden{display:none!important}
    .wrap{max-width:1120px;margin:0 auto;padding:18px 16px 64px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.title h1{margin:0;font-size:28px}.title p{margin:5px 0 0;color:var(--muted);font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .btn,button{border:0;border-radius:12px;min-height:42px;padding:9px 14px;background:#e9eee9;color:var(--text);font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary,button.primary{background:var(--primary);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line)}button:disabled{opacity:.55;cursor:wait}
    .panel{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}.search-grid{display:grid;grid-template-columns:minmax(220px,2fr) repeat(3,minmax(130px,1fr));gap:10px}.field{display:grid;gap:6px}.field label{font-size:13px;color:var(--muted);font-weight:700}
    input,select,textarea{width:100%;min-height:46px;height:auto;border:1px solid #dce4dc;border-radius:12px;padding:11px 13px;line-height:1.45;background:#fbfcfb;color:var(--text);font:inherit;box-sizing:border-box;outline:none}input:focus,select:focus,textarea:focus{border-color:#5ca37d;box-shadow:0 0 0 3px rgba(22,121,77,.1)}textarea{min-height:84px;resize:vertical}.search-actions{display:flex;align-items:end;gap:8px}.hint,.muted{color:var(--muted)}.hint{font-size:13px;margin:10px 2px 0}.message{display:none;border-radius:12px;padding:11px 13px;margin-bottom:14px}.message.show{display:block}.message.good{background:var(--primary-soft);color:#12653f}.message.bad{background:#fae6e3;color:var(--bad)}
    .summary{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 2px 10px}.results{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 6px 18px rgba(45,62,48,.045);display:grid;grid-template-columns:1fr auto;gap:12px}.card h3{margin:0;font-size:17px}.meta{display:flex;flex-wrap:wrap;gap:7px 14px;margin-top:9px;color:#586258;font-size:13px}.tag{display:inline-flex;padding:4px 8px;border-radius:999px;background:#edf2ed;font-size:12px;font-weight:750}.tag.published{background:var(--primary-soft);color:#12653f}.tag.revoked{background:#fae6e3;color:var(--bad)}.tag.superseded{background:#f5eddf;color:var(--warn)}.empty{text-align:center;padding:46px 14px;color:var(--muted)}
    .manager-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.manager-head h2{margin:0;font-size:19px}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.span-2{grid-column:span 2}.span-3{grid-column:1/-1}.form-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.draft-box{margin-top:14px;padding:13px;border-radius:14px;background:#f6faf7;border:1px solid #dce9df}
    .modal{position:fixed;inset:0;background:rgba(20,30,22,.32);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal.show{display:flex}.modal-panel{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:18px;box-shadow:0 18px 52px rgba(20,30,22,.22)}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.modal-head h2{margin:0;font-size:21px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}.detail-item{background:#f7f9f7;border-radius:10px;padding:10px}.detail-item small{display:block;color:var(--muted);margin-bottom:4px}.file-row,.history-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
    @media(max-width:820px){.topbar{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}.search-grid,.form-grid{grid-template-columns:1fr 1fr}.search-main,.span-2,.span-3{grid-column:1/-1}.card{grid-template-columns:1fr}.card .btn{justify-self:start}}
    @media(max-width:520px){.wrap{padding:14px 12px 48px}.search-grid,.form-grid,.detail-grid{grid-template-columns:1fr}.search-main,.span-2,.span-3{grid-column:auto}.panel{padding:14px}.title h1{font-size:24px}.actions{width:100%}.actions .btn,.actions button{flex:1}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="title"><h1>质检报告</h1><p>按产品编码、名称、批次号或报告编号查询。</p></div>
      <nav class="actions"><a class="btn ghost" href="/">返回首页</a><button id="loginBtn" class="primary" type="button">登录（SSO）</button><button id="logoutBtn" class="hidden" type="button">退出登录</button></nav>
    </header>
    <div id="message" class="message"></div>
    <section class="panel">
      <form id="searchForm" class="search-grid">
        <div class="field search-main"><label for="query">通用搜索</label><input id="query" name="q" placeholder="产品编码 / 产品名称 / 批次号 / 报告编号" autocomplete="off"/></div>
        <div class="field"><label for="reportType">报告类型</label><input id="reportType" name="report_type" placeholder="例如：出厂检验"/></div>
        <div class="field"><label for="dateFrom">检验日期起</label><input id="dateFrom" name="date_from" type="date"/></div>
        <div class="search-actions"><button id="searchBtn" class="primary" type="submit">查询报告</button><button id="resetBtn" type="button">清空</button></div>
      </form>
      <p class="hint">默认只展示最新有效的已发布报告；历史修订版本可在报告详情中查看。</p>
    </section>
    <div class="summary"><strong id="summaryText">请登录后查询</strong><span id="userText" class="muted"></span></div>
    <main id="results" class="results"><div class="panel empty">登录后即可查询质检报告。</div></main>

    <section id="managerPanel" class="panel hidden">
      <div class="manager-head"><div><h2>报告维护</h2><div class="hint">先建立草稿，再上传文件；发布后不可覆盖。</div></div><button id="toggleManagerBtn" type="button">收起</button></div>
      <form id="createForm" class="form-grid">
        <div class="field"><label>报告编号 *</label><input name="report_no" required maxlength="120"/></div>
        <div class="field"><label>产品编码 *</label><input name="product_code" required maxlength="120"/></div>
        <div class="field"><label>产品名称 *</label><input name="product_name" required maxlength="240"/></div>
        <div class="field"><label>批次号</label><input name="batch_no" maxlength="120"/></div>
        <div class="field"><label>报告类型 *</label><input name="report_type" required maxlength="120" value="出厂检验"/></div>
        <div class="field"><label>检验日期</label><input name="inspection_date" type="date"/></div>
        <div class="field"><label>签发日期</label><input name="issued_at" type="date"/></div>
        <div class="field"><label>修订版本</label><input name="revision" type="number" min="1" max="999" value="1"/></div>
        <div class="field"><label>关联配方快照（选填）</label><input name="recipe_snapshot_id" maxlength="200"/></div>
        <div class="form-actions span-3"><button id="createBtn" class="primary" type="submit">创建草稿</button></div>
      </form>
      <div id="draftBox" class="draft-box hidden">
        <strong id="draftTitle"></strong>
        <div class="form-actions" style="margin-top:10px"><input id="reportFile" type="file" accept="application/pdf,.pdf,.xlsx,.docx" style="max-width:430px"/><button id="uploadBtn" type="button">上传文件</button><button id="publishBtn" class="primary hidden" type="button">发布报告</button></div>
        <div id="draftStatus" class="hint"></div>
      </div>
    </section>
  </div>

  <div id="detailModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-panel"><div class="modal-head"><div><h2 id="detailTitle">报告详情</h2><div id="detailSubtitle" class="muted"></div></div><button id="closeModalBtn" type="button">关闭</button></div><div id="detailBody"></div></div>
  </div>

  <script>
    const API_BASE=location.port==='8080'?'http://localhost:8000':'/api';
    const AUTH_KEYS=['aliecs_auth_token','portal_token','admin_token'];
    const $=(id)=>document.getElementById(id);const token=()=>AUTH_KEYS.map(k=>localStorage.getItem(k)||'').find(Boolean)||'';const clearToken=()=>AUTH_KEYS.forEach(k=>localStorage.removeItem(k));
    const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmtBytes=(n)=>{n=Number(n||0);if(n>=1048576)return `${(n/1048576).toFixed(1)} MB`;if(n>=1024)return `${(n/1024).toFixed(0)} KB`;return `${n} B`};
    const statusLabel={draft:'草稿',published:'有效',superseded:'已替换',revoked:'已作废'};
    let me=null,currentDraft=null;
    function showMessage(text,type='bad'){const node=$('message');node.textContent=text;node.className=`message show ${type}`;if(type==='good')setTimeout(()=>node.classList.remove('show'),5000)}
    function headers(json=true){const h={};if(json)h['Content-Type']='application/json';if(token())h.Authorization=`Bearer ${token()}`;h['X-Client-Channel']='website';return h}
    async function api(path,opt={}){const response=await fetch(`${API_BASE}${path}`,{...opt,headers:Object.assign(headers(opt.json!==false),opt.headers||{})});const text=await response.text();let data={};if(text){try{data=JSON.parse(text)}catch{data={raw:text}}}if(!response.ok){if(response.status===401){clearToken();applyAuth(null)}throw new Error(data.detail||`HTTP ${response.status}`)}return data}
    const can=(permission)=>!!me&&(((me.roles||[]).includes('admin'))||((me.permissions||[]).includes('admin.access'))||((me.permissions||[]).includes(permission)));
    function applyAuth(user){me=user;const logged=!!user;$('loginBtn').classList.toggle('hidden',logged);$('logoutBtn').classList.toggle('hidden',!logged);$('userText').textContent=logged?(user.display_name||user.sub||'已登录'):'';$('managerPanel').classList.toggle('hidden',!can('quality_report.manage'));$('publishBtn').classList.toggle('hidden',!can('quality_report.admin'));if(!logged){$('summaryText').textContent='请登录后查询';$('results').innerHTML='<div class="panel empty">登录后即可查询质检报告。</div>'}}
    async function initAuth(){if(!token()){applyAuth(null);return}try{applyAuth(await api('/v1/auth/me'))}catch{applyAuth(null)}}
    function reportCard(item){return `<article class="card"><div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h3>${esc(item.product_code)} · ${esc(item.product_name)}</h3><span class="tag ${item.status}">${statusLabel[item.status]||esc(item.status)}</span></div><div class="meta"><span>报告：${esc(item.report_no)}</span><span>类型：${esc(item.report_type)}</span><span>批次：${esc(item.batch_no||'通用报告')}</span><span>检验：${esc(item.inspection_date||'-')}</span><span>修订：v${item.revision}</span></div></div><button class="btn primary" type="button" onclick="openDetail(${item.id})">查看详情</button></article>`}
    async function searchReports(){if(!token()){showMessage('请先登录 SSO。');return}$('searchBtn').disabled=true;try{const params=new URLSearchParams(new FormData($('searchForm')));for(const [key,value] of [...params.entries()])if(!value)params.delete(key);const data=await api(`/v1/quality-reports?${params}`);$('summaryText').textContent=`查询到 ${data.total} 份报告`;$('results').innerHTML=data.items.length?data.items.map(reportCard).join(''):'<div class="panel empty">没有找到符合条件的已发布报告。</div>'}catch(e){showMessage(`查询失败：${e.message}`)}finally{$('searchBtn').disabled=false}}
    async function openDetail(id){try{const item=await api(`/v1/quality-reports/${id}`);$('detailTitle').textContent=`${item.product_code} · ${item.product_name}`;$('detailSubtitle').textContent=`${item.report_no} · v${item.revision} · ${statusLabel[item.status]||item.status}`;const files=(item.files||[]).map(file=>`<div class="file-row"><div><strong>${esc(file.filename)}</strong><div class="muted">${fmtBytes(file.size_bytes)} · ${esc(file.mime_type)} · SHA-256 ${esc(file.sha256.slice(0,12))}…</div></div><button class="primary" onclick="downloadFile(${file.id},'${esc(file.filename)}')">${file.mime_type==='application/pdf'?'预览 / 下载':'下载源文件'}</button></div>`).join('')||'<div class="muted">暂无可用文件</div>';const history=(item.history||[]).map(row=>`<div class="history-row"><span>v${row.revision} · ${statusLabel[row.status]||row.status}</span><span class="muted">${esc(row.inspection_date||'-')}</span></div>`).join('');$('detailBody').innerHTML=`<div class="detail-grid"><div class="detail-item"><small>产品编码</small>${esc(item.product_code)}</div><div class="detail-item"><small>批次号</small>${esc(item.batch_no||'通用报告')}</div><div class="detail-item"><small>报告类型</small>${esc(item.report_type)}</div><div class="detail-item"><small>检验日期</small>${esc(item.inspection_date||'-')}</div></div><h3>报告文件</h3>${files}<h3>历史版本</h3>${history}`;$('detailModal').classList.add('show')}catch(e){showMessage(`详情加载失败：${e.message}`)}}
    async function downloadFile(id,name){try{const response=await fetch(`${API_BASE}/v1/quality-reports/files/${id}/download`,{headers:headers(false)});if(!response.ok){let detail=`HTTP ${response.status}`;try{detail=(await response.json()).detail||detail}catch{}throw new Error(detail)}const blob=await response.blob();const url=URL.createObjectURL(blob);if(blob.type==='application/pdf'){window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000)}else{const a=document.createElement('a');a.href=url;a.download=name||'quality-report';a.click();URL.revokeObjectURL(url)}}catch(e){showMessage(`文件读取失败：${e.message}`)}}
    async function createDraft(event){event.preventDefault();const body=Object.fromEntries(new FormData(event.target));for(const key of Object.keys(body))if(body[key]==='')body[key]=null;body.revision=Number(body.revision||1);$('createBtn').disabled=true;try{currentDraft=await api('/v1/quality-reports',{method:'POST',body:JSON.stringify(body)});$('draftBox').classList.remove('hidden');$('draftTitle').textContent=`草稿 #${currentDraft.id} · ${currentDraft.report_no} · v${currentDraft.revision}`;$('draftStatus').textContent='请选择 PDF、XLSX 或 DOCX 文件上传。';showMessage('报告草稿已创建。','good')}catch(e){showMessage(`创建失败：${e.message}`)}finally{$('createBtn').disabled=false}}
    async function uploadFile(){const file=$('reportFile').files[0];if(!currentDraft||!file){showMessage('请先创建草稿并选择文件。');return}$('uploadBtn').disabled=true;try{const form=new FormData();form.append('file',file);const data=await api(`/v1/quality-reports/${currentDraft.id}/files`,{method:'POST',body:form,json:false});$('draftStatus').textContent=`已上传 ${data.filename}（${fmtBytes(data.size_bytes)}），SHA-256：${data.sha256}`;showMessage('文件已写入质检报告存储。','good')}catch(e){showMessage(`上传失败：${e.message}`)}finally{$('uploadBtn').disabled=false}}
    async function publishDraft(){if(!currentDraft)return;if(!confirm('发布后文件不可覆盖；确认发布此修订版本？'))return;$('publishBtn').disabled=true;try{currentDraft=await api(`/v1/quality-reports/${currentDraft.id}/publish`,{method:'POST'});$('draftStatus').textContent='报告已发布。';showMessage('质检报告已发布，所有登录人员可查询和下载。','good');searchReports()}catch(e){showMessage(`发布失败：${e.message}`)}finally{$('publishBtn').disabled=false}}
    $('searchForm').onsubmit=(e)=>{e.preventDefault();searchReports()};$('resetBtn').onclick=()=>{$('searchForm').reset();searchReports()};$('createForm').onsubmit=createDraft;$('uploadBtn').onclick=uploadFile;$('publishBtn').onclick=publishDraft;$('closeModalBtn').onclick=()=>$('detailModal').classList.remove('show');$('detailModal').onclick=(e)=>{if(e.target===$('detailModal'))$('detailModal').classList.remove('show')};$('loginBtn').onclick=()=>location.href=`${API_BASE}/v1/auth/oidc/login?rd=${encodeURIComponent(location.pathname)}`;$('logoutBtn').onclick=()=>{clearToken();applyAuth(null)};$('toggleManagerBtn').onclick=()=>{$('createForm').classList.toggle('hidden');$('draftBox').classList.toggle('hidden',!currentDraft)};
    (async()=>{await initAuth();if(me)await searchReports()})();
  </script>
</body>
</html>
