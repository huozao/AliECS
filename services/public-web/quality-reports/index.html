<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>AliECS · 质检报告</title>
  <style>
    :root{--bg:#f6f7f5;--panel:#fff;--text:#20251f;--muted:#758075;--line:#e3e8e1;--primary:#16794d;--primary-soft:#e7f5ed;--bad:#a8423b;--warn:#97631e;--shadow:0 10px 28px rgba(39,59,44,.07)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#edf5ef 0,#f7f7f4 34%,#f6f7f5 100%);color:var(--text);font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.hidden{display:none!important}
    .wrap{max-width:1120px;margin:0 auto;padding:18px 16px 64px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.title h1{margin:0;font-size:28px}.title p{margin:5px 0 0;color:var(--muted);font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .btn,button{border:0;border-radius:12px;min-height:42px;padding:9px 14px;background:#e9eee9;color:var(--text);font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary,button.primary{background:var(--primary);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line)}button:disabled{opacity:.55;cursor:wait}
    .panel{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}.search-grid{display:grid;grid-template-columns:minmax(220px,2fr) repeat(3,minmax(130px,1fr));gap:10px}.field{display:grid;gap:6px}.field label{font-size:13px;color:var(--muted);font-weight:700}
    input,select,textarea{width:100%;min-height:46px;height:auto;border:1px solid #dce4dc;border-radius:12px;padding:11px 13px;line-height:1.45;background:#fbfcfb;color:var(--text);font:inherit;box-sizing:border-box;outline:none}input:focus,select:focus,textarea:focus{border-color:#5ca37d;box-shadow:0 0 0 3px rgba(22,121,77,.1)}textarea{min-height:84px;resize:vertical}.search-actions{display:flex;align-items:end;gap:8px}.hint,.muted{color:var(--muted)}.hint{font-size:13px;margin:10px 2px 0}.message{display:none;border-radius:12px;padding:11px 13px;margin-bottom:14px}.message.show{display:block}.message.good{background:var(--primary-soft);color:#12653f}.message.bad{background:#fae6e3;color:var(--bad)}
    .summary{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 2px 10px}.results{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 6px 18px rgba(45,62,48,.045);display:grid;grid-template-columns:1fr auto;gap:12px}.card h3{margin:0;font-size:17px}.meta{display:flex;flex-wrap:wrap;gap:7px 14px;margin-top:9px;color:#586258;font-size:13px}.tag{display:inline-flex;padding:4px 8px;border-radius:999px;background:#edf2ed;font-size:12px;font-weight:750}.tag.published{background:var(--primary-soft);color:#12653f}.tag.revoked{background:#fae6e3;color:var(--bad)}.tag.superseded{background:#f5eddf;color:var(--warn)}.empty{text-align:center;padding:46px 14px;color:var(--muted)}
    .manager-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.manager-head h2{margin:0;font-size:19px}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.span-2{grid-column:span 2}.span-3{grid-column:1/-1}.form-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.draft-box{margin-top:14px;padding:13px;border-radius:14px;background:#f6faf7;border:1px solid #dce9df}.draft-status{margin-top:10px;padding:10px;border-radius:10px;background:#fff}.draft-status.bad{background:#fae6e3;color:var(--bad)}.draft-status.good{background:var(--primary-soft);color:#12653f}
    .step-title{grid-column:1/-1;margin-top:4px;padding-top:12px;border-top:1px solid var(--line);font-weight:800}.step-title:first-child{border-top:0;padding-top:0}.subject-search{display:flex;gap:8px}.subject-search input{flex:1}.subject-results{grid-column:1/-1;display:grid;gap:7px;max-height:260px;overflow:auto}.subject-option{width:100%;justify-content:flex-start;text-align:left;background:#f7f9f7;border:1px solid var(--line);font-weight:500}.subject-option.selected{border-color:var(--primary);background:var(--primary-soft)}.selected-subject{grid-column:1/-1;padding:11px 13px;border-radius:12px;background:var(--primary-soft);color:#12653f}.chips{display:flex;flex-wrap:wrap;gap:7px;padding:9px;border:1px solid var(--line);border-radius:12px;background:#fbfcfb}.chip{min-height:34px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;font-weight:600}.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}.draft-list{display:grid;gap:7px;margin-top:10px}.draft-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px;border:1px solid var(--line);border-radius:11px;background:#fff}
    .modal{position:fixed;inset:0;background:rgba(20,30,22,.32);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal.show{display:flex}.modal-panel{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:18px;box-shadow:0 18px 52px rgba(20,30,22,.22)}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.modal-head h2{margin:0;font-size:21px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}.detail-item{background:#f7f9f7;border-radius:10px;padding:10px}.detail-item small{display:block;color:var(--muted);margin-bottom:4px}.file-row,.history-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
    @media(max-width:820px){.topbar{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}.search-grid,.form-grid{grid-template-columns:1fr 1fr}.search-main,.span-2,.span-3{grid-column:1/-1}.card{grid-template-columns:1fr}.card .btn{justify-self:start}}
    @media(max-width:520px){.wrap{padding:14px 12px 90px}.search-grid,.form-grid,.detail-grid{grid-template-columns:1fr}.search-main,.span-2,.span-3,.step-title,.subject-results,.selected-subject{grid-column:auto}.panel{padding:14px}.title h1{font-size:24px}.actions{width:100%}.actions .btn,.actions button{flex:1}.message.show{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:80;margin:0;box-shadow:0 10px 30px rgba(20,30,22,.24)}.subject-search{flex-direction:column}.draft-row{align-items:flex-start;flex-direction:column}.draft-row button{width:100%}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="title"><h1>质检报告</h1><p>按产品编码、名称、批次号或报告编号查询。</p></div>
      <nav class="actions"><a class="btn ghost" href="/">返回首页</a><button id="loginBtn" class="primary" type="button">登录（SSO）</button><button id="logoutBtn" class="hidden" type="button">退出登录</button></nav>
    </header>
    <section class="panel">
      <form id="searchForm" class="search-grid">
        <div class="field search-main"><label for="query">通用搜索</label><input id="query" name="q" placeholder="产品编码 / 产品名称 / 批次号 / 报告编号" autocomplete="off"/></div>
        <div class="field"><label for="reportType">报告类型</label><input id="reportType" name="report_type" placeholder="例如：出厂检验"/></div>
        <div class="field"><label for="dateFrom">检验日期起</label><input id="dateFrom" name="date_from" type="date"/></div>
        <div class="search-actions"><button id="searchBtn" class="primary" type="submit">查询报告</button><button id="resetBtn" type="button">清空</button></div>
      </form>
      <p class="hint">默认只展示最新有效的已发布报告；历史修订版本可在报告详情中查看。</p>
    </section>
    <div class="summary"><strong id="summaryText">请登录后查询</strong><span id="userText" class="muted"></span></div>
    <main id="results" class="results"><div class="panel empty">登录后即可查询质检报告。</div></main>

    <section id="managerPanel" class="panel hidden">
      <div class="manager-head"><div><h2>报告维护</h2><div class="hint">先建立草稿，再上传文件；发布后不可覆盖。</div></div><button id="toggleManagerBtn" type="button">收起</button></div>
      <form id="createForm" class="form-grid">
        <div class="step-title">1. 选择关联对象</div>
        <div class="field"><label>对象范围</label><select id="subjectType" name="subject_type"><option value="raw_material">原材料</option><option value="finished_product">成品</option><option value="custom_product">自定义产品</option></select></div>
        <div class="field span-2"><label>搜索现有系统物料</label><div class="subject-search"><input id="subjectQuery" placeholder="输入编码、名称或规格后查询" autocomplete="off"/><button id="subjectSearchBtn" type="button">查询物料</button></div></div>
        <div id="selectedSubject" class="selected-subject hidden"></div>
        <div id="subjectResults" class="subject-results"></div>
        <div class="form-actions span-3"><button id="toggleCustomBtn" type="button">新增自定义产品</button></div>
        <div id="customSubjectBox" class="form-grid span-3 hidden" style="margin-top:0">
          <div class="field"><label>自定义编码（留空自动生成）</label><input id="customCode" maxlength="120"/></div>
          <div class="field"><label>自定义名称 *</label><input id="customName" maxlength="240"/></div>
          <div class="field"><label>规格型号</label><input id="customSpecification" maxlength="240"/></div>
          <div class="form-actions span-3"><button id="createSubjectBtn" type="button">保存并选中</button></div>
        </div>

        <div class="step-title">2. 报告分类与编号</div>
        <div class="field"><label>系统编号</label><input value="创建草稿时自动生成（如 20260715001）" disabled/></div>
        <div class="field"><label>外部／原始报告编号（选填）</label><input name="external_report_no" maxlength="120" placeholder="第三方报告号按原文填写"/></div>
        <div class="field"><label>检测来源 *</label><select id="reportSource" name="report_source_code" required></select></div>
        <div class="field"><label>文档类型 *</label><select id="documentType" name="document_type_code" required></select></div>
        <div class="field"><label>原材料大类</label><select id="materialCategory" name="material_category_code"><option value="">不分类</option></select></div>
        <div class="field"><label>具体材料类别</label><select id="materialSubcategory" name="material_subcategory_code"><option value="">请先选大类</option></select></div>
        <div class="field span-3"><label>检测项目（可多选）</label><div id="testItems" class="chips"></div></div>

        <div class="step-title">3. 批次与日期</div>
        <div class="field"><label>批次号</label><input name="batch_no" maxlength="120"/></div>
        <div class="field"><label>检验日期</label><input name="inspection_date" type="date"/></div>
        <div class="field"><label>签发日期</label><input name="issued_at" type="date"/></div>
        <div class="field"><label>修订版本</label><input name="revision" type="number" min="1" max="999" value="1"/></div>
        <div class="field"><label>关联配方快照（选填）</label><input name="recipe_snapshot_id" maxlength="200"/></div>
        <div class="form-actions span-3"><button id="createBtn" class="primary" type="submit">创建草稿</button></div>
      </form>
      <div id="draftBox" class="draft-box hidden">
        <strong id="draftTitle"></strong>
        <div class="form-actions" style="margin-top:10px"><input id="reportFile" type="file" accept="application/pdf,.pdf,.xlsx,.docx" style="max-width:430px"/><button id="uploadBtn" type="button">重新上传</button><button id="publishBtn" class="primary hidden" type="button" disabled>发布报告</button></div>
        <div id="draftStatus" class="draft-status">选择文件后会自动上传；只有服务器确认收到有效文件后才能发布。</div>
      </div>
      <div id="draftsBox" class="draft-box"><strong>未发布草稿</strong><div id="draftList" class="draft-list"><span class="hint">正在读取…</span></div></div>
    </section>
  </div>

  <div id="detailModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-panel"><div class="modal-head"><div><h2 id="detailTitle">报告详情</h2><div id="detailSubtitle" class="muted"></div></div><button id="closeModalBtn" type="button">关闭</button></div><div id="detailBody"></div></div>
  </div>

  <script src="/common/toast.js"></script>
  <script>
    const API_BASE=location.port==='8080'?'http://localhost:8000':'/api';
    const AUTH_KEYS=['aliecs_auth_token','portal_token','admin_token'];
    const $=(id)=>document.getElementById(id);const token=()=>AUTH_KEYS.map(k=>localStorage.getItem(k)||'').find(Boolean)||'';const clearToken=()=>AUTH_KEYS.forEach(k=>localStorage.removeItem(k));
    const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmtBytes=(n)=>{n=Number(n||0);if(n>=1048576)return `${(n/1048576).toFixed(1)} MB`;if(n>=1024)return `${(n/1024).toFixed(0)} KB`;return `${n} B`};
    const statusLabel={draft:'草稿',published:'有效',superseded:'已替换',revoked:'已作废'};
    let me=null,currentDraft=null,selectedSubject=null,catalogs={},selectedTestItems=new Set();
    function showMessage(text,type='bad'){AliECSToast.show(text,type==='good'?'success':'error')}
    function headers(json=true){const h={};if(json)h['Content-Type']='application/json';if(token())h.Authorization=`Bearer ${token()}`;h['X-Client-Channel']='website';return h}
    async function api(path,opt={}){const response=await fetch(`${API_BASE}${path}`,{...opt,headers:Object.assign(headers(opt.json!==false),opt.headers||{})});const text=await response.text();let data={};if(text){try{data=JSON.parse(text)}catch{data={raw:text}}}if(!response.ok){if(response.status===401){clearToken();applyAuth(null)}throw new Error(data.detail||`HTTP ${response.status}`)}return data}
    const can=(permission)=>!!me&&(((me.roles||[]).includes('admin'))||((me.permissions||[]).includes('admin.access'))||((me.permissions||[]).includes(permission)));
    function applyAuth(user){me=user;const logged=!!user;$('loginBtn').classList.toggle('hidden',logged);$('logoutBtn').classList.toggle('hidden',!logged);$('userText').textContent=logged?(user.display_name||user.sub||'已登录'):'';$('managerPanel').classList.toggle('hidden',!can('quality_report.manage'));$('publishBtn').classList.toggle('hidden',!can('quality_report.admin'));if(!logged){$('summaryText').textContent='请登录后查询';$('results').innerHTML='<div class="panel empty">登录后即可查询质检报告。</div>'}}
    async function initAuth(){if(!token()){applyAuth(null);return}try{applyAuth(await api('/v1/auth/me'))}catch{applyAuth(null)}}
    function reportCard(item){return `<article class="card"><div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h3>${esc(item.product_code)} · ${esc(item.product_name)}</h3><span class="tag ${item.status}">${statusLabel[item.status]||esc(item.status)}</span></div><div class="meta"><span>系统编号：${esc(item.system_code||item.report_no)}</span>${item.external_report_no?`<span>原始报告号：${esc(item.external_report_no)}</span>`:''}<span>类型：${esc(item.report_type)}</span><span>批次：${esc(item.batch_no||'通用报告')}</span><span>检验：${esc(item.inspection_date||'-')}</span><span>修订：v${item.revision}</span></div></div><button class="btn primary" type="button" onclick="openDetail(${item.id})">查看详情</button></article>`}
    const options=(items,blank='请选择')=>`<option value="">${blank}</option>`+(items||[]).map(item=>`<option value="${esc(item.code)}">${esc(item.name)}</option>`).join('');
    async function loadCatalog(){const data=await api('/v1/quality-reports/catalog');catalogs=data.catalogs||{};$('reportSource').innerHTML=options(catalogs.report_source);$('documentType').innerHTML=options(catalogs.document_type);$('materialCategory').innerHTML=options(catalogs.material_category,'不分类');$('testItems').innerHTML=(catalogs.test_item||[]).map(item=>`<button class="chip" type="button" data-code="${esc(item.code)}">${esc(item.name)}</button>`).join('');$('testItems').querySelectorAll('.chip').forEach(node=>node.onclick=()=>{const code=node.dataset.code;if(selectedTestItems.has(code)){selectedTestItems.delete(code);node.classList.remove('active')}else{selectedTestItems.add(code);node.classList.add('active')}})}
    function updateMaterialSubcategories(){const parent=$('materialCategory').value;$('materialSubcategory').innerHTML=options((catalogs.material_subcategory||[]).filter(item=>item.parent_code===parent),parent?'请选择具体类别':'请先选大类')}
    function selectSubject(item){selectedSubject=item;$('selectedSubject').classList.remove('hidden');$('selectedSubject').innerHTML=`已选择：<strong>${esc(item.code)} · ${esc(item.name)}</strong>${item.specification?`　${esc(item.specification)}`:''}<br><small>${item.source==='tplus'?'T+ 存货档案':'自定义档案'} · ${esc(item.inventory_class_name||'未分类')}</small>`;$('subjectType').value=item.suggested_subject_type||$('subjectType').value;if(item.material_category_code){$('materialCategory').value=item.material_category_code;updateMaterialSubcategories();$('materialSubcategory').value=item.material_subcategory_code||''}$('subjectResults').innerHTML=''}
    async function searchSubjects(){const q=$('subjectQuery').value.trim();if(!q){showMessage('请输入物料编码、名称或规格。');return}$('subjectSearchBtn').disabled=true;try{const expected=$('subjectType').value;const source=expected==='custom_product'?'custom':'all';const data=await api(`/v1/quality-reports/subjects?q=${encodeURIComponent(q)}&source=${source}`);const items=(data.items||[]).filter(item=>expected==='custom_product'?item.source==='custom':item.suggested_subject_type===expected);$('subjectResults').innerHTML=items.length?items.map((item,index)=>`<button class="subject-option" type="button" data-index="${index}"><strong>${esc(item.code)} · ${esc(item.name)}</strong><br><span class="muted">${esc(item.specification||item.inventory_class_name||'')}</span></button>`).join(''):'<div class="hint">没有匹配项。可切换对象范围，或新增自定义产品。</div>';$('subjectResults').querySelectorAll('button').forEach(node=>node.onclick=()=>selectSubject(items[Number(node.dataset.index)]))}catch(e){showMessage(`物料查询失败：${e.message}`)}finally{$('subjectSearchBtn').disabled=false}}
    async function createCustomSubject(){const name=$('customName').value.trim();if(!name){showMessage('请填写自定义产品名称。');return}const body={subject_type:$('subjectType').value,code:$('customCode').value.trim()||null,name,specification:$('customSpecification').value.trim()||null,material_category_code:$('materialCategory').value||null,material_subcategory_code:$('materialSubcategory').value||null};$('createSubjectBtn').disabled=true;try{const item=await api('/v1/quality-reports/subjects',{method:'POST',body:JSON.stringify(body)});selectSubject(item);$('customSubjectBox').classList.add('hidden');showMessage('自定义产品已保存并选中。','good')}catch(e){showMessage(`保存自定义产品失败：${e.message}`)}finally{$('createSubjectBtn').disabled=false}}
    async function loadDrafts(){if(!can('quality_report.manage'))return;try{const data=await api('/v1/quality-reports/manage/drafts');$('draftList').innerHTML=(data.items||[]).length?data.items.map(item=>`<div class="draft-row"><span><strong>${esc(item.system_code||item.report_no)} · ${esc(item.product_name)}</strong><br><small class="muted">${item.file_count} 个有效文件 · ${esc(item.created_at||'')}</small></span><button type="button" onclick="resumeDraft(${item.id})">继续处理</button></div>`).join(''):'<span class="hint">没有未发布草稿。</span>'}catch(e){$('draftList').innerHTML=`<span class="hint">草稿读取失败：${esc(e.message)}</span>`}}
    async function resumeDraft(id){try{currentDraft=await api(`/v1/quality-reports/${id}`);showDraft(currentDraft,(currentDraft.files||[]).length);$('draftBox').scrollIntoView({behavior:'smooth',block:'center'})}catch(e){showMessage(`草稿读取失败：${e.message}`)}}
    function showDraft(item,fileCount=0){$('draftBox').classList.remove('hidden');$('draftTitle').textContent=`草稿 #${item.id} · ${item.system_code||item.report_no} · v${item.revision}`;const hasFile=fileCount>0;$('draftStatus').textContent=hasFile?`服务器已确认 ${fileCount} 个有效文件，可以发布。`:'请选择 PDF、XLSX 或 DOCX；选择后会立即上传。';$('draftStatus').className=`draft-status ${hasFile?'good':''}`;$('publishBtn').disabled=!hasFile}
    async function searchReports(){if(!token()){showMessage('请先登录 SSO。');return}$('searchBtn').disabled=true;try{const params=new URLSearchParams(new FormData($('searchForm')));for(const [key,value] of [...params.entries()])if(!value)params.delete(key);const data=await api(`/v1/quality-reports?${params}`);$('summaryText').textContent=`查询到 ${data.total} 份报告`;$('results').innerHTML=data.items.length?data.items.map(reportCard).join(''):'<div class="panel empty">没有找到符合条件的已发布报告。</div>'}catch(e){showMessage(`查询失败：${e.message}`)}finally{$('searchBtn').disabled=false}}
    async function openDetail(id){try{const item=await api(`/v1/quality-reports/${id}`);$('detailTitle').textContent=`${item.product_code} · ${item.product_name}`;$('detailSubtitle').textContent=`${item.system_code||item.report_no} · v${item.revision} · ${statusLabel[item.status]||item.status}`;const files=(item.files||[]).map(file=>`<div class="file-row"><div><strong>${esc(file.filename)}</strong><div class="muted">${fmtBytes(file.size_bytes)} · ${esc(file.mime_type)} · SHA-256 ${esc(file.sha256.slice(0,12))}…</div></div><button class="primary" onclick="downloadFile(${file.id},'${esc(file.filename)}')">${file.mime_type==='application/pdf'?'预览 / 下载':'下载源文件'}</button></div>`).join('')||'<div class="muted">暂无可用文件</div>';const history=(item.history||[]).map(row=>`<div class="history-row"><span>v${row.revision} · ${statusLabel[row.status]||row.status}</span><span class="muted">${esc(row.inspection_date||'-')}</span></div>`).join('');$('detailBody').innerHTML=`<div class="detail-grid"><div class="detail-item"><small>系统编号</small>${esc(item.system_code||item.report_no)}</div><div class="detail-item"><small>外部／原始报告号</small>${esc(item.external_report_no||'-')}</div><div class="detail-item"><small>产品编码</small>${esc(item.product_code)}</div><div class="detail-item"><small>批次号</small>${esc(item.batch_no||'通用报告')}</div><div class="detail-item"><small>报告类型</small>${esc(item.report_type)}</div><div class="detail-item"><small>检验日期</small>${esc(item.inspection_date||'-')}</div></div><h3>报告文件</h3>${files}<h3>历史版本</h3>${history}`;$('detailModal').classList.add('show')}catch(e){showMessage(`详情加载失败：${e.message}`)}}
    async function downloadFile(id,name){try{const response=await fetch(`${API_BASE}/v1/quality-reports/files/${id}/download`,{headers:headers(false)});if(!response.ok){let detail=`HTTP ${response.status}`;try{detail=(await response.json()).detail||detail}catch{}throw new Error(detail)}const blob=await response.blob();const url=URL.createObjectURL(blob);if(blob.type==='application/pdf'){window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000)}else{const a=document.createElement('a');a.href=url;a.download=name||'quality-report';a.click();URL.revokeObjectURL(url)}}catch(e){showMessage(`文件读取失败：${e.message}`)}}
    async function createDraft(event){event.preventDefault();if(!selectedSubject){showMessage('请先从系统物料或自定义产品中选择关联对象。');$('subjectQuery').focus();return}const body=Object.fromEntries(new FormData(event.target));for(const key of Object.keys(body))if(body[key]==='')body[key]=null;Object.assign(body,{subject_source:selectedSubject.source,subject_type:$('subjectType').value,product_code:selectedSubject.code,product_name:selectedSubject.name,test_item_codes:[...selectedTestItems]});body.revision=Number(body.revision||1);$('createBtn').disabled=true;try{currentDraft=await api('/v1/quality-reports',{method:'POST',body:JSON.stringify(body)});showDraft(currentDraft,0);$('draftBox').scrollIntoView({behavior:'smooth',block:'center'});showMessage(`草稿已创建，系统编号 ${currentDraft.system_code||currentDraft.report_no}。`,'good');loadDrafts()}catch(e){showMessage(`创建失败：${e.message}`)}finally{$('createBtn').disabled=false}}
    async function uploadFile(){const file=$('reportFile').files[0];if(!currentDraft||!file){showMessage('请先创建或恢复草稿，再选择文件。');return}$('uploadBtn').disabled=true;$('publishBtn').disabled=true;$('draftStatus').textContent=`正在上传 ${file.name}，请勿关闭页面…`;$('draftStatus').className='draft-status';try{const form=new FormData();form.append('file',file);const data=await api(`/v1/quality-reports/${currentDraft.id}/files`,{method:'POST',body:form,json:false});$('draftStatus').textContent=`服务器已确认：${data.filename}（${fmtBytes(data.size_bytes)}），SHA-256 ${data.sha256.slice(0,16)}…`;$('draftStatus').className='draft-status good';$('publishBtn').disabled=false;showMessage('文件上传成功，现在可以发布。','good');loadDrafts()}catch(e){$('draftStatus').textContent=`上传失败：${e.message}`;$('draftStatus').className='draft-status bad';showMessage(`上传失败：${e.message}`)}finally{$('uploadBtn').disabled=false}}
    async function publishDraft(){if(!currentDraft||$('publishBtn').disabled){showMessage('服务器尚未确认有效文件，不能发布。');return}if(!confirm('发布后文件不可覆盖；确认发布此修订版本？'))return;$('publishBtn').disabled=true;try{currentDraft=await api(`/v1/quality-reports/${currentDraft.id}/publish`,{method:'POST'});$('draftStatus').textContent='报告已发布。';$('draftStatus').className='draft-status good';showMessage('质检报告已发布，所有登录人员可查询和下载。','good');searchReports();loadDrafts()}catch(e){$('draftStatus').textContent=`发布失败：${e.message}`;$('draftStatus').className='draft-status bad';showMessage(`发布失败：${e.message}`);$('draftBox').scrollIntoView({behavior:'smooth',block:'center'})}finally{if(currentDraft&&currentDraft.status==='draft')$('publishBtn').disabled=false}}
    $('searchForm').onsubmit=(e)=>{e.preventDefault();searchReports()};$('resetBtn').onclick=()=>{$('searchForm').reset();searchReports()};$('createForm').onsubmit=createDraft;$('uploadBtn').onclick=uploadFile;$('reportFile').onchange=()=>{if($('reportFile').files[0])uploadFile()};$('publishBtn').onclick=publishDraft;$('subjectSearchBtn').onclick=searchSubjects;$('subjectQuery').onkeydown=(e)=>{if(e.key==='Enter'){e.preventDefault();searchSubjects()}};$('subjectType').onchange=()=>{selectedSubject=null;$('selectedSubject').classList.add('hidden');$('subjectResults').innerHTML=''};$('materialCategory').onchange=updateMaterialSubcategories;$('toggleCustomBtn').onclick=()=>$('customSubjectBox').classList.toggle('hidden');$('createSubjectBtn').onclick=createCustomSubject;$('closeModalBtn').onclick=()=>$('detailModal').classList.remove('show');$('detailModal').onclick=(e)=>{if(e.target===$('detailModal'))$('detailModal').classList.remove('show')};$('loginBtn').onclick=()=>location.href=`${API_BASE}/v1/auth/oidc/login?rd=${encodeURIComponent(location.pathname)}`;$('logoutBtn').onclick=()=>{clearToken();applyAuth(null)};$('toggleManagerBtn').onclick=()=>{$('createForm').classList.toggle('hidden');$('draftBox').classList.toggle('hidden',!currentDraft);$('draftsBox').classList.toggle('hidden')};
    (async()=>{await initAuth();if(me){await searchReports();if(can('quality_report.manage')){await loadCatalog();await loadDrafts()}}})();
  </script>
</body>
</html>
