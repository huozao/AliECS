<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AliECS · 备份与恢复</title>
  <style>
    :root{--bg:#f7f5f0;--panel:#fffdf8;--text:#25211b;--muted:#8a8172;--line:#e7dfd0;--good:#3f7a4c;--warn:#a46b1f;--bad:#a6423a;--primary:#6f5e46;--shadow:0 10px 26px rgba(69,56,38,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.hidden{display:none!important}
    .wrap{max-width:1180px;margin:0 auto;padding:16px 16px 48px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 4px 12px}h1{margin:0;font-size:24px}.actions{display:flex;gap:8px;align-items:center}.btn,button{border:0;border-radius:999px;padding:9px 14px;background:#e8dfcf;color:var(--text);font-weight:650;font-size:14px;text-decoration:none;cursor:pointer}.btn.primary{background:var(--primary);color:#fff}.band{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:16px;margin-bottom:14px}.band h2{margin:0 0 12px;font-size:16px}.muted{color:var(--muted)}
    .summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:720px){.summary{grid-template-columns:repeat(4,1fr)}}.metric{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.metric .label{font-size:12px;color:var(--muted)}.metric .value{font-size:24px;font-weight:800;margin-top:4px}.metric .value.sm{font-size:15px}.chip{display:inline-flex;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:750}.ok{background:#dfeee3;color:var(--good)}.warning,.unknown,.planned{background:#f4ead8;color:var(--warn)}.failed{background:#f5d7d3;color:var(--bad)}.covered,.passive{background:#e6edf5;color:#4c6785}.excluded{background:#ece9e3;color:#746d62}
    .cards{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.card h3{margin:0;font-size:16px}.purpose{margin:5px 0 0;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr;gap:8px 16px;margin-top:12px}@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr)}}.field{font-size:13px}.field b{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}.dest{border-left:3px solid var(--line);padding-left:9px;margin-top:6px}.error{color:var(--bad);font-size:13px;margin-top:8px}.notice{border-left:4px solid var(--warn);padding:10px 12px;background:#fff;border-radius:10px}.modal{position:fixed;inset:0;background:rgba(30,22,12,.28);display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.modal-panel{width:min(900px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;padding:16px}pre{white-space:pre-wrap;word-break:break-word;background:#f7f5f0;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="topbar"><h1>备份与恢复</h1><nav class="actions"><button id="refreshBtn" class="btn primary hidden">刷新</button><a class="btn" href="/health/">返回系统健康</a><button id="loginBtn" class="btn">登录（SSO）</button><button id="logoutBtn" class="btn hidden">退出</button></nav></header>
    <div id="gateHint" class="band">此页面仅管理员可见。请先登录统一 SSO。</div>
    <div id="errorBox" class="notice hidden"></div>
    <div id="adminContent" class="hidden">
      <section class="band"><h2>保护概况</h2><div id="summary" class="summary"></div></section>
      <section class="band"><h2>备份总账</h2><p class="muted">同时列出正常、待纳管、间接覆盖和明确排除的内容，避免遗漏未保护资产。</p><div id="cards" class="cards"><div class="muted">加载中...</div></div></section>
    </div>
  </main>
  <div id="historyModal" class="modal"><div class="modal-panel"><div class="card-head"><h3 id="modalTitle">运行历史</h3><button id="closeModalBtn" class="btn">关闭</button></div><div id="modalBody" style="margin-top:12px"></div></div></div>
  <script>
    const API_BASE=location.port==='8080'?'http://localhost:8000':'/api';const AUTH_KEYS=['aliecs_auth_token','portal_token','admin_token'];const $=(id)=>document.getElementById(id);const token=()=>AUTH_KEYS.map(k=>localStorage.getItem(k)||'').find(Boolean)||'';const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmtTime=(v)=>v?new Date(v).toLocaleString():'-';const fmtBytes=(v)=>{if(v===null||v===undefined)return '-';let n=Number(v),u=['B','KB','MB','GB','TB'],i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`};
    function headers(){const h={'Content-Type':'application/json'};if(token())h.Authorization=`Bearer ${token()}`;return h}async function api(path){const r=await fetch(`${API_BASE}${path}`,{headers:headers()});const t=await r.text();let d={};if(t){try{d=JSON.parse(t)}catch{d={raw:t}}}if(!r.ok)throw new Error(d.detail||`HTTP ${r.status}`);return d}
    const chip=(s)=>`<span class="chip ${esc(s||'unknown')}">${esc(statusLabel(s))}</span>`;function statusLabel(s){return ({ok:'正常',warning:'警告',failed:'异常',unknown:'未知',planned:'待纳管',covered:'间接覆盖',passive:'恢复来源',excluded:'明确排除',success:'成功',partial:'部分成功'})[s]||s||'未知'}
    function renderSummary(s){summary.innerHTML=[`<article class="metric"><div class="label">整体状态</div><div class="value">${chip(s.status)}</div></article>`,`<article class="metric"><div class="label">正常 / 警告 / 异常</div><div class="value">${s.ok||0} / ${s.warning||0} / ${s.failed||0}</div></article>`,`<article class="metric"><div class="label">待纳管 / 未知</div><div class="value">${s.planned||0} / ${s.unknown||0}</div></article>`,`<article class="metric"><div class="label">最近成功</div><div class="value sm">${fmtTime(s.last_success_at)}</div></article>`].join('')}
    function destinations(run,detail){const ds=(run&&run.destinations)||[];if(ds.length)return ds.map(d=>`<div class="dest"><b>${esc(d.name||d.role||'存储')}</b> ${chip(d.status)}<br><span class="muted">${esc(d.location||'')} ${d.finished_at?`· ${fmtTime(d.finished_at)}`:''}</span></div>`).join('');const configured=(detail&&detail.destinations)||[];if(configured.length)return configured.map(d=>`<div class="dest muted">${esc(d)}</div>`).join('');return '<span class="muted">未配置运行位置</span>'}
    function restoreStatus(item){const check=item.latest_restore_check;if(check)return `${chip(check.status)} · ${fmtTime(check.checked_at)}${check.target_device?` · ${esc(check.target_device)}`:''}`;if(item.code==='core-restic')return '<span class="chip warning">未执行</span>';return '<span class="muted">不适用或待建设</span>'}
    function renderCards(items){cards.innerHTML=items.map(item=>{const run=item.latest_run||null;return `<article class="card"><div class="card-head"><div><h3>${esc(item.name)}</h3><p class="purpose">${esc(item.purpose)}</p></div>${chip(item.status)}</div><div class="grid"><div class="field"><b>备份对象</b>${esc(item.asset)}</div><div class="field"><b>来源设备</b>${esc(item.source_device)}</div><div class="field"><b>方式 / 周期</b>${esc(item.method)} · ${esc(item.schedule_label)}</div><div class="field"><b>最近成功/完成</b>${fmtTime(run&&run.finished_at)}</div><div class="field"><b>快照 / 数据量</b>${esc(run&&run.snapshot_id||'-')} · ${fmtBytes(run&&run.data_bytes)}</div><div class="field"><b>恢复校验</b>${restoreStatus(item)}</div><div class="field"><b>保留策略</b>${esc(item.retention_policy||'-')}</div></div><div style="margin-top:10px"><b style="font-size:12px;color:var(--muted)">存储位置</b>${destinations(run,item.detail)}</div>${run&&run.error_message?`<div class="error">${esc(run.error_message)}</div>`:''}<div style="margin-top:10px"><button class="btn" onclick="openHistory('${encodeURIComponent(item.code)}','${encodeURIComponent(item.name)}')">运行历史</button></div></article>`}).join('')}
    async function openHistory(code,name){historyModal.classList.add('show');modalTitle.textContent=`${decodeURIComponent(name)} · 运行历史`;modalBody.innerHTML='<div class="muted">加载中...</div>';try{const d=await api(`/v1/ops/backups/${code}/runs`);modalBody.innerHTML=d.items.length?d.items.map(r=>`<article class="card" style="margin-bottom:8px"><div class="card-head"><b>${fmtTime(r.finished_at)}</b>${chip(r.status)}</div><div class="grid"><div class="field"><b>运行编号</b>${esc(r.run_id)}</div><div class="field"><b>设备</b>${esc(r.source_device)}</div><div class="field"><b>快照</b>${esc(r.snapshot_id||'-')}</div></div>${r.error_message?`<div class="error">${esc(r.error_message)}</div>`:''}</article>`).join(''):'<div class="muted">暂无运行记录。</div>'}catch(e){modalBody.innerHTML=`<div class="error">${esc(e.message)}</div>`}}
    async function load(){refreshBtn.disabled=true;errorBox.classList.add('hidden');try{const d=await api('/v1/ops/backups');renderSummary(d.summary||{});renderCards(d.items||[])}catch(e){errorBox.textContent=e.message;errorBox.classList.remove('hidden')}finally{refreshBtn.disabled=false}}
    async function init(){let me=null;if(token()){try{me=await api('/v1/auth/me')}catch{}}const admin=!!me&&((me.roles||[]).includes('admin')||(me.permissions||[]).includes('admin.access'));adminContent.classList.toggle('hidden',!admin);gateHint.classList.toggle('hidden',admin);refreshBtn.classList.toggle('hidden',!admin);loginBtn.classList.toggle('hidden',admin);logoutBtn.classList.toggle('hidden',!token());if(admin)load()}
    refreshBtn.onclick=load;loginBtn.onclick=()=>location.href=`${API_BASE}/v1/auth/oidc/login`;logoutBtn.onclick=()=>{AUTH_KEYS.forEach(k=>localStorage.removeItem(k));location.reload()};closeModalBtn.onclick=()=>historyModal.classList.remove('show');historyModal.onclick=e=>{if(e.target===historyModal)historyModal.classList.remove('show')};init();
  </script>
</body>
</html>
