<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>材色智配</title>
  <style>
    :root{--bg:#f7f5f0;--card:#fffdf8;--text:#25211b;--muted:#8a8172;--line:#e7dfd0;--primary:#6f5e46;--shadow:0 10px 26px rgba(69,56,38,.07)}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at top left,rgba(180,157,118,.16),transparent 38%),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
    .wrap{max-width:1120px;margin:0 auto;padding:16px 16px 48px}
    /* 顶栏 */
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 4px 14px}
    h1{margin:0;font-size:26px;letter-spacing:.01em}
    .top-actions{display:flex;gap:8px;align-items:center;flex:0 0 auto}
    .btn,button{border:0;border-radius:999px;padding:9px 15px;background:#e8dfcf;color:var(--text);cursor:pointer;font-weight:650;font-size:14px;text-decoration:none;white-space:nowrap}
    .btn.primary{background:var(--primary);color:#fff}
    .btn.subtle{background:#efe8dc;color:#6e6355}
    button:disabled,.btn:disabled{opacity:.6;cursor:progress}
    /* ⋯ 菜单 */
    .menu{position:relative}
    .menu-toggle{padding:9px 13px;line-height:1}
    .menu-list{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:150px;z-index:20}
    .menu-list a,.menu-list button{display:block;width:100%;text-align:left;background:transparent;border-radius:10px;padding:10px 12px;font-weight:600}
    .menu-list a:hover,.menu-list button:hover{background:#f3ede2}
    /* 提示条 */
    .error,.success{border-radius:12px;padding:11px 14px;margin:0 0 12px;font-size:14px}
    .error{display:none;background:#f5d7d3;color:#a6423a}
    .success{display:none;background:#dfeee3;color:#3f7a4c}
    /* 分组 + 紧凑列表 */
    .group{margin-bottom:22px}
    .group h2{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.03em;margin:0 0 10px;padding-left:2px}
    .rows{display:grid;grid-template-columns:1fr;gap:8px}
    @media(min-width:640px){.rows{grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}}
    .row{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);text-decoration:none;color:var(--text);cursor:pointer;transition:transform .06s ease}
    .row:active{transform:scale(.99)}
    .row .emoji{font-size:21px;line-height:1;flex:0 0 auto}
    .row .body{flex:1 1 auto;min-width:0}
    .row .name{font-weight:650;font-size:15px}
    .row .desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35}
    .row .arrow{color:var(--muted);flex:0 0 auto;font-size:16px}
    .row.locked{opacity:.5;cursor:default}
    .row.locked:active{transform:none}
    .hidden{display:none!important}
    .muted{color:var(--muted)}
    .site-footer{text-align:center;margin-top:30px;color:var(--muted);font-size:12px}
    .site-footer a{color:inherit;text-decoration:none}
    .site-footer a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <h1>材色智配</h1>
      <nav class="top-actions">
        <button id="topLoginBtn" class="btn primary" type="button">登录（SSO）</button>
        <button id="topLogoutBtn" class="btn subtle hidden" type="button">退出登录</button>
        <div class="menu">
          <button id="menuToggle" class="btn subtle menu-toggle" type="button" aria-label="更多">⋯</button>
          <div id="menuList" class="menu-list hidden">
            <button id="refreshBtn" type="button">刷新数据</button>
            <a href="/health/">API Health</a>
            <a id="adminLink" class="hidden" href="/admin/">Admin UI</a>
          </div>
        </div>
      </nav>
    </header>
    <main id="groupsRoot"></main>
    <footer class="site-footer">
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">蜀ICP备2026040494号-2</a>
    </footer>
  </div>
  <script src="/common/toast.js"></script>
  <script>
    const API_BASE=location.port==='8080'?'http://localhost:8000':'/api';
    const AUTH_KEYS=['aliecs_auth_token','portal_token','admin_token'];
    const state={token:'',user:null,features:[]};

    // —— 展示配置（前端映射，不依赖后端字段）——
    const CATEGORY_ORDER=['业务查询','业务录入','质检','工具','个人','系统'];
    const CATEGORY_EMOJI={'业务查询':'🔍','业务录入':'✍️','质检':'🔬','工具':'🛠️','个人':'👤','系统':'⚙️'};
    const FEATURE_EMOJI={
      raw_inventory:'🧱',finished_inventory:'📦',formula_query:'🧪',formula_color_space:'🎨',
      tplus_bom_builder:'➕',new_model_form:'🆕',schedule_form:'📅',pending_return_alert:'🔔',
      naming_form:'🏷️',qc_form:'🔬',density_calculator:'⚖️',midea_requirement:'📋',
      personal_section:'👤',admin_ui:'⚙️',ash_calculator:'🔢',ai_file_transfer:'📁',quality_reports:'📄',
      density_buoyancy_calc:'💧'
    };
    // 仅这些功能的说明确实补充了标题之外的信息，才显示小灰字
    const DESC_WHITELIST=new Set(['formula_query','formula_color_space','ash_calculator','ai_file_transfer','quality_reports']);

    const ssoLogin=()=>{location.href=`${API_BASE}/v1/auth/oidc/login`;};
    const getAuthToken=()=>AUTH_KEYS.map((k)=>localStorage.getItem(k)||'').find(Boolean)||'';
    const setAuthToken=(t)=>AUTH_KEYS.forEach((k)=>localStorage.setItem(k,t));
    const clearAuthToken=()=>AUTH_KEYS.forEach((k)=>localStorage.removeItem(k));
    const syncTokenState=()=>{state.token=getAuthToken();};
    const isInternal=(u)=>typeof u==='string'&&u.startsWith('/');
    function showError(m){AliECSToast.show(m,'error');}
    function showSuccess(m){AliECSToast.show(m,'success');}
    function clearMessage(){AliECSToast.hide();}

    async function api(path,opt={}){
      const headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});
      syncTokenState();
      if(state.token)headers.Authorization=`Bearer ${state.token}`;
      const response=await fetch(`${API_BASE}${path}`,{...opt,headers});
      const text=await response.text();
      let data={};
      if(text){try{data=JSON.parse(text)}catch{data={raw:text}}}
      if(!response.ok){
        if(response.status===401){clearAuthToken();syncTokenState();}
        throw new Error(data.detail||`HTTP ${response.status}`);
      }
      return data;
    }

    function renderAuth(){
      const logged=Boolean(state.token&&state.user&&state.user.username!=='guest');
      const roles=state.user&&state.user.roles||[],permissions=state.user&&state.user.permissions||[];
      const adminAllowed=roles.includes('admin')||permissions.includes('admin.access');
      topLoginBtn.classList.toggle('hidden',logged);
      topLogoutBtn.classList.toggle('hidden',!logged);
      topLogoutBtn.textContent=logged?`退出（${state.user.username}）`:'退出登录';
      adminLink.classList.toggle('hidden',!adminAllowed);
    }

    // /v1/features 已按当前账号权限过滤；前端只区分可打开与暂未开放。
    function featureState(f){
      if(f.status==='active'&&f.url){
        if(isInternal(f.url))return 'open-internal';
        return 'open-external';
      }
      return 'locked-reserved';
    }
    function rowHtml(f){
      const emoji=FEATURE_EMOJI[f.code]||CATEGORY_EMOJI[f.category]||'•';
      const desc=(DESC_WHITELIST.has(f.code)&&f.description)?`<div class="desc">${f.description}</div>`:'';
      const body=`<span class="emoji">${emoji}</span><div class="body"><div class="name">${f.title}</div>${desc}</div>`;
      switch(featureState(f)){
        case 'open-internal':
          return `<a class="row" href="${f.url}">${body}<span class="arrow">›</span></a>`;
        case 'open-external':
          return `<a class="row" href="${f.url}" target="_blank" rel="noreferrer">${body}<span class="arrow">↗</span></a>`;
        default:
          return `<div class="row locked" onclick="showError('该功能暂未开放')">${body}<span class="arrow">🔒</span></div>`;
      }
    }

    function renderFeatures(){
      const items=(state.features||[]).slice();
      if(!items.length){groupsRoot.innerHTML='<div class="muted">当前没有功能配置。</div>';return;}
      const groups={};
      items.forEach((f)=>{const c=f.category||'其他';(groups[c]||(groups[c]=[])).push(f);});
      const known=CATEGORY_ORDER.filter((c)=>groups[c]);
      const extra=Object.keys(groups).filter((c)=>!CATEGORY_ORDER.includes(c));
      const ordered=[...known,...extra];
      groupsRoot.innerHTML=ordered.map((cat)=>{
        const rows=groups[cat]
          .sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))
          .map(rowHtml).join('');
        return `<section class="group"><h2>${cat}</h2><div class="rows">${rows}</div></section>`;
      }).join('');
    }

    async function loadFeatures(){
      clearMessage();
      const data=await api('/v1/features');
      state.user=data.user||{username:'guest',roles:[],permissions:[]};
      state.features=data.features||[];
      syncTokenState();
      renderAuth();
      renderFeatures();
    }
    function logout(){clearAuthToken();syncTokenState();state.user=null;showSuccess('已退出登录。');loadFeatures().catch((e)=>showError(e.message));}

    document.addEventListener('DOMContentLoaded',()=>{
      syncTokenState();
      refreshBtn.onclick=()=>{menuList.classList.add('hidden');loadFeatures().catch((e)=>showError(e.message));};
      topLoginBtn.onclick=ssoLogin;
      topLogoutBtn.onclick=logout;
      menuToggle.onclick=(e)=>{e.stopPropagation();menuList.classList.toggle('hidden');};
      document.addEventListener('click',(e)=>{if(!e.target.closest('.menu'))menuList.classList.add('hidden');});
      loadFeatures().catch((e)=>showError(`加载功能入口失败：${e.message}`));
    });
  </script>
</body>
</html>
