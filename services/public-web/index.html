<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AliECS · 首页</title>
  <style>
    :root{--bg:#f7f5f0;--card:#fffdf8;--text:#25211b;--muted:#766f63;--line:#e7dfd0;--primary:#6f5e46;--shadow:0 12px 30px rgba(69,56,38,.08)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,rgba(180,157,118,.18),transparent 35%),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui}.wrap{max-width:1120px;margin:0 auto;padding:20px 18px 56px}.topbar{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;background:rgba(255,253,248,.92);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px;padding:18px 20px;margin-bottom:16px}h1{margin:0;font-size:34px}.subtitle{margin:8px 0 0;color:var(--muted)}.top-actions{display:flex;gap:8px;flex-wrap:nowrap;justify-content:flex-end;white-space:nowrap;overflow:auto;max-width:64%}.btn,button{border:0;border-radius:999px;padding:9px 13px;background:#e8dfcf;color:var(--text);cursor:pointer;font-weight:650;text-decoration:none}.btn.primary{background:var(--primary);color:#fff}.btn.subtle{background:#efe8dc;color:#6e6355}button:disabled,.btn:disabled{opacity:.6;cursor:progress}.card{background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.feature-card{min-height:190px;display:flex;flex-direction:column;justify-content:space-between}.hidden{display:none!important}.small{font-size:12px}.muted{color:var(--muted)}.error,.success{border-radius:14px;padding:12px 14px;margin-bottom:14px}.error{display:none;background:#f5d7d3;color:#a6423a}.success{display:none;background:#dfeee3;color:#3f7a4c}.modal{position:fixed;inset:0;background:rgba(30,22,12,.28);display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.panel{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.panel input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:10px}@media (max-width:900px){.grid{grid-template-columns:1fr}.topbar{flex-wrap:wrap}.top-actions{max-width:100%}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div>
        <h1>首页</h1>
        <p class="subtitle">配方、库存、系统状态与权限功能的统一导航页。</p>
      </div>
      <nav class="top-actions">
        <a class="btn primary" href="/">首页</a>
        <a class="btn" href="/health/">API Health</a>
        <a id="adminLink" class="btn" href="/admin/">Admin UI</a>
        <button id="refreshBtn" class="btn subtle" type="button">刷新数据</button>
        <button id="topLoginBtn" class="btn" type="button">登录</button>
        <button id="topRegisterBtn" class="btn" type="button">注册</button>
        <button id="topLogoutBtn" class="btn hidden" type="button">退出登录</button>
      </nav>
    </header>
    <div id="errorBox" class="error"></div>
    <div id="successBox" class="success"></div>
    <section id="features" class="card">
      <h2>主要功能</h2>
      <p class="muted">首页展示全部功能。第一行固定为原材料库存、成品库存、系统配方。</p>
      <div id="featuresGrid" class="grid"></div>
    </section>
  </div>
  <div id="authModal" class="modal">
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3 id="modalTitle" style="margin:0">登录</h3>
        <button id="closeModal" class="btn" type="button">关闭</button>
      </div>
      <p class="small muted" id="modalHint">请输入账号密码。</p>
      <input id="modalUsername" placeholder="用户名"/>
      <input id="modalPassword" type="password" placeholder="密码"/>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button id="submitAuthBtn" class="btn primary" type="button">提交</button>
      </div>
    </div>
  </div>
  <script>
    const API_BASE=location.port==='8080'?'http://localhost:8000':'/api';
    const AUTH_KEYS=['aliecs_auth_token','portal_token','admin_token'];
    const state={token:'',user:null,features:[],rbac:[],mode:'login'};
    const getAuthToken=()=>AUTH_KEYS.map((key)=>localStorage.getItem(key)||'').find(Boolean)||'';
    const setAuthToken=(token)=>AUTH_KEYS.forEach((key)=>localStorage.setItem(key,token));
    const clearAuthToken=()=>AUTH_KEYS.forEach((key)=>localStorage.removeItem(key));
    const syncTokenState=()=>{state.token=getAuthToken();};
    function showError(message){errorBox.textContent=message;errorBox.style.display='block';successBox.style.display='none'}
    function showSuccess(message){successBox.textContent=message;successBox.style.display='block';errorBox.style.display='none'}
    function clearMessage(){errorBox.style.display='none';successBox.style.display='none'}
    async function api(path,opt={}){
      const headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});
      syncTokenState();
      if(state.token)headers.Authorization=`Bearer ${state.token}`;
      const response=await fetch(`${API_BASE}${path}`,{...opt,headers});
      const text=await response.text();
      let data={};
      if(text){try{data=JSON.parse(text)}catch{data={raw:text}}}
      if(!response.ok){
        if(response.status===401){clearAuthToken();syncTokenState();}
        throw new Error(data.detail||`HTTP ${response.status}`);
      }
      return data;
    }
    function renderAuth(){
      const logged=Boolean(state.token&&state.user&&state.user.username!=='guest');
      topLoginBtn.classList.toggle('hidden',logged);
      topRegisterBtn.classList.toggle('hidden',logged);
      topLogoutBtn.classList.toggle('hidden',!logged);
      topLogoutBtn.textContent=logged?`退出登录（${state.user.username}）`:'退出登录';
    }
    function isInternal(url){return typeof url==='string'&&url.startsWith('/');}
    function renderFeatureAction(feature){
      if(!feature.url||feature.status!=='active')return '<span class="btn subtle">暂不可用</span>';
      if(isInternal(feature.url))return `<button class="btn primary" type="button" onclick="location.assign('${feature.url}')">打开入口</button>`;
      if(!feature.allowed)return `<button class="btn" type="button" onclick="showError('没登录没权限请登录')">打开入口</button>`;
      return `<a class="btn primary" href="${feature.url}" target="_blank" rel="noreferrer">打开入口</a>`;
    }
    function renderFeatures(){
      const items=state.features||[];
      if(!items.length){featuresGrid.innerHTML='<div class="muted">当前没有功能配置。</div>';return;}
      featuresGrid.innerHTML=items.map((feature)=>`<article class="feature-card card"><div><h3>${feature.title}</h3><p>${feature.description||'暂无说明'}</p><div class="small muted">分类：${feature.category||'未分类'}<br/>权限：${feature.required_permission||'公开'}</div></div><div style="margin-top:14px;">${renderFeatureAction(feature)}</div></article>`).join('');
    }
    async function loadFeatures(){
      clearMessage();
      const data=await api('/v1/features?include_all=true');
      state.user=data.user||{username:'guest',roles:[],permissions:[]};
      state.features=data.features||[];
      syncTokenState();
      renderAuth();
      renderFeatures();
    }
    function openModal(mode){state.mode=mode;modalTitle.textContent=mode==='login'?'登录':'注册';modalHint.textContent=mode==='login'?'请输入账号密码。':'请输入新账号信息（注册请求）。';authModal.classList.add('show');}
    function closeAuthModal(){authModal.classList.remove('show');modalUsername.value='';modalPassword.value='';}
    async function handleAuthSubmit(){
      if(submitAuthBtn.disabled)return;
      const username=modalUsername.value.trim(),password=modalPassword.value;
      if(!username||!password){showError('请输入用户名和密码。');return;}
      const isLogin=state.mode==='login';
      const originalLabel=submitAuthBtn.textContent;
      submitAuthBtn.disabled=true;
      submitAuthBtn.textContent=isLogin?'登录中…':'提交中…';
      modalHint.textContent=isLogin?'已提交，正在登录，请稍候…':'已提交注册请求，请稍候…';
      try{
        if(isLogin){
          const data=await api('/v1/auth/login',{method:'POST',body:JSON.stringify({username,password})});
          setAuthToken(data.token);syncTokenState();showSuccess('登录成功。');closeAuthModal();await loadFeatures();
        }else{
          await api('/v1/auth/register',{method:'POST',body:JSON.stringify({username,password,note:'portal'})});
          showSuccess('注册请求已提交，请联系管理员开通。');closeAuthModal();
        }
      }finally{
        submitAuthBtn.disabled=false;
        submitAuthBtn.textContent=originalLabel;
      }
    }
    function logout(){clearAuthToken();syncTokenState();state.user=null;showSuccess('已退出登录。');loadFeatures().catch((error)=>showError(error.message));}
    document.addEventListener('DOMContentLoaded',()=>{
      syncTokenState();
      refreshBtn.onclick=()=>loadFeatures().catch((error)=>showError(error.message));
      topLoginBtn.onclick=()=>openModal('login');
      topRegisterBtn.onclick=()=>openModal('register');
      topLogoutBtn.onclick=logout;
      closeModal.onclick=closeAuthModal;
      submitAuthBtn.onclick=()=>handleAuthSubmit().catch((error)=>showError(error.message));
      modalPassword.onkeydown=(event)=>{if(event.key==='Enter')handleAuthSubmit().catch((error)=>showError(error.message));};
      authModal.onclick=(event)=>{if(event.target===authModal)closeAuthModal();};
      loadFeatures().catch((error)=>showError(`加载功能入口失败：${error.message}`));
    });
  </script>
</body>
</html>
