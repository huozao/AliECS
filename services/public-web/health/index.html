<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AliECS · API Health</title>
  <style>
    :root{--bg:#f7f5f0;--panel:#fffdf8;--text:#25211b;--muted:#8a8172;--line:#e7dfd0;--good:#3f7a4c;--warn:#a46b1f;--bad:#a6423a;--primary:#6f5e46;--shadow:0 10px 26px rgba(69,56,38,.07)}
    *{box-sizing:border-box}
    .hidden{display:none!important}
    body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
    .wrap{max-width:1180px;margin:0 auto;padding:16px 16px 48px}
    /* 顶栏 */
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 4px 12px}
    h1{margin:0;font-size:24px}
    .actions{display:flex;gap:8px;align-items:center;flex:0 0 auto}
    .btn,button{border:0;border-radius:999px;padding:9px 14px;background:#e8dfcf;color:var(--text);font-weight:650;font-size:14px;text-decoration:none;cursor:pointer;white-space:nowrap}
    .btn.primary{background:var(--primary);color:#fff}
    button:disabled,.btn:disabled{opacity:.6;cursor:progress}
    .menu{position:relative}
    .menu-toggle{padding:9px 13px;line-height:1}
    .menu-list{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:158px;z-index:20}
    .menu-list a,.menu-list button{display:block;width:100%;text-align:left;background:transparent;border-radius:10px;padding:10px 12px;font-weight:600}
    .menu-list a:hover,.menu-list button:hover{background:#f3ede2}
    /* 总状态条 */
    .statusbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:13px 16px;margin-bottom:14px;font-weight:650}
    .statusbar .dot{width:11px;height:11px;border-radius:50%;background:var(--good);display:inline-block;margin-right:7px;vertical-align:middle}
    .statusbar .dot.warn{background:var(--warn)}.statusbar .dot.bad{background:var(--bad)}
    .statusbar .seg{color:var(--muted);font-weight:600;font-size:14px}
    .statusbar .seg b{color:var(--text);font-weight:750}
    /* 区块 */
    .band{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:16px;margin-bottom:14px}
    .band h2{margin:0 0 12px;font-size:16px}
    .band h3{margin:16px 0 8px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.02em}
    .muted{color:var(--muted)}
    /* 指标小格 */
    .metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    @media(min-width:720px){.metrics{grid-template-columns:repeat(3,1fr)}}
    .metric{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 13px}
    .metric.clickable{cursor:pointer}
    .metric .label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
    .metric .value{font-size:24px;font-weight:800;margin-top:4px;line-height:1.1}
    .metric .value.sm{font-size:15px;font-weight:700}
    .metric .sub{font-size:12px;color:var(--muted);margin-top:3px}
    .chip{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:750}
    .ok{background:#dfeee3;color:var(--good)}.degraded,.warning{background:#f4ead8;color:var(--warn)}.critical,.failed{background:#f5d7d3;color:var(--bad)}
    /* 关注项 */
    .list{display:grid;gap:8px}
    .attention{border-left:4px solid var(--warn);padding:9px 11px;background:#fff;border-radius:9px;font-size:13px}
    .attention.critical{border-left-color:var(--bad)}
    /* 主机卡片行 */
    .hostrows{display:grid;grid-template-columns:1fr;gap:8px}
    @media(min-width:720px){.hostrows{grid-template-columns:repeat(2,1fr)}}
    .hostrow{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;cursor:pointer;min-height:54px}
    .hostrow .hdot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:0 0 auto}
    .hostrow .hdot.bad{background:var(--bad)}
    .hostrow .hbody{flex:1 1 auto;min-width:0}
    .hostrow .hname{font-weight:700;font-size:14px}
    .hostrow .hmeta{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .hostrow .arrow{color:var(--muted);flex:0 0 auto}
    /* 链接卡 + 按钮 */
    .linkgrid{display:grid;grid-template-columns:1fr;gap:10px}
    @media(min-width:720px){.linkgrid{grid-template-columns:repeat(2,1fr)}}
    .card-link{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;transition:box-shadow .15s}
    .card-link:hover{box-shadow:0 4px 16px rgba(69,56,38,.13)}
    .card-link h3{margin:0 0 5px;font-size:15px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    /* 弹层 */
    .modal{position:fixed;inset:0;background:rgba(30,22,12,.28);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
    .modal.show{display:flex}
    .modal-panel{width:min(860px,100%);max-height:88vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
    pre{white-space:pre-wrap;word-break:break-word;background:#f7f5f0;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <h1>API Health</h1>
      <nav class="actions">
        <button id="refreshBtn" class="btn primary hidden" type="button">刷新</button>
        <button id="loginBtn" class="btn" type="button">登录（SSO）</button>
        <button id="logoutBtn" class="btn hidden" type="button">退出</button>
        <div class="menu">
          <button id="menuToggle" class="btn menu-toggle" type="button" aria-label="更多">⋯</button>
          <div id="menuList" class="menu-list hidden">
            <a href="/">返回首页</a>
            <a id="jsonHealthLink" class="hidden" href="/api/healthz" target="_blank">JSON Health</a>
            <button id="addWechatBtn" class="hidden" type="button">添加新微信</button>
            <button id="coupleEntryBtn" class="hidden" type="button">💗 Couple 入口</button>
          </div>
        </div>
      </nav>
    </header>
    <div id="gateHint" class="band">此页面仅管理员可见。请点右上角「登录（SSO）」。</div>
    <div id="adminContent" class="hidden">
      <div id="statusBar" class="statusbar"></div>
      <section class="band">
        <h2>设备与服务状态</h2>
        <h3 style="margin-top:0">需要关注</h3>
        <div id="attention" class="list muted">加载中...</div>
        <h3>关键指标</h3>
        <div id="summary" class="metrics"></div>
        <h3>外部主机</h3>
        <div id="hosts"></div>
      </section>
      <section class="band">
        <h2>备份与恢复</h2>
        <div id="backupSummary" class="metrics"></div>
        <div class="row" style="margin-top:12px">
          <a class="btn primary" href="/backups/">查看全部备份</a>
        </div>
      </section>
      <section class="band">
        <h2>版本巡检</h2>
        <div id="versionSummary" class="metrics"></div>
        <div class="row" style="margin-top:12px">
          <a class="btn primary" href="/health/versions/">查看版本明细</a>
        </div>
      </section>
      <section class="band">
        <h2>同步与工具</h2>
        <div class="linkgrid">
          <a class="card-link" href="/sync/">
            <article class="card"><h3>统一同步中心</h3><p class="muted" style="margin:0">全部文档与 T+ 作业的运行和步骤。</p></article>
          </a>
          <a class="card-link" href="/tplus-sync/">
            <h3>T+ 同步时间线</h3>
            <p class="muted" style="margin:0">每次同步的统一时间线、变化明细与产出 Excel。</p>
          </a>
          <a class="card-link" href="/exports/">
            <h3>数据导出</h3>
            <p class="muted" style="margin:0">管理导出目录，同步文档，下载数据文件。</p>
          </a>
        </div>
        <div class="row" style="gap:10px;margin-top:12px">
          <button id="addWechatPanelBtn" class="btn primary" type="button">添加新微信</button>
          <a class="btn" href="/couple/" title="Couple">💗 Couple 入口</a>
        </div>
      </section>
    </div>
  </div>
  <div id="detailModal" class="modal">
    <div class="modal-panel">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
        <h3 id="modalTitle" style="margin:0">详情</h3>
        <button id="closeModalBtn" class="btn" type="button">关闭</button>
      </div>
      <div id="modalBody" style="margin-top:12px"></div>
    </div>
  </div>
  <div id="wechatQrModal" class="modal">
    <div class="modal-panel" style="width:min(460px,100%)">
      <div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">添加新微信</h3><button id="closeWechatQrBtn" class="btn" type="button">关闭</button></div>
      <div id="wechatQrBody" style="margin-top:12px"></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button id="refreshWechatQrBtn" class="btn primary" type="button">刷新二维码</button></div>
    </div>
  </div>
  <script src="/common/toast.js"></script>
  <script>
    const API_BASE=location.port==='8080'?'http://localhost:8000':'/api';
    const AUTH_KEYS=['aliecs_auth_token','portal_token','admin_token'];
    let latestStatus=null;
    let latestVersions=null;
    const token=()=>AUTH_KEYS.map((key)=>localStorage.getItem(key)||'').find(Boolean)||'';
    const fmtTime=(value)=>value?new Date(value).toLocaleString():'-';
    const chip=(status)=>`<span class="chip ${status||'degraded'}">${status||'unknown'}</span>`;
    const esc=(value)=>String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function authHeaders(){const headers={'Content-Type':'application/json'};const t=token();if(t)headers.Authorization=`Bearer ${t}`;return headers;}
    async function api(path,opt={}){
      const response=await fetch(`${API_BASE}${path}`,{...opt,headers:Object.assign(authHeaders(),opt.headers||{})});
      const text=await response.text();
      let data={};
      if(text){try{data=JSON.parse(text)}catch{data={raw:text}}}
      if(!response.ok)throw new Error(data.detail||`HTTP ${response.status}`);
      return data;
    }
    const $=(id)=>document.getElementById(id);
    const setAuthToken=(t)=>AUTH_KEYS.forEach((k)=>localStorage.setItem(k,t));
    const clearAuthToken=()=>AUTH_KEYS.forEach((k)=>localStorage.removeItem(k));
    function showError(t){AliECSToast.show(t,'error');}
    function showSuccess(t){AliECSToast.show(t,'success');}
    function clearMessage(){AliECSToast.hide();}
    async function fetchMe(){if(!token())return null;try{return await api('/v1/auth/me');}catch{return null;}}
    const isAdminUser=(me)=>!!me&&(((me.roles||[]).includes('admin'))||((me.permissions||[]).includes('admin.access')));
    function applyGate(me){const admin=isAdminUser(me);$('loginBtn').classList.toggle('hidden',admin);$('logoutBtn').classList.toggle('hidden',!token());$('adminContent').classList.toggle('hidden',!admin);$('gateHint').classList.toggle('hidden',admin);$('refreshBtn').classList.toggle('hidden',!admin);$('jsonHealthLink').classList.toggle('hidden',!admin);$('coupleEntryBtn').classList.toggle('hidden',!admin);$('addWechatBtn').classList.toggle('hidden',!admin);if(admin){refresh();}}
    const ssoLogin=()=>{location.href=`${API_BASE}/v1/auth/oidc/login`;};

    function renderStatusBar(data,versions){
      const t=data.tplus||{},r=data.reconciliation||{},b=data.backups||{},hosts=data.hosts||[];
      const overall=(data.status||'unknown').toLowerCase();
      const dotClass=overall==='ok'?'':(overall==='critical'||overall==='failed'?'bad':'warn');
      const hostsOk=hosts.filter((h)=>h.ok).length;
      const hostBad=hosts.length-hostsOk;
      const behind=((versions||{}).summary||{}).behind||0;
      $('statusBar').innerHTML=[
        `<span><span class="dot ${dotClass}"></span>整体 ${data.status||'unknown'}</span>`,
        `<span class="seg">主机 <b>${hostsOk}/${hosts.length}</b></span>`,
        `<span class="seg">待处理 <b>${t.pending_requests||0}</b></span>`,
        `<span class="seg">失败 <b>${t.failed_requests||0}</b></span>`,
        `<span class="seg">备份 <b>${b.ok||0}/${b.monitored||0}</b></span>`,
        `<span class="seg">差异待审 <b>${r.needs_review||0}</b></span>`
      ].join('')+(hostBad?`<span class="chip failed">主机异常 ${hostBad}</span>`:'')+(b.status&&b.status!=='ok'?`<span class="chip ${b.status==='failed'?'failed':'warning'}">备份 ${b.status}</span>`:'')+(behind?`<span class="chip warning">版本落后 ${behind}</span>`:'');
    }
    function renderBackupSummary(data){
      const b=data.backups||{};
      const state=b.status||'unknown';
      backupSummary.innerHTML=[
        `<article class="metric"><div class="label">整体状态 ${chip(state==='failed'?'failed':(state==='warning'||state==='unknown'?'warning':'ok'))}</div><div class="value">${state}</div><div class="sub">纳管 ${b.monitored||0} / 总账 ${b.total||0}</div></article>`,
        `<article class="metric"><div class="label">正常 / 警告 / 异常</div><div class="value">${b.ok||0} / ${b.warning||0} / ${b.failed||0}</div><div class="sub">未知 ${b.unknown||0}，计划中 ${b.planned||0}</div></article>`,
        `<article class="metric"><div class="label">最近成功</div><div class="value sm">${fmtTime(b.last_success_at)}</div><div class="sub">存储位置与恢复校验进入明细页查看</div></article>`
      ].join('');
    }
    function renderVersions(data){
      const summary=(data||{}).summary||{};
      const s=(key)=>summary[key]||0;
      const checked=s('current')+s('behind')+s('pinned')+s('own')+s('own-mismatch')+s('stale');
      versionSummary.innerHTML=[
        `<article class="metric"><div class="label">整体状态 ${chip(summary.status==='warning'?'warning':'ok')}</div><div class="value">${summary.status||'unknown'}</div><div class="sub">落后 ${s('behind')} · 不一致 ${s('own-mismatch')}</div></article>`,
        `<article class="metric"><div class="label">已核对组件</div><div class="value">${checked}</div><div class="sub">未登记 ${s('unregistered')}</div></article>`,
        `<article class="metric"><div class="label">停滞/未上报</div><div class="value">${s('stale')}</div><div class="sub">长期无版本上报的组件</div></article>`
      ].join('');
    }
    function renderSummary(data){
      const sys=data.system||{},db=data.database||{},t=data.tplus||{},r=data.reconciliation||{},hosts=data.hosts||[];
      summary.innerHTML=[
        `<article class="metric"><div class="label">整体状态 ${chip(data.status)}</div><div class="value">${data.status||'unknown'}</div><div class="sub">${data.service||''}</div></article>`,
        `<article class="metric"><div class="label">数据库 ${chip(db.ok?'ok':'critical')}</div><div class="value">${db.ok?'OK':'异常'}</div><div class="sub">${db.message||''}</div></article>`,
        `<article class="metric"><div class="label">待处理队列</div><div class="value">${t.pending_requests||0}</div><div class="sub">失败 ${t.failed_requests||0}，差异待审 ${r.needs_review||0}</div></article>`,
        `<article class="metric"><div class="label">磁盘</div><div class="value">${sys.disk_percent||0}%</div><div class="sub">内存 ${sys.memory_percent||0}%</div></article>`,
        `<article class="metric"><div class="label">最近 T+ 成功</div><div class="value sm">${fmtTime(t.last_success_at)}</div><div class="sub">${t.last_run?`${t.last_run.module}/${t.last_run.mode}/${t.last_run.status}`:'暂无 run'}</div></article>`,
        `<article class="metric clickable" onclick="scrollToHosts()"><div class="label">外部主机</div><div class="value">${hosts.filter((item)=>item.ok).length}/${hosts.length}</div><div class="sub">点击查看详情</div></article>`
      ].join('');
    }
    function renderAttention(items){
      if(!items||!items.length){attention.innerHTML='<div class="muted">当前没有需要人工关注的项目。</div>';return}
      attention.innerHTML=items.map((item)=>`<div class="attention ${item.level||'warning'}"><strong>${item.code}</strong><br/><span>${item.message||''}</span></div>`).join('');
    }
    function renderHosts(items){
      if(!items||!items.length){hosts.innerHTML='<div class="muted">未配置外部主机探测。</div>';return}
      hosts.innerHTML=`<div class="hostrows">`+items.map((item)=>{
        const meta=[item.status_code?`HTTP ${item.status_code}`:'',item.latency_ms?`${item.latency_ms}ms`:'',item.description||item.message||item.url||''].filter(Boolean).join(' · ');
        return `<div class="hostrow" onclick="openHost('${encodeURIComponent(item.name)}')"><span class="hdot ${item.ok?'':'bad'}"></span><div class="hbody"><div class="hname">${item.name}</div><div class="hmeta">${meta||'-'}</div></div><span class="arrow">›</span></div>`;
      }).join('')+`</div>`;
    }
    function scrollToHosts(){hosts.scrollIntoView({behavior:'smooth',block:'start'});}
    function openModal(title,html){modalTitle.textContent=title;modalBody.innerHTML=html;detailModal.classList.add('show');}
    function closeModal(){detailModal.classList.remove('show');modalBody.innerHTML='';}
    async function openHost(encodedName){
      const name=decodeURIComponent(encodedName);
      try{
        const data=await api(`/v1/ops/hosts/${encodedName}/refresh`);
        openModal(name,`<p>${chip(data.ok?'ok':'failed')} ${data.status_code||''} · ${data.latency_ms||''}ms</p><p class="muted">${data.description||''}</p><pre>${JSON.stringify(data,null,2)}</pre><button class="btn primary" onclick="openHost('${encodedName}')">手动刷新</button>`);
      }catch(error){openModal(name,`<div class="attention critical"><strong>刷新失败</strong><br/>${error.message}</div>`);}
    }
    async function loadStatus(){const response=await fetch(`${API_BASE}/v1/ops/status`,{headers:authHeaders()});if(!response.ok)throw new Error(`HTTP ${response.status}`);return await response.json();}
    async function loadWechatLoginQr(){
      $('wechatQrBody').innerHTML='<div class="muted">正在获取二维码...</div>';
      try{
        const data=await api('/v1/ops/wechat/login-qr');
        const qr=data.qr_image_base64?`<img alt="微信登录二维码" src="${esc(data.qr_image_base64)}" style="display:block;width:260px;max-width:100%;margin:8px auto;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px"/>`:(data.qr_url?`<div style="text-align:center"><a class="btn primary" href="${esc(data.qr_url)}" target="_blank" rel="noreferrer">打开二维码</a></div>`:'');
        $('wechatQrBody').innerHTML=`${qr}<p class="muted" style="text-align:center">等待新用户扫码加入 微信clawbot。</p>${data.expires_at?`<p class="muted" style="text-align:center">过期时间：${esc(data.expires_at)}</p>`:''}`;
      }catch(error){$('wechatQrBody').innerHTML=`<div class="attention critical"><strong>二维码不可用</strong><br/>${esc(error.message)}</div>`;}
    }
    function openWechatQr(){wechatQrModal.classList.add('show');loadWechatLoginQr();}
    function closeWechatQr(){wechatQrModal.classList.remove('show');wechatQrBody.innerHTML='';}
    async function refresh(){
      refreshBtn.disabled=true;
      try{
        latestStatus=await loadStatus();
        let versions=null;
        try{versions=await api('/v1/ops/versions');}catch{versions=null;}
        latestVersions=versions;
        renderStatusBar(latestStatus,versions);
        renderSummary(latestStatus);
        renderBackupSummary(latestStatus);
        renderAttention(latestStatus.attention_items);
        renderHosts(latestStatus.hosts||[]);
        renderVersions(versions||{summary:{},devices:[]});
      }catch(error){attention.innerHTML=`<div class="attention critical"><strong>health_load_failed</strong><br/>${error.message}</div>`;}
      finally{refreshBtn.disabled=false}
    }
    refreshBtn.onclick=refresh;closeModalBtn.onclick=closeModal;detailModal.onclick=(event)=>{if(event.target===detailModal)closeModal();};
    loginBtn.onclick=ssoLogin;
    logoutBtn.onclick=()=>{clearAuthToken();applyGate(null);showSuccess('已退出登录。');};
    coupleEntryBtn.onclick=()=>location.assign('/couple/');
    addWechatBtn.onclick=openWechatQr;addWechatPanelBtn.onclick=openWechatQr;closeWechatQrBtn.onclick=closeWechatQr;refreshWechatQrBtn.onclick=loadWechatLoginQr;wechatQrModal.onclick=(event)=>{if(event.target===wechatQrModal)closeWechatQr();};
    menuToggle.onclick=(e)=>{e.stopPropagation();menuList.classList.toggle('hidden');};
    document.addEventListener('click',(e)=>{if(!e.target.closest('.menu'))menuList.classList.add('hidden');});
    (async()=>{applyGate(await fetchMe());})();
  </script>
</body>
</html>
