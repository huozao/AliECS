<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AliECS · API Health</title>
  <style>
    :root{--bg:#f7f5f0;--panel:#fffdf8;--text:#25211b;--muted:#766f63;--line:#e7dfd0;--good:#3f7a4c;--warn:#a46b1f;--bad:#a6423a;--primary:#6f5e46;--shadow:0 12px 30px rgba(69,56,38,.08)}
    *{box-sizing:border-box}.hidden{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui}.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 56px}.topbar{display:flex;justify-content:space-between;gap:14px;align-items:center;background:rgba(255,253,248,.94);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:16px 18px;margin-bottom:16px}h1{margin:0;font-size:30px}.subtitle{margin:6px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,button{border:0;border-radius:999px;padding:9px 13px;background:#e8dfcf;color:var(--text);font-weight:650;text-decoration:none;cursor:pointer}.btn.primary{background:var(--primary);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.band,.panel{background:rgba(255,253,248,.94);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:16px;margin-bottom:14px}.clickable{cursor:pointer}.metric{font-size:30px;font-weight:800;margin-top:8px}.muted{color:var(--muted)}.chip{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:750}.ok{background:#dfeee3;color:var(--good)}.degraded,.warning{background:#f4ead8;color:var(--warn)}.critical,.failed{background:#f5d7d3;color:var(--bad)}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;font-size:13px;vertical-align:top}th{background:#f2eadc}.list{display:grid;gap:8px}.attention{border-left:4px solid var(--warn);padding:8px 10px;background:#fff;border-radius:8px}.attention.critical{border-left-color:var(--bad)}.modal{position:fixed;inset:0;background:rgba(30,22,12,.28);display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.modal-panel{width:min(860px,100%);max-height:88vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}pre{white-space:pre-wrap;word-break:break-word;background:#f7f5f0;border:1px solid var(--line);border-radius:12px;padding:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit}.card-link{display:block;text-decoration:none;color:inherit;transition:box-shadow .15s}.card-link:hover{box-shadow:0 4px 16px rgba(69,56,38,.13)}.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media (max-width:900px){.grid{grid-template-columns:1fr}.card-grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div><h1>API Health</h1><p class="subtitle">服务器、同步任务与需要人工关注的状态。</p></div>
      <nav class="actions"><a class="btn" href="/">首页</a><a id="jsonHealthLink" class="btn hidden" href="/api/healthz" target="_blank">JSON Health</a><button id="coupleEntryBtn" class="btn hidden" type="button" title="Couple">💗</button><button id="addWechatBtn" class="btn hidden" type="button">添加新微信</button><button id="loginBtn" class="btn" type="button">登录（SSO）</button><button id="logoutBtn" class="btn hidden" type="button">退出登录</button><button id="refreshBtn" class="btn primary hidden" type="button">刷新</button></nav>
    </header>
    <div id="msg" class="attention" style="display:none;margin-bottom:14px"></div>
    <div id="gateHint" class="band">此页面仅管理员可见。请点右上角「登录（SSO）」。</div>
    <div id="adminContent" class="hidden">
      <!-- 区1 设备与服务状态 -->
      <section class="band">
        <h2>设备与服务状态</h2>
        <div id="summary" class="grid"></div>
        <h3>需要关注</h3>
        <div id="attention" class="list muted">加载中...</div>
        <h3 style="margin-top:14px">外部主机</h3>
        <div id="hosts"></div>
      </section>
      <!-- 区2 畅捷通同步 -->
      <section class="band">
        <h2>畅捷通同步</h2>
        <div class="card-grid">
          <a class="card-link panel" href="/tplus-sync/">
            <h3 style="margin:0 0 6px">T+ 同步时间线</h3>
            <p class="muted" style="margin:0">查看每次同步的统一时间线、变化明细与产出 Excel。</p>
          </a>
          <a class="card-link panel" href="/exports/">
            <h3 style="margin:0 0 6px">数据导出</h3>
            <p class="muted" style="margin:0">管理导出目录，同步文档，下载数据文件。</p>
          </a>
        </div>
      </section>
      <!-- 区3 渠道与其他 -->
      <section class="band">
        <h2>渠道与其他</h2>
        <div class="row" style="gap:12px;margin-bottom:10px">
          <button id="addWechatPanelBtn" class="btn primary" type="button">添加新微信</button>
          <a class="btn" href="/couple/" title="Couple">💗 Couple 入口</a>
        </div>
        <p class="muted" style="margin:0">企微 / 飞书等渠道功能后续在此扩展</p>
      </section>
    </div>
  </div>
  <div id="detailModal" class="modal">
    <div class="modal-panel">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
        <h3 id="modalTitle" style="margin:0">详情</h3>
        <button id="closeModalBtn" class="btn" type="button">关闭</button>
      </div>
      <div id="modalBody" style="margin-top:12px"></div>
    </div>
  </div>
  <div id="wechatQrModal" class="modal">
    <div class="modal-panel" style="width:min(460px,100%)">
      <div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">添加新微信</h3><button id="closeWechatQrBtn" class="btn" type="button">关闭</button></div>
      <div id="wechatQrBody" style="margin-top:12px"></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button id="refreshWechatQrBtn" class="btn primary" type="button">刷新二维码</button></div>
    </div>
  </div>
  <script>
    const API_BASE=location.port==='8080'?'http://localhost:8000':'/api';
    const AUTH_KEYS=['aliecs_auth_token','portal_token','admin_token'];
    let latestStatus=null;
    const token=()=>AUTH_KEYS.map((key)=>localStorage.getItem(key)||'').find(Boolean)||'';
    const fmtTime=(value)=>value?new Date(value).toLocaleString():'-';
    const chip=(status)=>`<span class="chip ${status||'degraded'}">${status||'unknown'}</span>`;
    const esc=(value)=>String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function authHeaders(){const headers={'Content-Type':'application/json'};const t=token();if(t)headers.Authorization=`Bearer ${t}`;return headers;}
    async function api(path,opt={}){
      const response=await fetch(`${API_BASE}${path}`,{...opt,headers:Object.assign(authHeaders(),opt.headers||{})});
      const text=await response.text();
      let data={};
      if(text){try{data=JSON.parse(text)}catch{data={raw:text}}}
      if(!response.ok)throw new Error(data.detail||`HTTP ${response.status}`);
      return data;
    }
    const $=(id)=>document.getElementById(id);
    const setAuthToken=(t)=>AUTH_KEYS.forEach((k)=>localStorage.setItem(k,t));
    const clearAuthToken=()=>AUTH_KEYS.forEach((k)=>localStorage.removeItem(k));
    function showError(t){const m=$('msg');if(!m)return;m.textContent=t;m.className='attention critical';m.style.display=t?'block':'none';}
    function showSuccess(t){const m=$('msg');if(!m)return;m.textContent=t;m.className='attention';m.style.display=t?'block':'none';}
    function clearMessage(){const m=$('msg');if(m)m.style.display='none';}
    async function fetchMe(){if(!token())return null;try{return await api('/v1/auth/me');}catch{return null;}}
    const isAdminUser=(me)=>!!me&&(((me.roles||[]).includes('admin'))||((me.permissions||[]).includes('admin.access')));
    function applyGate(me){const admin=isAdminUser(me);$('loginBtn').classList.toggle('hidden',admin);$('logoutBtn').classList.toggle('hidden',!token());$('adminContent').classList.toggle('hidden',!admin);$('gateHint').classList.toggle('hidden',admin);$('refreshBtn').classList.toggle('hidden',!admin);$('jsonHealthLink').classList.toggle('hidden',!admin);$('coupleEntryBtn').classList.toggle('hidden',!admin);$('addWechatBtn').classList.toggle('hidden',!admin);if(admin){refresh();}}
    const ssoLogin=()=>{location.href=`${API_BASE}/v1/auth/oidc/login?rd=${encodeURIComponent(location.pathname+location.search)}`;};
    function renderSummary(data){
      const sys=data.system||{},db=data.database||{},t=data.tplus||{},r=data.reconciliation||{},hosts=data.hosts||[];
      summary.innerHTML=[
        `<article class="panel"><div>整体状态 ${chip(data.status)}</div><div class="metric">${data.status||'unknown'}</div><div class="muted">${data.service||''}</div></article>`,
        `<article class="panel"><div>数据库 ${chip(db.ok?'ok':'critical')}</div><div class="metric">${db.ok?'OK':'异常'}</div><div class="muted">${db.message||''}</div></article>`,
        `<article class="panel"><div>待处理队列</div><div class="metric">${t.pending_requests||0}</div><div class="muted">失败 ${t.failed_requests||0}，差异待审 ${r.needs_review||0}</div></article>`,
        `<article class="panel"><div>磁盘</div><div class="metric">${sys.disk_percent||0}%</div><div class="muted">内存 ${sys.memory_percent||0}%</div></article>`,
        `<article class="panel"><div>最近 T+ 成功</div><div class="metric" style="font-size:18px">${fmtTime(t.last_success_at)}</div><div class="muted">${t.last_run?`${t.last_run.module}/${t.last_run.mode}/${t.last_run.status}`:'暂无 run'}</div></article>`,
        `<article class="panel clickable" onclick="scrollToHosts()"><div>外部主机</div><div class="metric">${hosts.filter((item)=>item.ok).length}/${hosts.length}</div><div class="muted">点击查看详情，可手动刷新</div></article>`
      ].join('');
    }
    function renderAttention(items){
      if(!items||!items.length){attention.innerHTML='<div class="muted">当前没有需要人工关注的项目。</div>';return}
      attention.innerHTML=items.map((item)=>`<div class="attention ${item.level||'warning'}"><strong>${item.code}</strong><br/><span>${item.message||''}</span></div>`).join('');
    }
    function renderHosts(items){
      const rows=(items||[]).map((item)=>`<tr><td>${item.name}</td><td>${chip(item.ok?'ok':'failed')}</td><td>${item.status_code||''}</td><td>${item.latency_ms||''}</td><td>${item.description||item.message||item.url||''}</td><td><button class="btn primary" type="button" onclick="openHost('${encodeURIComponent(item.name)}')">查看/刷新</button></td></tr>`).join('');
      hosts.innerHTML=`<table><thead><tr><th>名称</th><th>状态</th><th>HTTP</th><th>ms</th><th>说明</th><th>详情</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="muted">未配置外部主机探测。</td></tr>'}</tbody></table>`;
    }
    function scrollToHosts(){hosts.scrollIntoView({behavior:'smooth',block:'start'});}
    function openModal(title,html){modalTitle.textContent=title;modalBody.innerHTML=html;detailModal.classList.add('show');}
    function closeModal(){detailModal.classList.remove('show');modalBody.innerHTML='';}
    async function openHost(encodedName){
      const name=decodeURIComponent(encodedName);
      try{
        const data=await api(`/v1/ops/hosts/${encodedName}/refresh`);
        openModal(name,`<p>${chip(data.ok?'ok':'failed')} ${data.status_code||''} · ${data.latency_ms||''}ms</p><p class="muted">${data.description||''}</p><pre>${JSON.stringify(data,null,2)}</pre><button class="btn primary" onclick="openHost('${encodedName}')">手动刷新</button>`);
      }catch(error){openModal(name,`<div class="attention critical"><strong>刷新失败</strong><br/>${error.message}</div>`);}
    }
    async function loadStatus(){const response=await fetch(`${API_BASE}/v1/ops/status`,{headers:authHeaders()});if(!response.ok)throw new Error(`HTTP ${response.status}`);return await response.json();}
    async function loadWechatLoginQr(){
      $('wechatQrBody').innerHTML='<div class="muted">正在获取二维码...</div>';
      try{
        const data=await api('/v1/ops/wechat/login-qr');
        const qr=data.qr_image_base64?`<img alt="微信登录二维码" src="${esc(data.qr_image_base64)}" style="display:block;width:260px;max-width:100%;margin:8px auto;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px"/>`:(data.qr_url?`<div style="text-align:center"><a class="btn primary" href="${esc(data.qr_url)}" target="_blank" rel="noreferrer">打开二维码</a></div>`:'');
        $('wechatQrBody').innerHTML=`${qr}<p class="muted" style="text-align:center">等待新用户扫码加入 微信clawbot。</p>${data.expires_at?`<p class="muted" style="text-align:center">过期时间：${esc(data.expires_at)}</p>`:''}`;
      }catch(error){$('wechatQrBody').innerHTML=`<div class="attention critical"><strong>二维码不可用</strong><br/>${esc(error.message)}</div>`;}
    }
    function openWechatQr(){wechatQrModal.classList.add('show');loadWechatLoginQr();}
    function closeWechatQr(){wechatQrModal.classList.remove('show');wechatQrBody.innerHTML='';}
    async function refresh(){
      refreshBtn.disabled=true;
      try{
        latestStatus=await loadStatus();
        renderSummary(latestStatus);
        renderAttention(latestStatus.attention_items);
        renderHosts(latestStatus.hosts||[]);
      }catch(error){attention.innerHTML=`<div class="attention critical"><strong>health_load_failed</strong><br/>${error.message}</div>`;}
      finally{refreshBtn.disabled=false}
    }
    refreshBtn.onclick=refresh;closeModalBtn.onclick=closeModal;detailModal.onclick=(event)=>{if(event.target===detailModal)closeModal();};
    loginBtn.onclick=ssoLogin;
    logoutBtn.onclick=()=>{clearAuthToken();applyGate(null);showSuccess('已退出登录。');};
    coupleEntryBtn.onclick=()=>location.assign('/couple/');
    addWechatBtn.onclick=openWechatQr;addWechatPanelBtn.onclick=openWechatQr;closeWechatQrBtn.onclick=closeWechatQr;refreshWechatQrBtn.onclick=loadWechatLoginQr;wechatQrModal.onclick=(event)=>{if(event.target===wechatQrModal)closeWechatQr();};
    (async()=>{applyGate(await fetchMe());})();
  </script>
</body>
</html>
